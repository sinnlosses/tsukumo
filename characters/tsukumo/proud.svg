<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 200" width="150" height="200">
  <g id="body">
    <!-- 狐火（署名色。衣装の差し色に追従する） -->
    <g opacity="0.8">
      <path d="M14 92 q-8 -13 0 -22 q5 8 10 2 q5 12 -5 20 q-3 3 -5 0z" fill="var(--outfit-accent, #6fe3cd)"/>
      <path d="M136 64 q-7 -11 0 -18 q4 7 8 2 q5 10 -4 16 q-3 3 -4 0z" fill="var(--outfit-accent, #6fe3cd)"/>
      <path d="M126 34 l3.5 8 l8 3.5 l-8 3.5 l-3.5 8 l-3.5 -8 l-8 -3.5 l8 -3.5z" fill="var(--outfit-accent, #6fe3cd)"/>
    </g>

    <!-- 尻尾（ふさふさ。右うしろから立ち上がる） -->
    <path d="M108 178 q34 -8 40 -56 q6 30 -8 50 q-12 16 -32 16z"
          fill="#e4e8f2" stroke="#23262f" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M124 140 q14 -10 17 -30 q2 20 -9 32z" fill="var(--outfit-accent, #6fe3cd)" opacity="0.5"/>

    <!-- 和装（肩まで） -->
    <path d="M20 200 q4 -52 55 -58 q51 6 55 58z" fill="#20232c" stroke="#101219" stroke-width="2.2"/>
    <path d="M75 142 l-16 58 h32z" fill="#2b2f3a"/>
    <path d="M57 148 q18 11 36 0" stroke="var(--outfit-accent, #6fe3cd)" stroke-width="3.2" fill="none" stroke-linecap="round"/>
    <path d="M75 160 q-6 6 0 12 q6 -6 0 -12z" fill="none" stroke="var(--outfit-accent, #6fe3cd)" stroke-width="2.4"/>

    <!-- 耳（狐。顔より先に描いて後ろに置く） -->
    <path d="M44 62 l-9 -36 l31 18z" fill="#e4e8f2" stroke="#23262f" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M45 55 l-4 -20 l16 10z" fill="#3a3f4d"/>
    <path d="M106 62 l9 -36 l-31 18z" fill="#e4e8f2" stroke="#23262f" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M105 55 l4 -20 l-16 10z" fill="#3a3f4d"/>

    <!-- 顔 -->
    <ellipse cx="75" cy="92" rx="36" ry="34" fill="#fdfdff" stroke="#23262f" stroke-width="2.6"/>

    <!-- 髪（顔より少し暗い銀。前髪で額を覆い、輪郭を出す） -->
    <path d="M39 92 q-3 -44 36 -48 q39 4 36 48 q-4 -20 -14 -27 q-6 13 -19 11 q-11 -2 -16 -12 q-16 8 -23 28z"
          fill="#e4e8f2" stroke="#23262f" stroke-width="2.6" stroke-linejoin="round"/>
    <path d="M58 58 q10 14 26 8" fill="none" stroke="#c3c9d8" stroke-width="2"/>
    <!-- アホ毛（1本） -->
    <path d="M75 45 q-4 -19 10 -24 q-7 11 2 16 q-8 3 -12 8z"
          fill="#e4e8f2" stroke="#23262f" stroke-width="2.4" stroke-linejoin="round"/>

    <!-- 目・口 -->
    <g stroke="#23262f" stroke-width="3.4" fill="none" stroke-linecap="round"><path d="M51 95 q9 -11 18 0"/><path d="M81 95 q9 -11 18 0"/></g>
    <g><path d="M65 109 q10 11 20 0" stroke="#23262f" stroke-width="2.8" fill="none" stroke-linecap="round"/><path d="M69 111 l2.5 6 l4 -6z" fill="#fdfdff"/></g>

    <!-- 頬 -->
    <ellipse cx="51" cy="102" rx="7" ry="4.6" fill="#f4a9a2" opacity="0.6"/>
    <ellipse cx="99" cy="102" rx="7" ry="4.6" fill="#f4a9a2" opacity="0.6"/>

    <!-- >_ のヘアピン（顔にかぶらないよう髪の右端へ） -->
    <g transform="translate(110 70) rotate(16)">
      <rect x="-15" y="-8" width="30" height="16" rx="5" fill="#20232c" stroke="#101219" stroke-width="1.4"/>
      <path d="M-9 -4 l5 4 l-5 4" stroke="var(--outfit-accent, #6fe3cd)" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1 5 h8" stroke="var(--outfit-accent, #6fe3cd)" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <!-- 鈴（ヘアピンから紐で下がる） -->
    <path d="M113 80 q3 8 1 14" stroke="#20232c" stroke-width="2" fill="none"/>
    <circle cx="114" cy="99" r="6.5" fill="#f2cb6e" stroke="#a8802e" stroke-width="1.8"/>
    <path d="M109.5 99 h9" stroke="#a8802e" stroke-width="1.6"/>
    <circle cx="114" cy="102.5" r="1.6" fill="#a8802e"/>
  </g>
</svg>
