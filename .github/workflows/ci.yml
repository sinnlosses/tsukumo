name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: bd を入れる（gastownhall/beads v1.3.1、linux_amd64 を sha256 で固定）
        run: |
          set -euo pipefail
          curl -sSL -o /tmp/bd.tar.gz \
            "https://github.com/gastownhall/beads/releases/download/v1.3.1/beads_1.3.1_linux_amd64.tar.gz"
          echo "3219443a9734b89b93fb16ee8d65844759fa1b3cd3cf139c606b7353cfb0715c  /tmp/bd.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bd"
          tar -xzf /tmp/bd.tar.gz -C "$RUNNER_TEMP/bd" bd
          echo "$RUNNER_TEMP/bd" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
