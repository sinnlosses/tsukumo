[[lanes]]
id = "browser"
title = "ブラウザ"
kind = "runtime"

[[lanes]]
id = "server"
title = "サーバ"
kind = "runtime"

[[lanes]]
id = "external"
title = "外部"
kind = "external"

[[lanes]]
id = "shared"
title = "共有層"
kind = "crosscut"

# ---------------------------------------------------------------------------
# 外の世界

[[boxes]]
id = "claude-code"
title = "Claude Code"
summary = "会話の相手として動き、ツールの呼び出しとメッセージを返す"
purpose = "tsukumo の外で動く別のプロセスなので、境界を越える所だけをサーバの外向きの層に閉じ込める"
overview = "tsukumo は Claude Code を子プロセスとして起こし、依頼を渡してメッセージとツールの呼び出しを受け取る。画面の描画は tsukumo が受け持ち、Claude Code の画面は開かない。"
external = true
lane = "external"
place = { column = 0, row = 0 }
links = { adr = ["docs/architecture/adr/0008-sdk-instead-of-tui.md"], terms = ["セッションドライバ"] }

[[boxes]]
id = "tsukumo-plugins"
title = "tsukumo-plugins"
summary = "会話とタスクの進め方を載せるスキルとエージェントの束を渡す"
purpose = "tsukumo の本体から切り離した別の配布物にして、本体がスキルの中身に依存しないようにする"
overview = "取り込んだプラグイン群を、会話のセッションへ読み込ませる。本体は契約の口と欄だけを見て、スキルの中身は読まない。"
external = true
lane = "external"
place = { column = 0, row = 1 }
links = { adr = ["docs/architecture/adr/0024-no-skill-dependency.md"] }

[[boxes]]
id = "character-pack"
title = "キャラクターパック"
summary = "立ち絵・表情・人格の定義と素材を渡す"
purpose = "キャラクターの中身をコードに書かず、差し替えられる素材と定義として本体の外に置く"
overview = "利用者のホームと同梱の置き場にあるパックを、サーバが読み込む。素材と表情の対応は定義ファイル側が持つ。"
external = true
lane = "external"
place = { column = 0, row = 2 }
links = { adr = [
  "docs/architecture/adr/0014-no-bundled-character-asset.md",
], terms = [
  "キャラクターパック",
] }

# ---------------------------------------------------------------------------
# サーバ

[[boxes]]
id = "server"
title = "サーバ"
summary = "Claude Code を起こして会話の流れを畳み、画面へ配る"
purpose = "外の世界に触れる境界と純粋な判断を機能ごとにまとめ、ブラウザとは実行環境の違いで分ける"
overview = "セッションを持つ機能が各機能の判断を束ね、外の世界の実装を選んで渡すのは配線が受け持つ。機能どうしの import は許した向きだけで、共有の語彙は共有層から読む。"
lane = "server"
place = { column = 1, row = 0 }
links = { adr = [
  "docs/architecture/adr/0019-layer-as-directory.md",
  "docs/architecture/adr/0037-dependency-cruiser-edge-check.md",
], terms = [
  "アダプタ",
] }

[[boxes.children]]
id = "server/wiring"
title = "配線"
summary = "起動の段取りと機能ごとの組み立てを結び、機能の判断と外の世界の実装を引き合わせる"
purpose = "判断と境界を結べる場所を1か所に絞り、機能どうしが直接結び付くのを防ぐ"
overview = "入口が起動の段取りを並べ、機能ごとの組み立てがセッションと手続きの受け口へ渡す関数の組を返す。外の世界の実装を選ぶのはここだけで、ほかの機能は渡されたものを使う。"
paths = ["src/wiring/**", "src/cli.ts", "src/main.ts", "src/types/**"]
links = { adr = ["docs/architecture/adr/0021-feature-state-fold-in-feature.md"] }

[[boxes.children]]
id = "server/core"
title = "共有の判断"
summary = "機能の語彙を名乗らない純粋な判断を、複数の機能へ提供する"
purpose = "読み手が2つ以上ある判断だけを置き、機能へ寄せると生まれる機能どうしの依存を避ける"
overview = "使い捨ての問い合わせの組み立てなど、どの機能の語彙にも属さない判断を持つ。外の世界には触れず、共有層だけを読む。"
paths = ["src/server/core/**"]

[[boxes.children]]
id = "server/adapter"
title = "共有の境界"
summary = "機能の語彙を名乗らない外の世界との境界を、複数の機能へ提供する"
purpose = "ファイルや子プロセスなど外の世界に触る所を1ファイル1境界で集め、判断から隔てる"
overview = "ファイルの書き込みや使い捨ての問い合わせなど、複数の機能が使う境界を持つ。判断の層は読めるが、判断の層からは読まれない。"
paths = ["src/server/adapter/**"]

[[boxes.children]]
id = "server/session"
title = "セッション"
summary = "セッションを持ち、起こし、依頼を受けて各機能の判断を1つの流れに束ねる"
purpose = "各機能の判断を束ねる役を1つの機能に集め、順序と状態の持ち主を1か所にする"
overview = "ドライバやチャット・日記・使用量などの判断を受け取り、会話の1セッションとしての順序と状態を保つ。外の世界の実装は配線から渡される。"
paths = ["src/server/session/**"]

[[boxes.children]]
id = "server/session-driver"
title = "セッションドライバ"
summary = "Claude Code を起こして動かし、返るメッセージを会話の出来事に変換する"
purpose = "Claude Code との接点を1つの機能に閉じ込め、本物と疑似の実装を同じ契約で差し替えられるようにする"
overview = "契約と、SDK を使う実装と、疑似セッションの実装を持つ。答え待ちや続きからの再開もここで扱い、受け取ったメッセージを共有層の出来事に畳んで上へ渡す。"
paths = ["src/server/session-driver/**"]
links = { terms = ["セッションドライバ", "疑似セッション"] }

[[boxes.children]]
id = "server/report"
title = "レポート"
summary = "レポートの記法を受け付けて検査し、書き手へ差し戻しの理由を返す"
purpose = "レポートの文法と検査を1か所で持ち、書き手の外の見張りとして働かせる"
overview = "レポートのツールの受け付けと、本文の記法・部品の検査を持つ。部品の使われ方の記録や文法の説明もここで扱い、基準を外れた書き方は理由を添えて差し戻す。"
paths = ["src/server/report/**"]
links = { adr = ["docs/architecture/adr/0010-report-via-tool.md"], terms = ["最終レポート"] }

[[boxes.children]]
id = "server/work-plan"
title = "ワークプラン"
summary = "作業の計画と段の進みを受け付けて検査し、進み具合を判断する"
purpose = "計画と進みの規則を独立させ、会話の進行を外から見張れるようにする"
overview = "計画を立てるツールと段の返却のツールの説明・判断・差し戻しを持つ。委譲の関門と進み具合の表示の位置もここが決める。"
paths = ["src/server/work-plan/**"]
links = { terms = ["ワークプラン"] }

[[boxes.children]]
id = "server/question"
title = "質問"
summary = "選択肢つきの質問の添え書きを検査し、利用者への質問と突き合わせる"
purpose = "質問の書き方の規約を機能として独立させ、書き手が質問を投げる形をそろえる"
overview = "質問に添える説明の検査と、利用者に出す質問との突き合わせを持つ。質問の書き方の規約もここにまとめる。"
paths = ["src/server/question/**"]

[[boxes.children]]
id = "server/system-prompt"
title = "システムプロンプト"
summary = "Claude Code へ追加する指示文を組み立てる"
purpose = "指示文の組み立てを1つの機能に置き、会話の規約が変わる場所を絞る"
overview = "雑談の作法・レポート・計画・質問の規約を集めて、追加の指示文に組み上げる。セリフの間合いの規約もここで持つ。"
paths = ["src/server/system-prompt/**"]

[[boxes.children]]
id = "server/chat"
title = "雑談"
summary = "雑談の作法と記憶を持ち、会話の記録を残して要約する"
purpose = "仕事の会話と雑談を分け、雑談で積み上がる記憶と定着の仕組みを独立させる"
overview = "雑談の話しかけと作法、会話の保存と要約、覚えたことの管理を持つ。キャラクターの定義は読むが、中身は書かない。"
paths = ["src/server/chat/**"]

[[boxes.children]]
id = "server/character-pack"
title = "キャラクターパック"
summary = "キャラクターパックを選び、読み込み、画面からの編集と立ち絵からの生成を受ける"
purpose = "キャラクターの素材と定義の出入りを1つの機能に集め、コードにキャラクターの中身を持たせない"
overview = "ホームと同梱の置き場にあるパックを探して読み込み、画面からの編集をファイルへ戻す。立ち絵からの生成は使い捨ての問い合わせで行う。"
paths = ["src/server/character-pack/**"]
links = { terms = ["キャラクターパック"] }

[[boxes.children]]
id = "server/diary"
title = "日記"
summary = "キャラクターの日記を書く道具と保存を受け持つ"
purpose = "日記の保存を独立させ、成果の数え方と書き込みの経路を切り離す"
overview = "日記を書くツールと、日ごとの保存を持つ。日記が結ぶ作業の記録はリポジトリの機能から読む。"
paths = ["src/server/diary/**"]
links = { terms = ["日記"] }

[[boxes.children]]
id = "server/achievement"
title = "成果"
summary = "終えたタスクを日ごとに数えて、成果として届ける"
purpose = "成果の数え方を独立させ、タスクの記録の読み方の変更を1か所で受け止める"
overview = "タスクの記録で閉じた課題を読み、日ごとの数に畳む。読めないときは数えられないことをそのまま伝える。"
paths = ["src/server/achievement/**"]
links = { terms = ["成果"] }

[[boxes.children]]
id = "server/usage"
title = "使用量"
summary = "トークンの消費と使える量を記録して集計し、見直しの提案を作る"
purpose = "消費の計測と見直しを独立させ、会話の流れから数字を読むだけの形にする"
overview = "消費の記録・コンテキストの内訳・契約の使用量・進行の計測値を集計する。見直しは使い捨ての問い合わせで提案を作り、前回の結果と見送りを覚える。"
paths = ["src/server/usage/**"]
links = { adr = ["docs/architecture/adr/0029-usage-review-own-query.md"], terms = ["見直し"] }

[[boxes.children]]
