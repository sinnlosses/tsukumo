overview = "tsukumo は、Claude Code を子プロセスとして動かし、キャラクターと一緒に仕事をするための画面を1つのプロセスから出すアプリである。サーバが会話の流れを畳み、ブラウザの画面へ WebSocket 1本で配り、両者が読む語彙と契約を共有層が持つ。外の世界とは、Claude Code・同梱のプラグイン・キャラクターパックだけをやり取りする。"
