<!doctype html>
<!--
  PROTOTYPE（使い捨て）: 触れるレポート。部品の値に、tsukumo が用意した関数を {call, args} で組み込む。
  問い: 書き手が宣言だけを書き、つまみで図と数が tsukumo の見た目のまま動くか。書き手はこの宣言を正しく書けるか。
  開き方: このファイルをブラウザで開く。部品の一覧は report.js（sonnet の書き手が catalog.md だけを読んで書いたもの）。
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>PROTOTYPE: 触れるレポート（関数の組み込み）</title>
    <style>
      :root {
        --ground: #191720;
        --surface: #221f2b;
        --ink: #e8e3ea;
        --accent: #f2b0a0;
        --ink-quiet: color-mix(in srgb, var(--ink) 60%, transparent);
        --ink-soft: color-mix(in srgb, var(--ink) 72%, transparent);
        --rule-soft: color-mix(in srgb, var(--surface), var(--ink) 12%);
        --state-ng: #f2a0a0;
        --series-a: #f2b0a0;
        --series-b: #9cc1ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 24px;
        background: var(--ground);
        color: var(--ink);
        font:
          15px/1.75 "Hiragino Sans",
          "Noto Sans JP",
          system-ui,
          sans-serif;
        display: grid;
        grid-template-columns: minmax(0, 760px) 260px;
        gap: 20px;
        justify-content: center;
      }
      .report {
        background: var(--surface);
        border: 1px solid var(--rule-soft);
        border-radius: 12px;
        padding: 20px 28px;
      }
      h4 {
        margin: 18px 0 6px;
        font-size: 15px;
      }
      p {
        margin: 0 0 10px;
        color: var(--ink-soft);
      }
      .control {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 6px 0 10px;
        padding: 8px 12px;
        border: 1px solid var(--rule-soft);
        border-radius: 8px;
        background: color-mix(in srgb, var(--surface), var(--accent) 5%);
        font-size: 13px;
        color: var(--ink-soft);
      }
      .control input[type="range"] {
        flex: 1;
        accent-color: var(--accent);
      }
      .control input[type="checkbox"] {
        accent-color: var(--accent);
        width: 16px;
        height: 16px;
      }
      .control output {
        font-family: ui-monospace, monospace;
        color: var(--ink);
        min-width: 3em;
        text-align: right;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin: 8px 0 12px;
      }
      .stat {
        border: 1px solid var(--rule-soft);
        border-radius: 8px;
        padding: 10px 12px;
      }
      .stat .value {
        font-size: 22px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .stat .label {
        font-size: 12px;
        color: var(--ink-quiet);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin: 4px 0 12px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        border-bottom: 1px solid var(--rule-soft);
        padding: 4px 8px;
        text-align: left;
      }
      th {
        color: var(--ink-quiet);
        font-weight: 400;
      }
      figure {
        margin: 6px 0 12px;
      }
      figcaption {
        font-size: 13px;
        color: var(--ink-quiet);
        margin-bottom: 4px;
      }
      svg text {
        fill: var(--ink-quiet);
        font-size: 11px;
      }
      .error {
        color: var(--state-ng);
        font:
          12px ui-monospace,
          monospace;
        border: 1px dashed var(--state-ng);
        padding: 2px 6px;
        border-radius: 4px;
      }
      aside {
        font:
          12px/1.6 ui-monospace,
          monospace;
        color: var(--ink-quiet);
        position: sticky;
        top: 24px;
        align-self: start;
      }
      aside pre {
        white-space: pre-wrap;
        background: var(--surface);
        padding: 10px;
        border-radius: 8px;
        color: var(--ink-soft);
      }
    </style>
  </head>
  <body>
    <article class="report" id="report-root"></article>
    <aside>
      <div>データモデル（つまみが書く値）</div>
      <pre id="model"></pre>
      <div>評価の誤り</div>
      <pre id="errors">なし</pre>
    </aside>

    <script src="./report.js"></script>
    <script>
      // 関数のカタログ。書き手は名前で呼ぶだけで、計算するのはここだけ。
      // 数の引数に並びを渡すと要素ごとに計算する（数は並びの長さに広げる）。
      const isList = Array.isArray
      function broadcast(a, b, op) {
        if (!isList(a) && !isList(b)) return op(a, b)
        const n = isList(a) ? a.length : b.length
        return Array.from({ length: n }, (_, i) => op(isList(a) ? a[i] : a, isList(b) ? b[i] : b))
      }
      const FUNCTIONS = {
        add: ({ a, b }) => broadcast(a, b, (x, y) => x + y),
        sub: ({ a, b }) => broadcast(a, b, (x, y) => x - y),
        mul: ({ a, b }) => broadcast(a, b, (x, y) => x * y),
        div: ({ a, b }) => broadcast(a, b, (x, y) => x / y),
        min: ({ a, b }) => broadcast(a, b, Math.min),
        max: ({ a, b }) => broadcast(a, b, Math.max),
        round: ({ x, digits = 0 }) =>
          broadcast(x, digits, (v, d) => Math.round(v * 10 ** d) / 10 ** d),
        sum: ({ values }) => values.reduce((s, v) => s + v, 0),
        countAbove: ({ values, limit }) => values.filter((v) => v > limit).length,
        range: ({ from, to, step = 1 }) =>
          Array.from({ length: Math.floor((to - from) / step) + 1 }, (_, i) => from + i * step),
        if: ({ cond, then, else: otherwise }) => (cond ? then : otherwise),
        gt: ({ a, b }) => broadcast(a, b, (x, y) => x > y),
        lt: ({ a, b }) => broadcast(a, b, (x, y) => x < y),
        format: ({ template, ...rest }) =>
          template.replace(/\{(\w+)\}/g, (_, key) => (key in rest ? fmt(rest[key]) : `{${key}}`)),
        toText: ({ values, suffix = "" }) => values.map((v) => `${v}${suffix}`),
      }

      const components = window.REPORT
      const byId = new Map(components.map((c) => [c.id, c]))
      const model = {}
      for (const c of components) {
        if ((c.component === "Slider" || c.component === "CheckBox") && c.value?.path) {
          model[c.value.path] = c.initial ?? (c.component === "Slider" ? c.min : false)
        }
      }
      let errors = []

      function evaluate(value, where) {
        if (isList(value)) return value.map((v) => evaluate(v, where))
        if (value === null || typeof value !== "object") return value
        if ("path" in value) {
          if (!(value.path in model)) {
            errors.push(`${where}: 無い path ${value.path}`)
            return NaN
          }
          return model[value.path]
        }
        if ("call" in value) {
          const fn = FUNCTIONS[value.call]
          if (!fn) {
            errors.push(`${where}: 無い関数 ${value.call}`)
            return NaN
          }
          const args = Object.fromEntries(
            Object.entries(value.args ?? {}).map(([k, v]) => [k, evaluate(v, where)]),
          )
          try {
            return fn(args)
          } catch (e) {
            errors.push(`${where}: ${value.call} が落ちた (${e.message})`)
            return NaN
          }
        }
        return Object.fromEntries(Object.entries(value).map(([k, v]) => [k, evaluate(v, where)]))
      }

      function fmt(v) {
        return typeof v === "number"
          ? Number.isInteger(v)
            ? String(v)
            : String(Math.round(v * 10) / 10)
          : String(v)
      }
      function el(tag, props = {}, children = []) {
        const node = Object.assign(document.createElement(tag), props)
        for (const child of [].concat(children)) node.append(child)
        return node
      }

      function chartSvg(labels, series) {
        const W = 680,
          H = 200,
          P = 32
        const all = series.flatMap((s) => s.values).filter(Number.isFinite)
        const top = Math.max(...all, 1) * 1.1
        const x = (i) => P + (i * (W - P * 2)) / Math.max(labels.length - 1, 1)
        const y = (v) => H - P - (v / top) * (H - P * 2)
        const colors = ["var(--series-a)", "var(--series-b)"]
        let body = `<line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke="var(--rule-soft)"/>`
        labels.forEach((label, i) => {
          body += `<text x="${x(i)}" y="${H - 10}" text-anchor="middle">${label}</text>`
        })
        series.forEach((s, si) => {
          body += `<polyline fill="none" stroke="${colors[si % 2]}" stroke-width="2" points="${s.values.map((v, i) => `${x(i)},${y(v)}`).join(" ")}"/>`
          s.values.forEach((v, i) => {
            body += `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="${colors[si % 2]}"/><text x="${x(i)}" y="${y(v) - 8}" text-anchor="middle">${fmt(v)}</text>`
          })
          body += `<text x="${W - P}" y="${14 + si * 14}" text-anchor="end" style="fill:${colors[si % 2]}">${s.name}</text>`
        })
        return `<svg viewBox="0 0 ${W} ${H}" width="100%">${body}</svg>`
      }

      function render() {
        errors = []
        const root = document.getElementById("report-root")
        const focused = document.activeElement?.closest?.("[data-id]")?.dataset.id
        root.replaceChildren()
        for (const id of byId.get("root")?.children ?? []) root.append(renderPart(byId.get(id), id))
        if (focused) root.querySelector(`[data-id="${focused}"] input`)?.focus()
        document.getElementById("model").textContent = JSON.stringify(model, null, 2)
        document.getElementById("errors").textContent = errors.length ? errors.join("\n") : "なし"
      }

      function renderPart(c, id) {
        if (!c) return el("div", { className: "error", textContent: `無い部品 ${id}` })
        const v = (key) => evaluate(c[key], `${c.id}.${key}`)
        switch (c.component) {
          case "Heading":
            return el("h4", { textContent: fmt(v("text")) })
          case "Paragraph":
            return el("p", { textContent: fmt(v("text")) })
          case "Slider": {
            const out = el("output", { textContent: fmt(model[c.value.path]) })
            const input = el("input", {
              type: "range",
              min: c.min,
              max: c.max,
              step: c.step ?? 1,
              value: model[c.value.path],
            })
            input.addEventListener("input", () => {
              model[c.value.path] = Number(input.value)
              render()
            })
            const label = el("label", { className: "control" }, [c.label, input, out])
            label.dataset.id = c.id
            return label
          }
          case "CheckBox": {
            const input = el("input", { type: "checkbox", checked: Boolean(model[c.value.path]) })
            input.addEventListener("change", () => {
              model[c.value.path] = input.checked
              render()
            })
            const label = el("label", { className: "control" }, [input, c.label])
            label.dataset.id = c.id
            return label
          }
          case "Stats":
            return el(
              "div",
              { className: "stats" },
              (c.items ?? []).map((item, i) =>
                el("div", { className: "stat" }, [
                  el("div", {
                    className: "value",
                    textContent: fmt(evaluate(item.value, `${c.id}.items[${i}]`)),
                  }),
                  el("div", { className: "label", textContent: item.label }),
                ]),
              ),
            )
          case "Chart": {
            const labels = v("labels")
            const series = (c.series ?? []).map((s, i) => ({
              name: s.name,
              values: evaluate(s.values, `${c.id}.series[${i}]`),
            }))
            const figure = el("figure", {}, [el("figcaption", { textContent: c.title ?? "" })])
            figure.insertAdjacentHTML("beforeend", chartSvg(labels.map(fmt), series))
            return figure
          }
          case "Table":
            return el("table", {}, [
              el(
                "tr",
                {},
                (c.columns ?? []).map((col) => el("th", { textContent: col })),
              ),
              ...evaluate(c.rows, `${c.id}.rows`).map((row) =>
                el(
                  "tr",
                  {},
                  row.map((cell) => el("td", { textContent: fmt(cell) })),
                ),
              ),
            ])
          default:
            return el("div", { className: "error", textContent: `知らない部品 ${c.component}` })
        }
      }

      render()
    </script>
  </body>
</html>
