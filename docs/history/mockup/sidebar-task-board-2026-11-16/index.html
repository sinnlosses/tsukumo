    中身はすべて架空で、実物の会話でも実物のタスクでもない。課題と3案を並べて見比べるページは compare.html。
    ?design=a|b|c                案（A 統一リスト・B 段階グループとサイドシート・C フローボード）
    ?view=rest|task|list|draft|chat  場面（通常・詳細・一覧・ドラフトの分類・雑談）
    ?design=b2                   案B の仕上げ（字を締め、探す欄を常設にし、一覧モードを足したもの。比較は refine.html）

      ?view=list                 一覧モード（ID・題・難しさ・ループ可の表）
      ?type=13|12                行の題の字の大きさ
      ?head=stack|inline         サイドバーの頭の形（題と欄を2行に積む・欄と口を1行にまとめる）
    ?pack=shirasuzu              別のパックの素材と差し色で見る
