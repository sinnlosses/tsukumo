<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>中間レポート: 最新の1件も畳めるようにする</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #141318; color: #ece9ef; font: 14px/1.7 system-ui, "Hiragino Sans", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p { margin: 0 0 18px; color: #b9b4bf; max-width: 980px; }
  section { margin-bottom: 30px; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  h2 small { font-weight: 400; color: #9a95a0; margin-left: 8px; }
  img { display: block; width: 1020px; max-width: 100%; border-radius: 10px; }
</style>
</head>
<body>
<h1>中間レポート: 最新の1件も畳めるようにする</h1>
<p>疑似の場面 work-plan を 16 手目（中間レポート2件・作業中）で止めて 1400×900 で撮った。案の画は、最新の中間レポートも 1 つ前と同じ畳める形（既定は開く）で描くよう分岐を1か所だけ替えたアプリで撮った。</p>
<section><h2>今<small>1/3 は ⌄ で畳めるが、最新の 2/3 は畳む印が無い</small></h2><img src="now.png" alt="今の形" /></section>
<section><h2>案 開いたまま（既定）<small>最新の 2/3 にも ⌄ が付き、1/3 と同じ見出しの1行になる</small></h2><img src="a-open.png" alt="案・開いた形" /></section>
<section><h2>案 最新だけ畳んだ<small>2/3 を押すと1行に畳まれる</small></h2><img src="a-latest-folded.png" alt="案・最新だけ畳んだ形" /></section>
<section><h2>案 両方畳んだ<small>中間レポートが全部1行ずつになる</small></h2><img src="a-all-folded.png" alt="案・両方畳んだ形" /></section>
</body>
</html>
