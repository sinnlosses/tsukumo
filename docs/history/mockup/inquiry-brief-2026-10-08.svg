<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" color="#ddd" style="background:#1e1e24"><rect x="1" y="1" width="478" height="248" fill="none" stroke="currentColor"/><text x="12" y="20" font-size="11" fill="currentColor">お伺い · 質問 · 保存先　　　　　　　　　　1 / 2</text><rect x="12" y="30" width="456" height="44" fill="none" stroke="currentColor" stroke-dasharray="3"/><text x="20" y="47" font-size="11" fill="currentColor">背景: なぜ今聞くか（2〜3文）</text><text x="20" y="64" font-size="11" fill="currentColor">判断の軸: 速さ / 戻しやすさ / 依存の数</text><rect x="12" y="82" width="140" height="36" fill="none" stroke="currentColor" stroke-width="2"/><text x="20" y="104" font-size="11" fill="currentColor">1 ● A する（おすすめ）</text><rect x="12" y="124" width="140" height="36" fill="none" stroke="currentColor"/><text x="20" y="146" font-size="11" fill="currentColor">2 ○ B する</text><rect x="12" y="166" width="140" height="36" fill="none" stroke="currentColor"/><text x="20" y="188" font-size="11" fill="currentColor">3 ○ C する ⚠戻せない</text><rect x="162" y="82" width="306" height="120" fill="none" stroke="currentColor"/><text x="172" y="100" font-size="11" fill="currentColor">A の詳細（フォーカスした1つ）</text><text x="172" y="120" font-size="11" fill="currentColor">＋ 良い点 …</text><text x="172" y="138" font-size="11" fill="currentColor">－ 悪い点 …</text><text x="172" y="160" font-size="11" fill="currentColor">[図: mermaid / 表 / 画像]</text><rect x="12" y="210" width="456" height="28" fill="none" stroke="currentColor" stroke-dasharray="3"/><text x="20" y="228" font-size="11" fill="currentColor">▸ 3つを並べて比べる（軸 × 選択肢の表。畳める）</text></svg>
