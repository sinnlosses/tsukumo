<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>手順の図のワークフローの前の手順 — 場面（?form=now|a|b|c）</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1f1e24;
    --surface: #26252c;
    --ink: #ece9ef;
    --ink-soft: color-mix(in srgb, var(--ink) 72%, transparent);
    --ink-quiet: color-mix(in srgb, var(--ink) 50%, transparent);
    --line: color-mix(in srgb, var(--ink) 13%, transparent);
    --focus: oklch(0.8 0.11 185);
    --focus-weak: color-mix(in oklch, var(--focus) 14%, var(--surface));
    --ok: #6fd08f;
    --warn: #e8a64a;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #141318; font: 14px/1.6 system-ui, "Hiragino Sans", sans-serif; color: var(--ink); }
  .panel { width: 980px; margin: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px 22px; }
  .top { display: flex; justify-content: space-between; color: var(--ink-quiet); font-size: 13px; }
  .badge { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 1px 10px; color: var(--ink-soft); font-size: 12px; }
  .title { display: flex; gap: 10px; align-items: center; margin: 6px 0 14px; font-weight: 600; }
  .done-badge { background: var(--ok); color: #14301e; border-radius: 999px; padding: 0 10px; font-size: 12px; }
  .grid { display: grid; column-gap: 26px; row-gap: 6px; position: relative; }
  .tab { color: var(--ink-quiet); border-bottom: 2px solid var(--line); padding-bottom: 6px; font-size: 13px; line-height: 1.5; }
  .tab small { display: block; font-size: 12px; }
  .tab.now { color: var(--ink); border-color: var(--focus); font-weight: 600; }
  .tab.pre { border-bottom-style: dotted; }
  .col { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
  .box { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
  .box.sel { background: var(--focus-weak); border-color: color-mix(in oklch, var(--focus) 45%, transparent); }
  .box.now { border: 1.5px solid var(--focus); }
  .box.main { border-style: dashed; background: transparent; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
  .time { color: var(--ink-quiet); font-size: 12px; }
  .tag { display: inline-block; margin-top: 4px; background: color-mix(in srgb, var(--ink) 13%, transparent); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--ink-soft); }
  .tag.main { background: color-mix(in oklch, var(--focus) 22%, transparent); color: var(--ink); }
  .note { color: var(--ink-quiet); font-size: 12px; margin-top: 4px; }
  .back { color: var(--warn); font-size: 12px; text-align: center; }
  .prelude { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; padding: 6px 12px; border: 1px dashed var(--line); border-radius: 10px; color: var(--ink-soft); font-size: 13px; }
  .prelude .tag { margin: 0; }
  .prelude .more { margin-left: auto; color: var(--ink-quiet); }
  .legend { margin-top: 18px; color: var(--ink-quiet); font-size: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
  .legend b { color: var(--ink-soft); font-weight: 600; }
</style>
</head>
<body>
<div class="panel" id="panel"></div>
<script>
const form = new URLSearchParams(location.search).get("form") ?? "now"

// 架空の流れ: 着手 9秒 → impl-1 → accept（差し戻し1回）→ retrospect → ship。全部済んだあと。
const agentBox = (name, kind, time, note, extra = "") => `
  <div class="box ${extra}">
    <div class="row"><span class="name"><span class="dot"></span>${name}</span><span class="time">${time}</span></div>
    <span class="tag">${kind}</span>${note ? `<div class="note">${note}</div>` : ""}
  </div>`
const mainBox = (name, time, note, extra = "") => `
  <div class="box main ${extra}">
    <div class="row"><span class="name"><span class="dot"></span>${name}</span><span class="time">${time}</span></div>
    <span class="tag main">メイン</span>${note ? `<div class="note">${note}</div>` : ""}
  </div>`

const fixed = form !== "now"
// 今の形: 自動で選んだ振り返りの箱が光り、送り出しは点線の「済み」だけ。
// 案はどれも、自動の選択では箱を光らせず、全部済んだら送り出しの箱を「いま」の枠で示す。
const retroExtra = fixed ? "" : "sel"
const shipBox = fixed
  ? mainBox("送り出し", "2分39秒", "済み · 手順 3", "now")
  : `<div class="box main"><div class="time" style="font-size:13px">ship<br>済み</div></div>`

const phaseCols = [
  { tab: "impl-1", time: "1分56秒", body: agentBox("実装", "implementer", "4分55秒", "済み · 手順 40") },
  {
    tab: "accept", time: "7分12秒",
    body: agentBox("受け入れ 1", "acceptor", "55秒", "差し戻し") + `<div class="back">↓ 差し戻し</div>` +
      agentBox("直し 1", "implementer", "2分27秒", "済み · 手順 6") + agentBox("受け入れ 2", "acceptor", "43秒", "済み · 手順 13"),
  },
  { tab: "retrospect", time: "28秒", body: agentBox("振り返り", "retrospector", "29秒", "済み · 手順 11", retroExtra) },
  { tab: "ship", time: "2分39秒", body: shipBox, now: true },
]

let prelude = ""
let cols = phaseCols
let template = "repeat(4, minmax(0, 1fr))"
if (form === "a") {
  cols = [{ tab: "着手", time: "9秒", pre: true, body: mainBox("着手", "9秒", "印を立て、計画を確かめ、流れを起こした · 手順 5") }, ...phaseCols]
  template = "minmax(0, 0.8fr) repeat(4, minmax(0, 1fr))"
} else if (form === "b") {
  prelude = `<div class="prelude"><span class="dot"></span><b>着手</b><span class="tag main">メイン</span>印を立て、計画を確かめ、流れを起こした<span class="time">9秒 · 手順 5</span><span class="more">›</span></div>`
} else if (form === "c") {
  cols = [{ tab: "plan", time: "9秒", body: mainBox("計画", "9秒", "済み · 手順 5") }, ...phaseCols]
  template = "repeat(5, minmax(0, 1fr))"
}

const count = form === "c" ? 5 : 4
const tabs = cols.map((c) => `<div class="tab ${c.now ? "now" : ""} ${c.pre ? "pre" : ""}">${c.tab}<small>${c.time}</small></div>`).join("")
const bodies = cols.map((c) => `<div class="col">${c.body}</div>`).join("")
const legend = {
  now: "<b>今:</b> 振り返りの箱が光るのは、下の手元に出すエージェントを自動で選んだ印。送り出しは点線の箱だけで、着手の手順は図に出ない。",
  a: "<b>案A 着手の列:</b> 範囲の前に、メインが受け持つ細い「着手」の列を足す。フェーズに数えない（見出しの下線は点線）。送り出しと同じメインの箱で、両端をメインが挟む形になる。",
  b: "<b>案B 前置きの1行:</b> 列は増やさず、図の上に「着手」の1行を置く。押すと手元に手順を出す。フェーズの並びはそのまま。",
  c: "<b>案C 計画のフェーズ:</b> 着手を work_plan の「範囲の前」のフェーズ（plan）にする。プログレスバーにも区間が出て、フェーズの数が1つ増える。",
}[form]

document.getElementById("panel").innerHTML = `
  <div class="top"><span>依頼の手順</span><span class="badge">${count} フェーズ</span></div>
  <div class="title">ワークフロースクリプト <span class="done-badge">済み 5</span></div>
  ${prelude}
  <div class="grid" style="grid-template-columns:${template}">${tabs}${bodies}</div>
  <div class="legend">${legend}</div>`
</script>
</body>
</html>
