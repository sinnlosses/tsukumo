<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>案A 常設パネル型（使い捨ての試作）</title>
    <!--
      使い捨ての試作。問いは「会話画面の全面改良を、3案のどの構造で進めるか」。この HTML は案A。
      案A: 上の1行のバー・左の舞台・中央の紙・右の常設パネル（タスク｜セッション｜進行）。
      旧い器で常時見えていたもの（タスク一覧・使用量・進行・実行設定）を、舞台と紙を保ったまま常時表示へ戻す。
      ?moment=greet|work|deliver ?pack=shirasuzu|tsukumo|chou|spirit ?open=chars|sessions|tasks|progress|palette|keys ?bar=0
      中身は架空の依頼・架空のタスク・架空のレポートで、実物の会話ではない。
      開き方: このファイルをブラウザで開く。素材は ../../../../characters/ から相対で読む。
      本番のコードではない。テストもエラー処理も持たない。
    -->
    <link rel="stylesheet" href="kit.css" />
    <style>
      #app {
        display: grid;
        grid-template: 48px minmax(0, 1fr) / 328px minmax(0, 1fr) 340px;
      }
      body.panel-closed #app {
        grid-template-columns: 328px minmax(0, 1fr) 12px;
      }
      body.panel-closed .panel {
        display: none;
      }
      .bg {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(90deg, rgb(20 18 26 / 0.08), rgb(20 18 26 / 0.5) 300px, var(--ground) 580px),
          var(--bg-image) left center / auto 100% no-repeat,
          var(--ground);
      }

      /* 上のバー（1行。固定のバーはこれだけ） */
      .top {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px;
        background: rgb(20 18 26 / 0.62);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--rule-quiet);
        white-space: nowrap;
      }
      .who {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        padding: 0 10px 0 4px;
        border-radius: 18px;
        background: var(--raised);
      }
      .who:hover {
        background: var(--raised-2);
      }
      .who b {
        font-size: 14px;
      }
      .crumb {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
      }
      .crumb button {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 30px;
        padding: 0 8px;
        border-radius: 8px;
      }
      .crumb button:hover {
        background: var(--raised);
      }
      .search {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        height: 30px;
        padding: 0 8px 0 10px;
        border-radius: 9px;
        background: var(--raised);
        color: var(--ink-soft);
        font-size: 13px;
      }
      .search:hover {
        background: var(--raised-2);
      }

      /* 舞台: 下から立ち絵・吹き出し・やり取りを連続して積み、上端に今日の灯り */
      .stage {
        grid-area: 2 / 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
        padding: 14px 14px 0;
      }
      .stage .lamp {
        margin-bottom: auto;
      }
      .stage .log {
        margin-top: 12px;
      }
      .stage .prev {
        align-self: flex-start;
        margin-top: 12px;
        background: rgb(20 18 26 / 0.7);
      }
      .stage .bubble {
        margin-top: 10px;
        z-index: 1;
      }
      /* 立ち絵は縦横比のまま置き、吹き出しを頭のすぐ上に付ける（高さを固定すると余白のぶん離れる） */
      .portrait {
        display: block;
        width: 100%;
        height: auto;
        max-height: 50vh;
        margin-top: 2px;
        object-fit: contain;
        object-position: center bottom;
        filter: drop-shadow(0 10px 24px rgb(0 0 0 / 0.5));
      }

      /* 紙 */
      .paper {
        grid-area: 2 / 2;
        display: flex;
        flex-direction: column;
        min-height: 0;
        margin-top: 12px;
        border-radius: 16px 16px 0 0;
        background: var(--surface);
        box-shadow:
          0 0 0 1px var(--rule-quiet),
          0 20px 60px rgb(0 0 0 / 0.4);
      }
      .p-top {
        display: flex;
        align-items: flex-start;
        gap: 16px;
        padding: 14px 28px 12px;
        border-bottom: 1px solid var(--rule-quiet);
      }
      .stepper {
        display: flex;
        flex: 1;
      }
      .stepper li {
        flex: 1;
        display: grid;
        grid-template: 22px auto / 22px minmax(0, 1fr);
        gap: 4px 6px;
        align-items: center;
      }
      .stepper li::after {
        content: "";
        grid-area: 1 / 2;
        height: 2px;
        margin-right: 6px;
        border-radius: 1px;
        background: var(--raised-2);
      }
      .stepper li.done::after {
        background: var(--accent);
      }
      .stepper li:last-child::after {
        visibility: hidden;
      }
      .stepper .n {
        grid-area: 1 / 1;
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: var(--raised-2);
        color: var(--ink-soft);
        font: 700 12px/1 var(--mono);
      }
      .stepper .done .n {
        background: var(--accent);
        color: var(--on-accent);
      }
      .stepper .now .n {
        background: none;
        color: var(--accent);
        box-shadow: 0 0 0 2px var(--accent);
      }
      .stepper .cap {
        grid-area: 2 / 1 / 3 / 3;
        font-size: 12.5px;
        white-space: nowrap;
      }
      .stepper .todo .cap {
        color: var(--ink-quiet);
      }
      .stepper .now .cap {
        font-weight: 700;
      }
      .p-top .total {
        display: grid;
        justify-items: end;
        gap: 4px;
        font-size: 12.5px;
        color: var(--ink-quiet);
        white-space: nowrap;
      }
      .p-top .total b {
        font: 700 15px/22px var(--mono);
        color: var(--ink);
      }
      .paper-scroll {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 18px 32px 24px;
      }
      .paper-scroll > * {
        max-width: 46em;
      }
      .dock {
        padding: 0 20px 16px;
      }

      /* 待機の紙: 推薦3件 */
      .welcome .w-head {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 10px 0 18px;
      }
      .welcome h1 {
        font-size: 22px;
        line-height: 1.4;
      }
      .welcome .w-head p {
        font-size: 13px;
      }
      .recs {
        display: grid;
        gap: 8px;
      }
      .rec {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto auto;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        background: var(--raised);
        text-align: left;
      }
      .rec:hover {
        background: var(--raised-2);
      }
      .recs li:first-child .rec {
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 55%, transparent);
        background: color-mix(in srgb, var(--surface) 88%, var(--accent));
      }
      .rec b {
        display: block;
        font-size: 15px;
      }
      .rec .m {
        display: block;
        font-size: 12.5px;
        color: var(--ink-quiet);
      }

      /* 右の常設パネル */
      .panel {
        grid-area: 2 / 3;
        display: flex;
        flex-direction: column;
        min-height: 0;
        margin: 12px 12px 0;
        border-radius: 16px 16px 0 0;
        background: rgb(33 30 41 / 0.88);
        -webkit-backdrop-filter: blur(18px);
        backdrop-filter: blur(18px);
        box-shadow: 0 0 0 1px var(--rule-quiet);
      }
      .tabs {
        display: flex;
        gap: 2px;
        padding: 8px 8px 0;
        border-bottom: 1px solid var(--rule-quiet);
      }
      .tabs button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 34px;
        padding: 0 12px;
        border-radius: 8px 8px 0 0;
        font-size: 13px;
        color: var(--ink-quiet);
      }
      .tabs button[aria-selected="true"] {
        color: var(--ink);
        font-weight: 700;
        box-shadow: inset 0 -2px 0 var(--accent);
      }
      .tabs small {
        font: 12px/1 var(--mono);
        color: var(--ink-quiet);
      }
      .tabbody {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 8px;
      }
      .panel-foot {
        display: flex;
        gap: 10px;
        padding: 8px 12px;
        border-top: 1px solid var(--rule-quiet);
        font-size: 12px;
        color: var(--ink-quiet);
        white-space: nowrap;
        overflow: hidden;
      }
      .filter {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 2px 2px 8px;
      }
      .trow {
        position: relative;
        display: grid;
        gap: 2px;
        padding: 9px 10px;
        border-radius: 10px;
      }
      .trow:hover {
        background: var(--raised);
      }
      .trow[aria-selected="true"] {
        background: var(--raised-2);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .trow .meta {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .trow .title {
        font-size: 13.5px;
        line-height: 1.5;
      }
      .trow .go {
        position: absolute;
        right: 8px;
        top: 7px;
        display: none;
      }
      .trow:hover .go,
      .trow[aria-selected="true"] .go {
        display: inline-flex;
      }
      .doing {
        margin-bottom: 8px;
        padding: 10px 12px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--surface) 86%, var(--accent));
        font-size: 13px;
      }
      .doing .segbar {
        margin-top: 8px;
      }
      .s-search {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 34px;
        margin-bottom: 6px;
        padding: 0 10px;
        border-radius: 9px;
        background: rgb(0 0 0 / 0.26);
        color: var(--ink-quiet);
      }
      .s-search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        font-size: 13px;
      }
      .srow .last {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 12.5px/1.6 var(--voice);
        color: var(--ink-soft);
      }
      .srow {
        align-items: start;
      }
      .srow .st {
        margin-top: 3px;
      }
      .pg-head {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        padding: 6px 6px 8px;
        font-size: 13.5px;
      }
      .tabbody > .segbar {
        margin: 0 6px 12px;
      }
      .tl li {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr);
        gap: 10px;
        padding: 0 6px 14px;
        position: relative;
      }
      .tl li::before {
        content: "";
        position: absolute;
        left: 13.5px;
        top: 20px;
        bottom: 0;
        width: 1px;
        background: var(--rule);
      }
      .tl li:last-child::before {
        display: none;
      }
      .tl .st {
        margin-top: 3px;
      }
      .tl b {
        font-size: 13.5px;
      }
      .tl .todo b {
        color: var(--ink-quiet);
        font-weight: 400;
      }
      .tl p {
        font-size: 12.5px;
        line-height: 1.6;
        color: var(--ink-soft);
      }
      .tl .lane {
        display: grid;
        grid-template-columns: 16px minmax(0, 1fr) auto;
        gap: 8px;
        align-items: start;
        margin-top: 6px;
        padding: 7px 9px;
        border-radius: 9px;
        background: var(--raised);
        font-size: 12.5px;
        line-height: 1.5;
      }
      .empty {
        padding: 18px 10px;
        font-size: 13px;
        color: var(--ink-quiet);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="kit.js"></script>
    <script>
      const app = document.getElementById("app")
      const { icon, kbd, st } = K
      let tab = "tasks"
      let lastMoment = ""
      let taskSel = 0

      function topBar() {
        const p = K.pack()
        const m = K.state.moment
        const pl = K.plan()
        const pill = m === "work" ? `<span class="badge now">作業中 ${pl.now}/${pl.total}</span>` : m === "deliver" ? `<span class="badge ok">${icon("check", 13)}完了</span>` : `<span class="chip">依頼を待機中</span>`
        return `<header class="top">
          <button class="who" popovertarget="charPop" title="キャラクターを切替（⌃1–4）"><img class="face" width="28" height="28" alt="" src="${K.face(p)}"><b>${p.name}</b>${icon("chev", 14)}</button>
          <span class="crumb"><span class="quiet">tsukumo-task</span><span class="quiet">/</span><button data-open="sessions" title="セッションを切替（⌘O）"><b>${m === "greet" ? "新規セッション" : pl.title}</b>${icon("chev", 14)}</button></span>
          ${pill}
          <span class="grow"></span>
          <span class="seg" role="group" aria-label="モード"><button aria-pressed="true">仕事</button><button>雑談</button></span>
          <span class="meters" title="使用量"><span class="meter"><span class="ring" style="--p:61"></span>文脈 <b>61%</b></span><span class="meter"><span class="ring" style="--p:34"></span>5h <b>34%</b></span><span class="meter"><span class="ring" style="--p:61"></span>7d <b>61%</b></span></span>
          <button class="search" data-open="palette">${icon("search", 15)}検索 ${kbd("⌘ K")}</button>
          <button class="icon-btn" id="panelBtn" title="パネルを開閉（⌘B）">${icon("panel", 17)}</button>
          <button class="icon-btn" title="設定（⌘,）">${icon("sliders", 17)}</button>
        </header>`
      }
      function stage() {
        const p = K.pack()
        const prev = K.state.moment === "greet" ? `<button class="chip prev" data-session="s2">${st("ok")}前回: 余白の尺度を8段に整理</button>` : ""
        return `<aside class="stage" aria-label="舞台">${K.lampHtml()}${prev}${K.logHtml()}${K.bubbleHtml()}<img class="portrait" alt="${p.name}の立ち絵" src="${K.portrait()}"></aside>`
      }
      function stepper() {
        const pl = K.plan()
        return `<div class="p-top"><ol class="stepper" aria-label="進行">${pl.phases
          .map((ph) => `<li class="${ph.state}"><span class="n">${ph.state === "done" ? icon("check", 13) : ph.n}</span><span class="cap">${ph.name}${ph.lanes && ph.state === "now" ? ' <span class="quiet">並列2</span>' : ""} <span class="mono quiet">${ph.dur}</span></span></li>`)
          .join("")}</ol><div class="total"><b>${pl.elapsed}</b><span>${K.state.moment === "work" ? "経過" : "所要"}</span></div></div>`
      }
      function welcome() {
        const recs = K.tasks().filter((t) => t.rec)
        return `<div class="welcome"><div class="w-head"><img class="face" width="44" height="44" alt="" src="${K.face()}"><div><h1>何から始める？</h1><p class="quiet">推薦は ${kbd("1")} ${kbd("2")} ${kbd("3")} で開始。タスクは右の一覧か ${kbd("⌘ J")}、検索は ${kbd("⌘ K")}。</p></div></div>
          <ol class="recs">${recs.map((t, i) => `<li><button class="rec" data-task="${t.id}">${kbd(String(i + 1))}<span><b>${t.title}</b><span class="m"><span class="mono">${t.id}</span>　${t.why}</span></span><span class="size">${t.size}</span><span class="btn tonal sm">開始</span></button></li>`).join("")}</ol></div>`
      }
      function paper() {
        const m = K.state.moment
        return `<main class="paper">${m === "greet" ? "" : stepper()}<div class="paper-scroll">${m === "greet" ? welcome() : m === "work" ? K.workHtml() : K.reportHtml()}</div><div class="dock">${K.composerHtml({ rows: m === "greet" ? 3 : 2 })}</div></main>`
      }

      function tasksTab() {
        const all = K.tasks()
        const n = (s) => all.filter((t) => s.includes(t.state)).length
        const ready = all.filter((t) => t.state === "ready")
        const working = K.state.moment === "work"
        const doing = all.find((t) => t.state === "doing")
        taskSel = Math.min(taskSel, ready.length - 1)
        return `${doing ? `<div class="doing"><div class="quiet"><span class="mono">${doing.id}</span>　進行中</div><b>${doing.title}</b>${K.segbar()}</div>` : ""}
          <div class="filter"><span class="chip" aria-pressed="true">着手できる ${n(["ready"])}</span><span class="chip">待ち ${n(["ask", "blocked"])}</span><span class="chip">完了 ${n(["done"])}</span></div>
          <ul>${ready
            .map(
              (t, i) => `<li class="trow" data-i="${i}" aria-selected="${i === taskSel}"><div class="meta"><span class="mono">${t.id}</span><span class="size">${t.size}</span>${t.rec ? `<span>${icon("spark", 13)}</span><span>推薦</span>` : ""}</div><div class="title">${t.title}</div>
              <button class="btn primary sm go" data-task="${t.id}" ${working ? 'disabled title="ターン中は依頼できない"' : ""}>依頼 ${kbd("⏎")}</button></li>`,
            )
            .join("")}</ul>
          <div class="group-label">待ち</div>
          <ul>${all
            .filter((t) => ["ask", "blocked"].includes(t.state))
            .map((t) => `<li class="trow"><div class="meta">${st(t.state === "ask" ? "ask" : "todo")}<span class="mono">${t.id}</span><span>${t.note}</span></div><div class="title">${t.title}</div></li>`)
            .join("")}</ul>`
      }
      function sessionsTab() {
        const list = K.sessions()
        let g = ""
        return `<div class="s-search">${icon("search", 15)}<input type="text" id="sQuery" placeholder="セッションを検索" aria-label="セッションを検索"></div>
          <button class="row" data-act="newSession">${icon("plus", 16)}<span class="t">新規セッション</span>${kbd("⌘ ⇧ O")}</button>
          ${list
            .map((s) => {
              const head = s.group !== g ? `<div class="group-label">${(g = s.group)}</div>` : ""
              return `${head}<button class="row srow" data-session="${s.id}" aria-selected="${Boolean(s.open)}">${st(s.state)}<span><span class="t">${s.title}</span><span class="m">${s.when}・依頼 ${s.turns} 件${s.task ? "・" + s.task : ""}${s.open ? "・表示中" : ""}</span><span class="last">「${s.last}」</span></span><span></span></button>`
            })
            .join("")}
          <div class="group-label">ほかの部屋</div>
          <button class="row srow" disabled title="別のウィンドウで使用中">${st("now")}<span><span class="t">決まりの文章を 40% 削減</span><span class="m">tsukumo-plugins・別のウィンドウで使用中</span></span><span></span></button>`
      }
      function progressTab() {
        if (K.state.moment === "greet") return `<div class="empty">進行中の作業は無い。依頼すると、段ごとの進行と、委譲した役の状況がここに並ぶ。</div>`
        const pl = K.plan()
        return `<div class="pg-head"><b>${pl.title}</b><span class="mono quiet">${pl.now}/${pl.total}・${pl.elapsed}</span></div>${K.segbar(pl)}
          <ol class="tl">${pl.phases
            .map(
              (ph) => `<li class="${ph.state}">${st(ph.state)}<div><b>${ph.n} ${ph.name}</b> <span class="mono quiet">${ph.dur}</span>${ph.state === "todo" ? "" : `<p>${ph.sum}</p>`}${
                ph.lanes && ph.state !== "todo" ? ph.lanes.map((l) => `<div class="lane">${st(l.state)}<span><b>${l.who}</b>　${l.name}<br><span class="quiet">${l.line}</span></span><span class="mono quiet">${l.dur}</span></div>`).join("") : ""
              }</div></li>`,
            )
            .join("")}</ol>`
      }
      function panel() {
        const ready = K.tasks().filter((t) => t.state === "ready").length
        const T = [
          ["tasks", `タスク <small>${ready}</small>`],
          ["sessions", "セッション"],
          ["progress", "進行"],
        ]
        return `<aside class="panel" aria-label="パネル"><div class="tabs" role="tablist">${T.map(([id, l]) => `<button role="tab" data-tab="${id}" aria-selected="${tab === id}">${l}</button>`).join("")}</div>
          <div class="tabbody" role="tabpanel">${tab === "tasks" ? tasksTab() : tab === "sessions" ? sessionsTab() : progressTab()}</div>
          <div class="panel-foot"><span>${kbd("⌘ J")} ${kbd("⌘ O")} ${kbd("⌘ I")} タブを選択</span><span class="grow"></span><span>${kbd("⌘ B")} 開閉</span></div></aside>`
      }

      function render() {
        const m = K.state.moment
        if (m !== lastMoment) {
          tab = m === "work" ? "progress" : "tasks"
          lastMoment = m
        }
        app.innerHTML = `<div class="bg"></div>${topBar()}${stage()}${paper()}${panel()}`
      }
      function setTab(id) {
        document.body.classList.remove("panel-closed")
        K.closeAll()
        tab = id
        render()
        if (id === "sessions") document.getElementById("sQuery")?.focus()
        else document.activeElement?.blur()
      }
      app.addEventListener("click", (e) => {
        const t = e.target.closest("[data-tab]")
        if (t) return setTab(t.dataset.tab)
        if (e.target.closest("#panelBtn")) return document.body.classList.toggle("panel-closed")
        const r = e.target.closest(".trow[data-i]")
        if (r && !e.target.closest("button")) {
          taskSel = Number(r.dataset.i)
          render()
        }
      })

      K.pop("charPop", () => `<div class="group-label">キャラクター</div>${K.PACKS.map((p, i) => `<button class="row" data-pack="${p.id}" aria-selected="${p.id === K.state.pack}"><img class="face" width="36" height="36" alt="" src="${K.face(p)}"><span><span class="t">${p.name}</span><span class="m">${p.tagline}</span></span>${kbd("⌃ " + (i + 1))}</button>`).join("")}<div class="foot">素材・表情の編集と新規作成は「キャラクターを管理」から</div>`)

      K.hooks.sessions = () => setTab("sessions")
      K.hooks.tasks = () => setTab("tasks")
      K.hooks.progress = () => setTab("progress")
      K.hooks.chars = () => document.querySelector(".who").click()
      K.hooks.extraKeys = [["⌘ B", "右のパネルを開閉"]]
      const moveTask = (d) => () => {
        if (tab !== "tasks") return
        const n = K.tasks().filter((t) => t.state === "ready").length
        taskSel = (taskSel + d + n) % n
        render()
      }
      const startRec = (i) => () => {
        const t = K.tasks().filter((x) => x.rec)[i]
        if (K.state.moment === "greet" && t) K.act.startTask(t.id)
      }
      K.keys({
        "mod+b": () => document.body.classList.toggle("panel-closed"),
        "plain:down": moveTask(1),
        "plain:up": moveTask(-1),
        "plain:enter": () => {
          const t = K.tasks().filter((x) => x.state === "ready")[taskSel]
          if (tab === "tasks" && t) K.act.startTask(t.id)
        },
        "plain:1": startRec(0),
        "plain:2": startRec(1),
        "plain:3": startRec(2),
      })
      K.protoBar("a")
      K.onChange(render)
      render()
      K.autoOpen()
    </script>
  </body>
</html>
