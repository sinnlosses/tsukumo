<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>レポートの紙面 値の見本 — 3場面 × 2幅 × 3案（2026-10-17）</title>
<style>
/* 値の見本。地・字・差し色は theme.css の既定（差し色は白鈴パックの値）。架空の中身だけを使い、実物の会話は写さない。
   振る値は3つの束（クラス .v-A / .v-B / .v-C）で切り替える:
     A 静か   : 拾う字 14:1 ・ ## 19px ・ あきの格子 12 / 24（4px 系）
     B 提案   : 拾う字 15:1 ・ ## 21px ・ あきの格子 13 / 26（半行系）
     C はっきり: 拾う字 16:1 ・ ## 22px ・ あきの格子 13 / 26
   地の文 42em・罫 1.3:1・表の左揃え・note の地の段差・図表の題（下・中央・1段）は振らない。 */
:root{
  --ground:#191720; --surface:#221f2b; --ink:#e8e3ea; --accent:#f2b0a0;
  --ink-soft: color-mix(in srgb, var(--ink) 72%, transparent);
  --ink-quiet: color-mix(in srgb, var(--ink) 60%, transparent);
  --rule: color-mix(in srgb, var(--surface), var(--ink) 32%);
  --rule-soft: color-mix(in srgb, var(--surface), var(--ink) 12%);
  --rule-quiet: color-mix(in srgb, var(--surface), var(--ink) 6%);
  --rule-accent: color-mix(in srgb, var(--rule), var(--accent) 60%);
  --surface-raised: color-mix(in srgb, var(--ink) 10%, transparent);
  --surface-accent: color-mix(in srgb, var(--surface), var(--accent) 12%);
  --state-ok:#7ee081; --state-warn:#e3c766; --state-ng:#f2a0a0; --state-ask:#c7aef0; --state-info:#9cc1ee;
  --font-sans: system-ui, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --font-code: "IBM Plex Mono", var(--font-mono);
  --fs-sub:17px; --fs-body:15px; --fs-dense:14px; --fs-caption:13px; --fs-label:12px;
  --measure:42em;
}
.v-A{--ink-bright:#f1eef2; --fs-section:19px; --fs-headline:19px; --lh-body:24px; --gap:12px; --gap-2:24px; --gap-4:48px}
.v-B{--ink-bright:#f7f6f8; --fs-section:21px; --fs-headline:21px; --lh-body:26px; --gap:13px; --gap-2:26px; --gap-4:52px}
.v-C{--ink-bright:#fefefe; --fs-section:22px; --fs-headline:22px; --lh-body:26px; --gap:13px; --gap-2:26px; --gap-4:52px}

body{margin:0;padding:32px;background:#17161e;color:var(--ink);font-family:var(--font-sans);font-size:15px;line-height:1.6}
h1.mock-title{margin:0 0 4px;font-size:20px;font-weight:600;color:#f7f6f8}
.mock-caption{font-size:12.5px;color:var(--ink-quiet);margin:0 0 12px;max-width:80em}
.mock-group{margin:0 0 56px}
.mock-group > h2{margin:0 0 4px;font-size:16px;color:#f7f6f8}
.mock-row{display:flex;flex-direction:column;gap:32px;align-items:flex-start}
.mock-label{font-size:12px;font-family:var(--font-mono);color:var(--ink-quiet);margin:0 0 6px}

/* ===== 画面の器（メインビューの領域を実寸で切り出す） ===== */
.pane{box-sizing:border-box;background:var(--surface);border:1px solid var(--rule);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.pane.w1400{width:1004px} .pane.w1920{width:1340px}
.pane.first.w1400{height:512px} .pane.first.w1920{height:692px}
.strip{flex:none;display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 22px;border-bottom:1px solid var(--rule-quiet);font-size:13px;color:var(--ink-soft)}
.strip .dot{width:8px;height:8px;border-radius:50%;background:var(--state-ok)}
.strip .right{margin-left:auto;display:flex;gap:16px;align-items:center}
.strip .mono{font-family:var(--font-mono);font-size:12px;color:var(--ink-quiet)}
.strip .steps{padding:4px 12px;border:1px solid var(--rule);border-radius:999px;color:var(--ink);font-size:13px}
.turn-body{flex:1;min-height:0;display:grid;grid-template-columns:232px minmax(0,1fr);overflow:hidden}
.rail{border-right:1px solid var(--rule-quiet);padding:14px 10px;font-size:13px;color:var(--ink-quiet)}
.rail .head{display:flex;justify-content:space-between;padding:0 10px 10px;font-size:12px}
.rail .item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:var(--surface-raised);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .item::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.rail .sub{padding:6px 12px 6px 26px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail .sub.cur{color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
.content{min-width:0;overflow:hidden;padding:18px 24px 24px 24px}

/* ===== レポート本体 ===== */
.report{display:grid;grid-template-columns:minmax(0,var(--measure)) minmax(0,1fr);column-gap:28px;font-size:var(--fs-body);line-height:var(--lh-body);color:var(--ink);
  text-autospace:normal;text-spacing-trim:trim-start;line-break:strict;font-kerning:normal;font-synthesis:weight;overflow-wrap:anywhere}
.report > *{grid-column:1}
.report > .wide{grid-column:1 / -1}
.report p{margin:0 0 var(--gap);text-wrap:pretty}
.report code{font-family:var(--font-code);font-size:.88em;background:var(--surface-raised);padding:1px 5px;border-radius:4px;color:var(--ink);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.report a.path{color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:3px}
.report strong{color:var(--ink-bright);font-weight:600}

/* 判決の頭 */
.catalog{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;margin:0 0 6px;font-size:var(--fs-label);color:var(--ink-quiet)}
.catalog .sep{color:var(--rule)}
.catalog .id{font-family:var(--font-mono);color:var(--accent)}
.catalog .done{color:var(--accent);font-weight:600}
.catalog .meta{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.catalog .meta .plus{color:var(--state-ok)} .catalog .meta .minus{color:var(--state-ng)}
.headline{margin:0 0 var(--gap);font-size:var(--fs-headline);line-height:1.45;font-weight:700;color:var(--ink-bright);word-break:auto-phrase;text-wrap:balance;letter-spacing:.01em}
.conclusion{margin:0 0 var(--gap-2)}
.conclusion .why{color:var(--ink-soft)}
.signals{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin:0 0 var(--gap);padding:9px 0;border-top:1px solid var(--rule-soft);border-bottom:1px solid var(--rule-soft);font-size:var(--fs-caption);line-height:20px;color:var(--ink-soft)}
.signals .sig b{font-weight:600;color:var(--ink-bright)}
.signals .ok{color:var(--state-ok);font-family:var(--font-mono);font-size:12px;font-weight:700}
.signals .ask{color:var(--state-ask);font-family:var(--font-mono);font-size:12px;font-weight:700}
.signals .n{font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.signals .fav{margin-left:auto;display:inline-flex;gap:7px;align-items:center;color:var(--ink)}
.signals .fav::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.checks{margin:0 0 var(--gap-2);font-size:var(--fs-caption);line-height:20px}
.check{display:grid;grid-template-columns:7em minmax(0,1fr);column-gap:12px;padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.check:last-child{border-bottom:none}
.check .mk{font-family:var(--font-mono);font-size:12px;white-space:nowrap}
.check.ask .mk{color:var(--state-ask);font-weight:700}
.check.ask .lb{color:var(--ink)}
.check .how{color:var(--ink-soft)}
.check .how b{font-weight:500;color:var(--ink-soft)}
.check.rest .mk{color:var(--state-ok)}
.check.rest .lb{color:var(--ink-quiet)}

/* 節の見出し: 上は下の4倍。罫は ## だけ */
.report h2{margin:var(--gap-4) 0 var(--gap);padding-bottom:6px;font-size:var(--fs-section);line-height:1.4;font-weight:700;color:var(--ink-bright);border-bottom:1px solid var(--rule-accent);word-break:auto-phrase;text-wrap:balance;letter-spacing:.01em;font-feature-settings:"palt"}
.report h2.after-head{margin-top:var(--gap-2)}
.report h3{margin:var(--gap-2) 0 var(--gap);font-size:var(--fs-sub);line-height:1.4;font-weight:700;color:var(--ink-bright)}

/* 図と表の題: 今のまま（下・中央・12px・1段）。判断3 = A */
.cap{margin:6px 0 var(--gap-2);text-align:center;font-size:var(--fs-label);line-height:18px;color:var(--ink-soft)}
.cap .no{font-family:var(--font-mono);color:var(--ink-quiet);margin-right:8px}
.figure{margin:0}
.figure svg{display:block;max-width:100%;margin:0 auto}
.figure .legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;margin-top:8px;font-size:var(--fs-label);line-height:18px;color:var(--ink-quiet)}
.figure .legend i{display:inline-block;vertical-align:-2px;margin-right:6px}

/* 表: 左揃え・行罫は 1.3:1・見出し行だけ一段濃い */
.report table{border-collapse:collapse;width:auto;max-width:100%;margin:0;font-size:var(--fs-dense);line-height:20px}
.report th{text-align:left;font-weight:500;font-size:var(--fs-caption);color:var(--ink-soft);padding:0 20px 6px 0;border-bottom:1px solid var(--rule);white-space:nowrap}
.report td{padding:6px 20px 6px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.report tr:last-child td{border-bottom:none}
.report th:last-child,.report td:last-child{padding-right:0}
.report td.num,.report th.num{text-align:right;font-variant-numeric:tabular-nums}
.report tr.rest td{color:var(--ink-quiet);font-size:var(--fs-caption)}
.from{color:var(--ink-quiet)}
.st{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-caption)}
.st::before{content:"✓";font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--state-ok)}
.st.ask::before{content:"?";color:var(--state-ask)}

.report ul.labeled{list-style:none;margin:0 0 var(--gap-2);padding:0}
.report ul.labeled li{display:grid;grid-template-columns:9em minmax(0,1fr);column-gap:16px;padding:4px 0;border-bottom:1px solid var(--rule-soft)}
.report ul.labeled li:last-child{border-bottom:none}
.report ul.labeled .lb{color:var(--ink-bright);font-weight:600;font-size:var(--fs-dense)}

/* note: info・ask・memo は地を染めず罫と題だけ（6%）、warn・ng は地を 13% 染める。判断7 = C */
.note{margin:0 0 var(--gap-2);padding:6px 14px;border-left:3px solid var(--state-info);font-size:var(--fs-dense);line-height:22px;background:color-mix(in srgb, var(--state-info) 6%, transparent);border-radius:0 8px 8px 0}
.note .kind{display:block;font-size:var(--fs-label);font-weight:600;color:var(--state-info);letter-spacing:.06em;margin-bottom:2px}
.note.warn{border-left-color:var(--state-warn);background:color-mix(in srgb, var(--state-warn) 13%, transparent)}
.note.warn .kind{color:var(--state-warn)}
.note.ng{border-left-color:var(--state-ng);background:color-mix(in srgb, var(--state-ng) 13%, transparent)}
.note.ng .kind{color:var(--state-ng)}
.note.ask{border-left-color:var(--state-ask);background:color-mix(in srgb, var(--state-ask) 6%, transparent)}
.note.ask .kind{color:var(--state-ask)}

/* 余白の柱: 1400 でやり取りの列があるときは出さず、本文の中の1行に畳む */
.aside{grid-column:2;align-self:start;font-size:var(--fs-label);line-height:18px;color:var(--ink-quiet);padding-left:14px;border-left:1px solid var(--rule-soft);margin-bottom:var(--gap)}
.aside b{display:block;font-weight:600;color:var(--ink-soft);margin-bottom:2px}
.aside code{font-size:11.5px;background:none;padding:0;color:var(--ink-soft)}
.pane.w1400 .aside{display:none}
.inline-aside{display:none;font-size:var(--fs-label);line-height:18px;color:var(--ink-quiet);margin:-6px 0 var(--gap)}
.pane.w1400 .inline-aside{display:block}

.favor{margin:var(--gap-2) 0 0;padding:10px 14px;border-left:3px solid var(--accent);background:var(--surface-accent);border-radius:0 8px 8px 0;font-size:var(--fs-dense);line-height:22px}
.favor .lbl{display:block;font-size:var(--fs-label);letter-spacing:.08em;color:var(--ink-soft);margin-bottom:2px}

.pane.centered .report{grid-template-columns:var(--measure) 220px;width:max-content;max-width:100%;margin:0 auto}

/* ===== 塊の意匠（段3） ===== */
/* stats: 数は拾う字・等幅、差は符号つきで良い向きの色、語の高さの sparkline */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:0}
.stat{padding:2px 16px 2px 0;border-right:1px solid var(--rule-soft)}
.stat + .stat{padding-left:16px}
.stat:last-child{border-right:none}
.stat .k{font-size:var(--fs-label);line-height:18px;color:var(--ink-quiet)}
.stat .v{font-size:26px;line-height:32px;font-weight:600;color:var(--ink-bright);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat .v small{font-size:13px;font-weight:500;color:var(--ink-soft);margin-left:3px;letter-spacing:0}
.stat .d{font-family:var(--font-mono);font-size:12px;line-height:18px;font-variant-numeric:tabular-nums}
.stat .d.good{color:var(--state-ok)} .stat .d.bad{color:var(--state-ng)} .stat .d.flat{color:var(--ink-quiet)}
.stat svg{display:block;margin-top:4px}
.spark path{fill:none;stroke:var(--ink-soft);stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.spark .last{fill:var(--ink-bright)}
.spark .band{stroke:var(--rule-soft);stroke-width:1}

/* code: 強調する行は左に細い印と短いラベル、20 行超の無印の範囲は畳む、shell はコマンドと出力を分ける */
.code{margin:0;border:1px solid var(--rule-soft);border-radius:8px;overflow:hidden;font-family:var(--font-code);font-size:13px;line-height:20px;background:color-mix(in srgb, var(--ink) 4%, transparent)}
.code .head{display:flex;align-items:baseline;gap:10px;padding:6px 14px;border-bottom:1px solid var(--rule-soft);font-family:var(--font-sans);font-size:var(--fs-label);color:var(--ink-quiet)}
.code .head b{font-family:var(--font-mono);font-weight:500;color:var(--ink-soft)}
.code .ln{display:grid;grid-template-columns:3em minmax(0,1fr) auto;column-gap:10px;padding:0 14px 0 0;box-shadow:inset 3px 0 0 transparent;white-space:pre}
.code .ln .no{text-align:right;color:var(--ink-quiet);font-variant-numeric:tabular-nums;user-select:none}
.code .ln .tx{overflow:hidden;text-overflow:clip}
.code .ln .tag{font-family:var(--font-sans);font-size:11.5px;color:var(--ink-soft);align-self:center;padding:0 6px;border-radius:999px;border:1px solid var(--rule-soft);line-height:16px}
.code .ln.mark{background:color-mix(in srgb, var(--accent) 9%, transparent);box-shadow:inset 3px 0 0 var(--accent)}
.code .ln.mark .tx{color:var(--ink-bright)}
.code .ln.add{background:color-mix(in srgb, var(--state-ok) 9%, transparent)}
.code .ln.del{background:color-mix(in srgb, var(--state-ng) 9%, transparent)}
.code .ln.add .tx::before{content:"+ ";color:var(--state-ok)} .code .ln.del .tx::before{content:"− ";color:var(--state-ng)}
.code .w-add{background:color-mix(in srgb, var(--state-ok) 28%, transparent);border-radius:3px}
.code .w-del{background:color-mix(in srgb, var(--state-ng) 28%, transparent);border-radius:3px}
.code .fold{display:flex;align-items:center;gap:10px;padding:2px 14px 2px 3.9em;border-top:1px dashed var(--rule-soft);border-bottom:1px dashed var(--rule-soft);font-family:var(--font-sans);font-size:var(--fs-label);color:var(--ink-quiet);background:color-mix(in srgb, var(--ink) 3%, transparent)}
.code .fold::before{content:"▸";color:var(--ink-quiet)}
.code .cmd{display:block;padding:4px 14px;color:var(--ink-bright)}
.code .cmd::before{content:"$ ";color:var(--ink-quiet)}
.code .out{display:block;padding:4px 14px 6px;color:var(--ink-soft);border-top:1px solid var(--rule-soft);white-space:pre}

/* waterfall: 開始の位置をずらした横棒。並列と待ちのある回だけ */
.wf{margin:0;font-size:var(--fs-caption);line-height:20px}
.wf .row{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3.4em;column-gap:12px;align-items:center;padding:3px 0}
.wf .row .nm{color:var(--ink-soft);white-space:nowrap}
.wf .row .tm{text-align:right;font-family:var(--font-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink-soft)}
.wf .track{position:relative;height:10px;border-radius:2px;background:linear-gradient(to right,var(--rule-quiet) 1px,transparent 1px) 0 0/31.25% 100%}
.wf .bar{position:absolute;top:1px;height:8px;border-radius:2px;background:color-mix(in srgb, var(--ink) 38%, transparent)}
.wf .bar.wait{background:repeating-linear-gradient(135deg,color-mix(in srgb, var(--ink) 20%, transparent) 0 3px,transparent 3px 6px)}
.wf .bar.hot{background:var(--accent)}
.wf .axis{display:grid;grid-template-columns:8.5em minmax(0,1fr) 3.4em;column-gap:12px;font-family:var(--font-mono);font-size:11.5px;color:var(--ink-quiet);margin-top:2px}
.wf .axis .ticks{position:relative;height:16px}
.wf .axis .ticks span{position:absolute;transform:translateX(-50%)}

/* sources: 出典と path:line（押すと行で開く） */
.src{margin:0;padding:0;list-style:none;font-size:var(--fs-dense);line-height:20px}
.src li{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;padding:5px 0;border-bottom:1px solid var(--rule-soft)}
.src li:last-child{border-bottom:none}
.src .why{color:var(--ink-soft);font-size:var(--fs-caption)}
.src a.path{font-family:var(--font-code);font-size:12.5px;white-space:nowrap}

/* arrow chart: 項目ごとの前→後。凡例は直接ラベル、格子線なし */
.arr{margin:0}
</style>
</head>
<body>
<h1 class="mock-title">レポートの紙面 値の見本 — 3場面 × 2幅 × 3案</h1>
<p class="mock-caption">見本の中の文言・ID・数は架空。値の束は A 静か（拾う字 14:1・## 19px・格子 12/24）、B 提案（15:1・21px・13/26）、C はっきり（16:1・22px・13/26）。図表の題は下・中央・1段（判断3 = A）、note の地は段差（判断7 = C）で、どの案でも同じ。窓は 1400×900（やり取りの列あり。柱は本文の中の1行に畳む）と 1920×1080（柱が出る）。</p>
<div id="stage"></div>

<!-- ===================== 場面1: 短い最終レポート ===================== -->
<template id="scene-short">
  <div class="report">
    <p class="catalog"><span>最終レポート</span><span class="sep">·</span><span class="id">T-002</span><span class="sep">·</span><span class="done">✓ 完了</span><span class="sep">·</span><span class="meta">変更 2 ファイル <span class="plus">+38</span> <span class="minus">−12</span></span></p>
    <h3 class="headline">架空の札に段が1つでも 1/1 のように位置を出す</h3>
    <p class="conclusion">次に起こす架空の画面から、段が1つでも札に <code>1/1</code> と位置が出ます。<span class="why">1段の依頼でも進みを同じ場所で追え、段の有無で札の形が変わらなくなります。</span></p>
    <div class="signals">
      <span class="sig"><span class="ok">✓</span> <b>検証</b> 3件 通った <span class="n">単体 3152 · E2E 111</span></span>
      <span class="sig"><span class="ask">?</span> 1件 確かめていない</span>
      <span class="fav">お願い 1 ↓</span>
    </div>
    <div class="checks">
      <div class="check ask"><span class="mk">? 確かめていない</span><span class="lb">720×900 で同じ札を見る<br><span class="how"><b>確かめ方:</b> 窓を 720 幅にして、札の頭の <code>1/1</code> が折り返さずに出ることを見る</span></span></div>
      <div class="check rest"><span class="mk">✓ 通った 3件</span><span class="lb">pnpm run check · 1400×900 で段が1つの札を見る · find-stray-reference</span></div>
    </div>
    <div class="figure">
      <svg viewBox="0 0 600 120" width="600" height="120" font-family="system-ui" font-size="13">
        <defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a39fab"/></marker></defs>

      pane.querySelector(".content").appendChild(document.getElementById(`scene-${sid}`).content.cloneNode(true));

      row.appendChild(wrap);
    }
    group.appendChild(row);
  }
  stage.appendChild(group);
}
