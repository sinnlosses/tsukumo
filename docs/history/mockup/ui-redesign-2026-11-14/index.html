<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会話画面の再デザイン 3案（使い捨ての試作）</title>
    <!--
      使い捨ての試作。会話画面の再デザインの3案を、?variant= で切り替えて見比べる。
      問い: 入口（仕事・雑談・キャラ・成果・使用量・設定）を1か所にまとめる場所と、タスクの詳細の見せ方、使用量の出し方をどうするか。
        a … 上の帯。入口は舞台の右に敷く上の1行（舞台は上端まで立ち絵と背景のまま）、タスクの詳細は一覧の左に開くのぞき窓、使用量はサイドバーの下の3行。
        b … サイドバーの頭。上の帯は無く、入口はサイドバーの頭の1行、詳細は選んだ行がその場で開き、使用量はサイドバーの下の3行。
        c … 縦のレール。入口は右端の縦の帯、詳細はサイドバーの下半分に常設、使用量はレールの輪。
      3案に共通の決まり:
        舞台（キャラクターの側）は名前・セリフ・やり取りだけ。状態・手元・成果の数は置かない。
        紙（レポートの側）は状態・進行・本文だけ。キャラクターの名前とセリフは置かない。
        書体はどこも既定のゴシック（明朝は使わない）。
        紙の頭の進行の出し方（札・灯り・「n段のうちm段目」・経過・計画の一覧）と入力欄の骨格は、今の実物のまま。
        計画を持たない作業（moment=quick）では、吹き出しに出していた「手元」を、計画の一覧の中と同じ形の「いま」の1行で紙に出す。
        待機の紙は「前回の続き」の1枚だけにし、ほかの推薦はタスクの一覧の ★ に寄せる。
        ほかの画面を開いているあいだだけ、作業が続いていることを「仕事」の入口の点で知らせる。
      ?variant=a|b|c ?moment=greet|work|deliver|quick ?tab=work|chat|character|achievement|usage|settings
      ?select=T-241（詳細を開く） ?side=tasks|sessions ?map=1（置き場の枠） ?bar=0（切替の帯を隠す）
      成果・キャラ・使用量・設定の画面の中身と、雑談の配置は描いていない（今の実物のままの前提）。幅 760 以下の配置も含めていない。
      中身は架空の依頼・架空のタスク・架空のレポートで、実物の会話ではない。
      開き方: このファイルをブラウザで開く。素材は ../../../../characters/ から相対で読む。
      本番のコードではない。テストもエラー処理も持たない。
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        --ground: #14121a;
        --surface: #211e29;
        --surface-float: #2d2937;
        --ink: #ece8ef;
        --ink-soft: rgb(236 232 239 / 0.78);
        --ink-quiet: rgb(236 232 239 / 0.6);
        --rule: rgb(236 232 239 / 0.12);
        --rule-quiet: rgb(236 232 239 / 0.07);
        --raised: rgb(236 232 239 / 0.07);
        --raised-2: rgb(236 232 239 / 0.12);
        --accent: #f9c3cd;
        --on-accent: #221a22;
        --ok: #7ee081;
        --warn: #e3c766;
        --ng: #f2a0a0;
        --ask: #c7aef0;
        --glass: rgb(30 27 38 / 0.8);
        --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
        --bg-image: url("../../../../characters/shirasuzu/background.png");
        --proto-h: 32px;
        color-scheme: dark;
        background: var(--ground);
        color: var(--ink);
        font: 13px/1.6 var(--sans);
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      body.no-bar {
        --proto-h: 0px;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
      }
      textarea {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      h1,
      h2,
      h3,
      h4,
      p,
      ol,
      ul {
        margin: 0;
        padding: 0;
      }
      ol,
      ul {
        list-style: none;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12px;
      }
      .quiet {
        color: var(--ink-quiet);
      }
      .grow {
        flex: 1;
      }
      svg.ic {
        flex: none;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      kbd {
        font: 12px var(--mono);
        color: var(--ink-quiet);
        border: 1px solid var(--rule);
        border-radius: 5px;
        padding: 0 5px;
      }

      /* 試作の切替の帯（評価するデザインの外。?bar=0 で隠す） */
      .proto {
        position: fixed;
        inset: 0 0 auto 0;
        height: var(--proto-h);
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 12px;
        background: #f4e36a;
        color: #1b1a12;
        font-size: 12px;
        z-index: 50;
        white-space: nowrap;
      }
      body.no-bar .proto {
        display: none;
      }
      .proto b {
        font-weight: 700;
      }
      .proto button {
        padding: 2px 9px;
        border-radius: 999px;
        border: 1px solid rgb(27 26 18 / 0.35);
      }
      .proto button[aria-current="true"] {
        background: #1b1a12;
        color: #f4e36a;
      }
      .proto .gap {
        width: 12px;
      }

      #app {
        position: fixed;
        inset: var(--proto-h) 0 0 0;
        display: grid;
        overflow: hidden;
        isolation: isolate;
      }
      body[data-variant="a"] #app {
        grid-template: 40px minmax(0, 1fr) / 328px minmax(0, 1fr) 340px;
      }
      body[data-variant="b"] #app {
        grid-template: minmax(0, 1fr) / 328px minmax(0, 1fr) 340px;
      }
      body[data-variant="c"] #app {
        grid-template: minmax(0, 1fr) / 328px minmax(0, 1fr) 320px 64px;
      }
      .bg {
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(90deg, rgb(20 18 26 / 0.08), rgb(20 18 26 / 0.5) 300px, var(--ground) 580px),
          var(--bg-image) left center / auto 100% no-repeat,
          var(--ground);
      }

      /* ── 部品 ───────────────────────────────── */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 28px;
        padding: 0 12px;
        border-radius: 999px;
        font-size: 12.5px;
        font-weight: 600;
        white-space: nowrap;
      }
      .btn.primary {
        background: var(--accent);
        color: var(--on-accent);
      }
      .btn.tonal {
        background: var(--raised-2);
      }
      .btn.ghost {
        color: var(--ink-soft);
      }
      .btn.ghost:hover {
        background: var(--raised);
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border-radius: 8px;
        color: var(--ink-soft);
      }
      .icon-btn:hover {
        background: var(--raised);
        color: var(--ink);
      }
      .seg {
        display: inline-flex;
        padding: 3px;
        border-radius: 10px;
        background: var(--raised);
      }
      .seg button {
        padding: 2px 12px;
        border-radius: 7px;
        font-size: 12.5px;
        color: var(--ink-quiet);
        white-space: nowrap;
      }
      .seg button[aria-pressed="true"] {
        background: var(--raised-2);
        color: var(--ink);
        font-weight: 600;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        padding: 1px 9px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .badge.now {
        background: rgb(249 195 205 / 0.2);
        color: var(--accent);
      }
      .badge.ok {
        background: rgb(126 224 129 / 0.2);
        color: var(--ok);
      }
      .tag {
        font: 12px var(--mono);
        color: var(--ink-quiet);
        border: 1px solid var(--rule);
        border-radius: 5px;
        padding: 0 5px;
        line-height: 16px;
      }
      /* 状態の印。形と色の両方で分ける */
      .st {
        flex: none;
        display: inline-grid;
        place-items: center;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        font: 700 12px/1 var(--sans);
      }
      .st.doing {
        width: 10px;
        height: 10px;
        margin: 3px;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgb(249 195 205 / 0.22);
      }
      .st.ready {
        border: 1.6px solid var(--ink-soft);
      }
      .st.ask {
        color: var(--ask);
        border: 1.6px solid var(--ask);
      }
      .st.blocked {
        border: 1.6px dashed var(--warn);
      }
      .st.hold {
        color: var(--warn);
      }
      .st.draft {
        border: 1.6px dotted var(--ink-quiet);
        border-radius: 4px;
      }
      .st.done {
        color: var(--ok);
      }

      /* ── a: 上の帯（舞台の右だけに敷く。舞台は上端まで立ち絵と背景のまま） ── */
      #topbar {
        grid-column: 2 / -1;
        grid-row: 1;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        align-items: stretch;
        background: rgb(20 18 26 / 0.66);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--rule);
      }
      body[data-variant="a"] #stage {
        grid-row: 1 / span 2;
      }
      body[data-variant="a"] #desk,
      body[data-variant="a"] #side,
      body[data-variant="a"] #page {
        grid-row: 2;
      }
      .tb-left {
        display: flex;
        align-items: stretch;
        min-width: 0;
      }
      .tb-left .place {
        flex: 0 1 auto;
        max-width: 264px;
        padding: 0 4px 0 16px;
      }
      .tab .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 0 3px rgb(249 195 205 / 0.22);
      }
      .place {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
        padding: 0 14px;
        font-size: 13px;
      }
      .place b {
        font-weight: 700;
        white-space: nowrap;
      }
      .place .session {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--ink-soft);
      }
      .tabs {
        display: flex;
        align-items: stretch;
        gap: 2px;
      }
      .tab {
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        font-size: 13px;
        color: var(--ink-quiet);
        white-space: nowrap;
      }
      .tab:hover {
        color: var(--ink);
      }
      .tab[aria-selected="true"] {
        color: var(--ink);
        font-weight: 700;
      }
      .tab[aria-selected="true"]::after {
        content: "";
        position: absolute;
        inset: auto 8px -1px 8px;
        height: 2px;
        border-radius: 2px;
        background: var(--accent);
      }
      .tabs .sep {
        width: 1px;
        margin: 11px 8px;
        background: var(--rule);
      }
      .count {
        display: inline-flex;
        align-items: center;
        gap: 2px;
        font: 12px var(--mono);
        color: var(--accent);
      }
      .count svg {
        fill: currentColor;
        stroke: none;
      }
      .tb-right {
        display: flex;
        align-items: stretch;
        gap: 4px;
        padding: 0 6px 0 12px;
        border-left: 1px solid var(--rule);
      }
      .search {
        flex: 1;
        align-self: center;
        display: flex;
        align-items: center;
        gap: 8px;
        height: 28px;
        padding: 0 9px;
        border-radius: 8px;
        background: var(--raised);
        color: var(--ink-quiet);
        font-size: 12.5px;
      }
      .search:hover {
        background: var(--raised-2);
      }

      /* ── 舞台: 名前・セリフ・やり取りだけ ───── */
      #stage {
        grid-column: 1;
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 0;
        padding: 14px 14px 0;
        overflow: hidden;
      }
      .flow {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 9px;
        margin-bottom: 10px;
        overflow: hidden;
        mask-image: linear-gradient(transparent, #000 56px);
      }
      .flow .you {
        align-self: flex-end;
        max-width: 94%;
        padding: 5px 11px;
        border: 1px solid var(--rule);
        border-radius: 11px;
        background: var(--glass);
        font-size: 13px;
        line-height: 1.55;
        text-align: left;
      }
      .flow .you b {
        margin-right: 7px;
        font-size: 12px;
        color: var(--accent);
      }
      .flow .you[aria-current="true"] {
        border-color: var(--accent);
      }
      .flow .line {
        align-self: flex-start;
        max-width: 94%;
        padding: 5px 11px;
        border-radius: 11px;
        background: rgb(20 18 26 / 0.55);
        font-size: 13.5px;
        color: var(--ink-soft);
      }
      .flow time,
      .bubble time {
        margin-right: 7px;
        font: 12px var(--mono);
        color: var(--ink-quiet);
      }
      .bubble {
        position: relative;
        padding: 12px 16px 13px;
        border: 1px solid rgb(249 195 205 / 0.45);
        border-radius: 16px;
        background: var(--glass);
        backdrop-filter: blur(10px);
      }
      .bubble::after {
        content: "";
        position: absolute;
        left: 150px;
        bottom: -7px;
        width: 12px;
        height: 12px;
        rotate: 45deg;
        background: rgb(38 34 47);
        border: solid rgb(249 195 205 / 0.45);
        border-width: 0 1px 1px 0;
      }
      .bubble header {
        display: flex;
        align-items: baseline;
        gap: 9px;
        margin-bottom: 3px;
      }
      .bubble header b {
        font-size: 13px;
        color: var(--accent);
      }
      .bubble p {
        font-size: 15px;
        line-height: 1.75;
      }
      .figure {
        display: block;
        align-self: flex-start;
        height: 336px;
        margin: 4px 0 0 -14px;
        filter: drop-shadow(0 10px 26px rgb(0 0 0 / 0.55));
      }

      /* ── 紙: 状態・進行・本文だけ ────────────── */
      #desk {
        grid-column: 2;
        position: relative;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-top: 8px;
      }
      .paper {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 26px 44px 150px;
        border: 1px solid var(--rule-quiet);
        border-bottom: 0;
        border-radius: 16px 16px 0 0;
        background: var(--surface);
        font-size: 15px;
        line-height: 1.8;
      }
      .p-head {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13px;
      }
      .flames {
        display: inline-flex;
        align-items: flex-end;
        gap: 4px;
        color: var(--accent);
      }
      .flames svg {
        stroke: none;
        fill: currentColor;
      }
      .flames svg.off {
        fill: none;
        stroke: var(--ink-quiet);
        stroke-width: 1.7;
      }
      .plan {
        margin-top: 18px;
      }
      .plan > li {
        position: relative;
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        column-gap: 8px;
        padding-bottom: 20px;
      }
      .plan > li::before {
        content: "";
        position: absolute;
        left: 7px;
        top: 26px;
        bottom: 2px;
        width: 1px;
        background: var(--rule);
      }
      .plan > li:last-child::before {
        display: none;
      }
      .plan .mark {
        margin-top: 5px;
        color: var(--accent);
      }
      .plan .mark svg {
        fill: currentColor;
        stroke: none;
      }
      .plan .todo .mark svg {
        fill: none;
        stroke: var(--ink-quiet);
        stroke-width: 1.7;
      }
      .plan .todo {
        color: var(--ink-quiet);
        font-size: 16px;
      }
      .plan h3 {
        display: flex;
        align-items: baseline;
        font-size: 18px;
      }
      .plan h3 small {
        margin-left: auto;
        font-size: 12px;
        font-weight: 400;
        color: var(--ink-quiet);
      }
      .hands {
        margin-top: 8px;
        padding: 6px 12px;
        border-radius: 10px;
        background: var(--raised);
        font-size: 13.5px;
      }
      .hands div {
        display: flex;
        gap: 18px;
        padding: 3px 0;
      }
      .hands b {
        color: var(--accent);
        white-space: nowrap;
      }
      .hands time {
        margin-left: auto;
        font-size: 12px;
        color: var(--ink-quiet);
        white-space: nowrap;
      }
      .p-task {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 15px;
      }
      .p-verdict {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0 14px;
        font-size: 13px;
      }
      .paper h1 {
        font-size: 24px;
        line-height: 1.6;
      }
      .paper h2 {
        margin: 26px 0 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--rule);
        font-size: 17px;
      }
      .yours {
        margin: 16px 0;
        padding: 10px 14px;
        border-left: 3px solid var(--accent);
        border-radius: 4px 10px 10px 4px;
        background: var(--raised);
      }
      .yours b {
        display: block;
        font-size: 12px;
        color: var(--accent);
      }
      .checks li {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 2px 0;
      }
      .checks .y {
        color: var(--ok);
      }
      .paper table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      .paper th {
        padding: 4px 8px;
        border-bottom: 1px solid var(--rule);
        text-align: left;
        font-size: 12px;
        font-weight: 400;
        color: var(--ink-quiet);
      }
      .paper td {
        padding: 6px 8px;
        border-bottom: 1px solid var(--rule-quiet);
      }
      .resume {
        display: grid;
        gap: 2px;
        max-width: 520px;
        margin-top: 22px;
        padding: 14px 16px;
        border: 1px solid var(--rule);
        border-radius: 14px;
        background: var(--raised);
        font-size: 13.5px;
      }
      .resume b {
        font-size: 15px;
      }
      .resume .btn {
        justify-self: start;
        margin-top: 8px;
      }
      .hints {
        display: flex;
        gap: 18px;
        margin-top: 18px;
        font-size: 12.5px;
        color: var(--ink-quiet);
      }

      /* 入力欄（今の実物の骨格のまま） */
      .composer {
        position: absolute;
        left: 28px;
        right: 28px;
        bottom: 16px;
        padding: 12px;
        border: 1.5px solid var(--accent);
        border-radius: 28px;
        background: var(--surface-float);
        box-shadow: 0 10px 34px rgb(0 0 0 / 0.45);
      }
      .composer textarea {
        display: block;
        width: 100%;
        height: 34px;
        padding: 4px 12px;
        border: 0;
        outline: 0;
        resize: none;
        background: none;
        font-size: 15px;
      }
      .composer textarea::placeholder {
        color: var(--ink-quiet);
      }
      .c-foot {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }
      .run-chip {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        height: 26px;
        padding: 0 9px;
        border-radius: 8px;
        font-size: 12.5px;
        color: var(--ink-soft);
      }
      .run-chip:hover {
        background: var(--raised);
      }
      .send {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--accent);
        color: var(--on-accent);
      }
      .send.stop {
        background: var(--raised-2);
        color: var(--ink);
      }

      /* ── サイドバー ─────────────────────────── */
      #side {
        grid-column: 3;
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: rgb(26 23 33 / 0.94);
        border-left: 1px solid var(--rule);
      }
      .s-tabs {
        flex: none;
        display: flex;
        align-items: stretch;
        height: 40px;
        padding: 0 8px 0 4px;
        border-bottom: 1px solid var(--rule);
      }
      .s-tabs .tab i {
        font: 12px var(--mono);
        color: var(--ink-quiet);
      }
      .s-tabs .btn {
        align-self: center;
        padding: 0 8px;
        font-weight: 400;
      }
      .filters {
        flex: none;
        display: flex;
        gap: 6px;
        padding: 10px 12px 6px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        padding: 0 8px;
        border: 1px solid var(--rule);
        border-radius: 999px;
        font-size: 12px;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .chip i {
        font: 12px var(--mono);
        color: var(--ink-quiet);
      }
      .chip[aria-pressed="true"] {
        border-color: var(--accent);
        background: rgb(249 195 205 / 0.14);
        color: var(--ink);
      }
      .t-list {
        flex: 1;
        min-height: 0;
        overflow: auto;
        padding: 2px 8px 10px;
      }
      .group {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 6px 3px;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .group b {
        font-weight: 600;
        color: var(--ink-soft);
      }
      .t-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr);
        column-gap: 8px;
        padding: 7px 8px 8px 6px;
        border-left: 2px solid transparent;
        border-radius: 3px 10px 10px 3px;
        cursor: pointer;
      }
      .t-row:hover {
        background: var(--raised);
      }
      .t-row[aria-selected="true"] {
        background: var(--raised-2);
        border-left-color: var(--accent);
      }
      .t-row .st {
        margin-top: 2px;
      }
      .t-row .st.doing {
        margin-top: 5px;
      }
      .t-meta {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 22px;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .t-meta .loop {
        display: inline-flex;
        color: var(--ok);
      }
      .t-meta .note {
        margin-left: auto;
        white-space: nowrap;
      }
      .t-meta .note.doing {
        color: var(--accent);
      }
      .t-meta .note.wait {
        color: var(--warn);
      }
      .t-meta .note.ask {
        color: var(--ask);
      }
      .t-meta .go {
        margin-left: auto;
        height: 22px;
        padding: 0 10px;
      }
      .t-title {
        display: -webkit-box;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
        overflow: hidden;
        font-size: 13px;
        line-height: 1.5;
      }
      .t-row.done .t-title {
        color: var(--ink-quiet);
      }
      .star {
        font-size: 12px;
        color: var(--accent);
      }

      /* 詳細（のぞき窓・その場で開く・常設の欄で同じ中身） */
      .detail .d-top {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .detail .d-state {
        font-weight: 700;
        color: var(--ink);
      }
      .detail h3 {
        margin: 6px 0 4px;
        font-size: 15px;
        line-height: 1.5;
      }
      .detail h4 {
        margin: 10px 0 2px;
        font-size: 12px;
        font-weight: 600;
        color: var(--ink-quiet);
      }
      .detail p,
      .detail li {
        font-size: 13px;
        line-height: 1.65;
        color: var(--ink-soft);
      }
      .detail li {
        position: relative;
        padding-left: 14px;
      }
      .detail li::before {
        content: "";
        position: absolute;
        left: 3px;
        top: 9px;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: var(--ink-quiet);
      }
      .detail .d-foot {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 12px;
      }
      .peek {
        position: absolute;
        z-index: 5;
        right: 350px;
        width: 420px;
        padding: 14px 18px;
        border: 1px solid var(--rule);
        border-radius: 14px;
        background: var(--surface-float);
        box-shadow: 0 18px 54px rgb(0 0 0 / 0.55);
      }
      .peek::after {
        content: "";
        position: absolute;
        right: -7px;
        top: var(--arrow, 24px);
        width: 12px;
        height: 12px;
        rotate: 45deg;
        background: var(--surface-float);
        border: solid var(--rule);
        border-width: 1px 1px 0 0;
      }
      .peek .close {
        margin-left: auto;
      }
      .inline-detail {
        grid-column: 1 / -1;
        margin: 8px 0 2px;
        padding: 10px 12px;
        border-radius: 10px;
        background: rgb(20 18 26 / 0.55);
        cursor: default;
      }
      .pane {
        flex: none;
        height: 352px;
        overflow: auto;
        padding: 12px 14px;
        border-top: 1px solid var(--rule);
        background: rgb(20 18 26 / 0.45);
      }

      /* セッションの一覧 */
      .se-row {
        display: grid;
        grid-template-columns: 18px minmax(0, 1fr) auto;
        column-gap: 8px;
        padding: 7px 8px;
        border-radius: 10px;
      }
      .se-row:hover {
        background: var(--raised);
      }
      .se-row .last {
        grid-column: 2 / -1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        color: var(--ink-quiet);
      }

      /* 使用量（a・b: サイドバーの下の3行） */
      .usage {
        flex: none;
        padding: 10px 14px 12px;
        border-top: 1px solid var(--rule);
      }
      .usage header {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 4px;
      }
      .usage header b {
        font-size: 12.5px;
      }
      .u-row {
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 38px 96px;
        align-items: center;
        column-gap: 8px;
        height: 24px;
        font-size: 12.5px;
      }
      .u-row .bar {
        height: 5px;
        border-radius: 3px;
        background: var(--raised-2);
        overflow: hidden;
      }
      .u-row .bar b {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--accent);
      }
      .u-row .pct {
        font: 700 12.5px var(--mono);
        text-align: right;
      }
      .u-row .back {
        font-size: 12px;
        color: var(--ink-quiet);
        white-space: nowrap;
      }
      .spin svg {
        animation: spin 0.7s linear;
      }
      @keyframes spin {
        to {
          rotate: 360deg;
        }
      }

      /* ── b: サイドバーの頭の入口 ─────────────── */
      .b-head {
        flex: none;
        border-bottom: 1px solid var(--rule);
      }
      .b-head .place {
        height: 40px;
        padding: 0 8px 0 14px;
      }
      .b-menu {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 8px 9px 12px;
      }
      .b-menu .seg {
        margin-right: 6px;
      }
      .b-menu .item {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        height: 28px;
        padding: 0 9px;
        border-radius: 8px;
        font-size: 12.5px;
        color: var(--ink-soft);
        white-space: nowrap;
      }
      .b-menu .item > svg.ic {
        display: none;
      }
      .b-menu .item:hover {
        background: var(--raised);
      }
      .b-menu .item[aria-selected="true"] {
        background: var(--raised-2);
        color: var(--ink);
        font-weight: 700;
      }

      /* ── c: 縦のレール ───────────────────────── */
      #rail {
        grid-column: 4;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        min-height: 0;
        padding: 8px 0;
        background: rgb(17 15 22 / 0.96);
        border-left: 1px solid var(--rule);
      }
      .r-item {
        position: relative;
        display: grid;
        justify-items: center;
        gap: 1px;
        width: 56px;
        padding: 7px 0 5px;
        border-radius: 10px;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .r-item:hover {
        background: var(--raised);
        color: var(--ink);
      }
      .r-item[aria-selected="true"] {
        background: var(--raised);
        color: var(--ink);
        font-weight: 700;
      }
      .r-item[aria-selected="true"]::before {
        content: "";
        position: absolute;
        right: -4px;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 3px;
        background: var(--accent);
      }
      .r-item .count {
        position: absolute;
        top: 2px;
        right: 5px;
      }
      .r-item .count svg {
        display: none;
      }
      #rail hr {
        width: 34px;
        margin: 6px 0;
        border: 0;
        border-top: 1px solid var(--rule);
      }
      .r-usage {
        display: grid;
        justify-items: center;
        gap: 7px;
        width: 56px;
        padding: 6px 0;
        border-radius: 10px;
      }
      .r-usage:hover {
        background: var(--raised);
      }
      .ring {
        display: grid;
        justify-items: center;
        gap: 1px;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .ring i {
        display: grid;
        place-items: center;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background:
          radial-gradient(closest-side, rgb(17 15 22) 76%, transparent 78%),
          conic-gradient(var(--accent) calc(var(--v) * 1%), var(--raised-2) 0);
        font: 700 12px var(--mono);
        color: var(--ink);
      }
      .c-head {
        flex: none;
        display: flex;
        align-items: center;
        height: 40px;
        border-bottom: 1px solid var(--rule);
      }
      .c-head .place {
        flex: 1;
      }

      /* ── ほかの画面（中身は今の実物のままの前提で、枠だけ） ── */
      #page {
        min-height: 0;
        padding-top: 8px;
      }
      #page .sheet {
        height: 100%;
        padding: 30px 44px;
        border: 1px solid var(--rule-quiet);
        border-bottom: 0;
        border-radius: 16px 16px 0 0;
        background: var(--surface);
      }
      #page h1 {
        font-size: 22px;
      }
      #page .ph {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 22px;
      }
      #page .ph i {
        height: 150px;
        border: 1px dashed var(--rule);
        border-radius: 14px;
      }

      /* ── 置き場の枠（?map=1） ────────────────── */
      body.map [data-zone] {
        outline: 2px dashed var(--zone, var(--accent));
        outline-offset: -3px;
      }
      body.map [data-zone]::before {
        content: attr(data-zone);
        position: absolute;
        z-index: 9;
        left: 8px;
        top: 8px;
        padding: 2px 9px;
        border-radius: 6px;
        background: var(--zone, var(--accent));
        color: #17141c;
        font: 700 12px/1.6 var(--sans);
        white-space: nowrap;
      }
      body.map [data-zone]:not(.peek) {
        position: relative;
      }
      body.map #topbar[data-zone]::before,
      body.map .b-head[data-zone]::before {
        left: auto;
        right: 8px;
      }
      body.map #rail[data-zone]::before {
        left: auto;
        right: 4px;
        top: auto;
        bottom: 60px;
        writing-mode: vertical-rl;
      }

      .toast {
        position: fixed;
        left: 50%;
        bottom: 132px;
        translate: -50% 0;
        z-index: 60;
        padding: 7px 14px;
        border-radius: 999px;
        background: #ece8ef;
        color: #17141c;
        font-size: 12.5px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
      }
      .toast.show {
        opacity: 1;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-thumb {
        border-radius: 4px;
        background: var(--raised-2);
      }
    </style>
  </head>
  <body>
    <div class="proto" id="proto"></div>
    <div id="app"></div>
    <div class="toast" id="toast"></div>
    <script src="app.js"></script>
  </body>
</html>
