<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>レポートのメモをメモらしく見せる — 3案（2026-11-25）</title>
<!--
  土台は疑似セッション report-blocks（架空の会話・1400×900）の実物の画面。
  案は撮る前に CSS を差し込んで描き直したもので、ソースは変えていない。
  対象は Note の tone=memo。直前の内容部品の欄外注に寄せて描かれ、「メモ」のラベルを持つ（出どころの欄外注はラベルを持たないので変えない）。
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #141318; color: #ece9ef; font: 14px/1.7 system-ui, "Hiragino Sans", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  h2 { font-size: 15px; margin: 0 0 6px; }
  h2 small { font-weight: 400; color: #9a95a0; margin-left: 8px; }
  p { margin: 0 0 18px; color: #b9b4bf; max-width: 980px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 560px)); gap: 20px 16px; }
  figure { margin: 0; }
  figcaption { font-size: 12px; color: #9a95a0; margin-top: 6px; }
  img { display: block; width: 100%; border-radius: 10px; }
</style>
</head>
<body>
<h1>レポートのメモをメモらしく見せる — 3案</h1>
<p>今のメモは「出どころ」と同じ欄外注の小さな灰の字で、太字の「メモ」の語だけが違う。3案とも、変えるのは「メモ」のラベルを持つ欄外注だけで、出どころの行・情報・注意などの Note は変えない。</p>
<div class="grid">
  <figure><img src="now.png" alt="今のメモ" /><figcaption>今: 出どころの行と同じ字の大きさと色。「メモ」の語の太さだけで見分ける</figcaption></figure>
  <figure><img src="a.png" alt="案A 角を折った紙片" /><figcaption>案A 角を折った紙片（推奨）: 生成りに寄せた薄い地と右上の折り返しで、紙を貼った覚え書きと分かる。新しい色は「メモ」の語の生成りだけ</figcaption></figure>
  <figure><img src="b.png" alt="案B 鉛筆の書き込み" /><figcaption>案B 鉛筆の書き込み: 地を持たず、点線の縦罫と鉛筆の印。いちばん控えめで、本文の邪魔をしない</figcaption></figure>
  <figure><img src="c.png" alt="案C 罫線のノート片" /><figcaption>案C 罫線のノート片: 行に合わせた横罫と綴じ穴の列。ノートらしさは強いが、上端の穴の列が点線の区切りに見える</figcaption></figure>
</div>
</body>
</html>
