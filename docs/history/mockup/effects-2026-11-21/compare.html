<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>表情のエフェクト — 見直し案（2026-11-21）</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #15131b;
    --surface: #1f1c27;
    --ink: #ece7ef;
    --ink-soft: color-mix(in srgb, var(--ink) 70%, transparent);
    --ink-quiet: color-mix(in srgb, var(--ink) 50%, transparent);
    --line: color-mix(in srgb, var(--ink) 12%, transparent);
    --accent: #6fe3cd;
    --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
    --k: 1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, sans-serif; }
  header.page { max-width: 1280px; margin: 0 auto; padding: 22px 24px 6px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; }
  header.page h1 { font-size: 20px; margin: 0; }
  header.page p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; }
  .toolbar button {
    all: unset; cursor: pointer; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 13px; color: var(--ink-soft);
  }
  .toolbar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
  .toolbar button:focus-visible { outline: 2px solid var(--accent); }

  main { max-width: 1280px; margin: 0 auto; padding: 14px 24px 48px; }
  h2 { font-size: 13px; color: var(--ink-quiet); font-weight: 600; margin: 18px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: clip; display: flex; flex-direction: column; }
  .stage {
    all: unset; cursor: pointer; display: block; position: relative; height: 360px; overflow: clip;
    background: radial-gradient(110% 70% at 30% 0%, #2a2537 0%, transparent 60%), linear-gradient(#1b1923, #14121a);
  }
  .stage:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .portrait { position: absolute; left: 50%; bottom: -6px; height: 350px; aspect-ratio: 1145 / 1374; translate: -50% 0; }
  .portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .portrait.bounce { animation: bounce calc(0.55s * var(--k)) ease-out 1; }
  @keyframes bounce { 30% { translate: -50% -8px; } 60% { translate: -50% 2px; } }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  /* 顔の位置を原点にする */
  .a { position: absolute; left: calc(var(--ax) * 100%); top: calc(var(--ay) * 100%); width: 0; height: 0; }
  .p { position: absolute; left: var(--x, 0px); top: var(--y, 0px); opacity: 0; will-change: transform, opacity; }
  .meta { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 4px; }
  .meta .row { display: flex; align-items: baseline; gap: 8px; }
  .meta h3 { margin: 0; font-size: 15px; }
  .meta .expr { font-size: 12px; color: var(--ink-quiet); }
  .meta .name { margin-left: auto; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .meta .name.none { background: transparent; color: var(--ink-quiet); border: 1px dashed var(--line); }
  .meta p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .meta .was { font-size: 12px; color: var(--ink-quiet); }

  /* =========================================================
     エフェクトの部品。どれも1回で消える。
     色は記号の白黒ではなく、光（グロー）・透明度・グラデーションで描く。
     ========================================================= */
  .glow { filter: drop-shadow(0 0 6px var(--c, #fff)) drop-shadow(0 0 14px color-mix(in srgb, var(--c, #fff) 50%, transparent)); }

  /* --- ふむ（thinking）: 思索の輪 ---
     頭から光の粒が2つ昇り、細い輪が描かれ、輪の上を3つの粒が巡る */
  .think-ring { --c: #bfe9ff; width: 84px; height: 84px; margin: -42px; animation: fadeHold calc(1.9s * var(--k)) ease-out 1 forwards; }
  .think-ring circle.track { fill: none; stroke: url(#gThink); stroke-width: 1.6; stroke-linecap: round; stroke-dasharray: 230; stroke-dashoffset: 230;
    animation: draw calc(0.9s * var(--k)) cubic-bezier(.6,0,.2,1) calc(0.25s * var(--k)) 1 forwards; transform-origin: center; rotate: -90deg; }
  .think-ring .orbit { transform-origin: 42px 42px; animation: orbit calc(1.9s * var(--k)) cubic-bezier(.4,0,.2,1) 1 forwards; }
  .think-ring .orbit circle { fill: #fff; }
  .think-bead { --c: #bfe9ff; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #bfe9ff 45%, rgb(191 233 255 / 0) 72%);
    animation: bead calc(1.4s * var(--k)) ease-out var(--d) 1 forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes orbit { from { rotate: -40deg; } to { rotate: 200deg; } }
  @keyframes fadeHold { 0% { opacity: 0; scale: .85; } 18% { opacity: 1; scale: 1; } 72% { opacity: 1; } 100% { opacity: 0; scale: 1.06; } }
  @keyframes bead { 0% { opacity: 0; transform: translate(0, 10px) scale(.4); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); } }

  /* --- えへん（proud）: スパークル ---
     4方向の光の星が順に瞬き、金の粉が散る */
  .sparkle { --c: #ffe6a3; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); animation: sparkle calc(1.1s * var(--k)) cubic-bezier(.3,1.4,.5,1) var(--d) 1 forwards; }
  @keyframes sparkle { 0% { opacity: 0; scale: 0; rotate: -60deg; } 35% { opacity: 1; scale: 1.15; rotate: 0deg; } 60% { opacity: 1; scale: .9; } 100% { opacity: 0; scale: .2; rotate: 30deg; } }
  .dust { width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff4cf; box-shadow: 0 0 6px #ffd98a;
    animation: dust calc(1.3s * var(--k)) ease-out var(--d) 1 forwards; }
  @keyframes dust { 0% { opacity: 0; transform: translate(0,0) scale(.5); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); } }

  /* --- あわわ（flustered）: 火照り ---
     頬に桃色のぼかしが灯り、線だけのハートが2つ揺れて昇る */
  .blush { width: 46px; height: 22px; margin: -11px -23px; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(255 140 170 / .75), rgb(255 140 170 / 0));
    filter: blur(3px); animation: blush calc(1.8s * var(--k)) ease-in-out 1 forwards; }
  @keyframes blush { 0% { opacity: 0; scale: .6; } 30%, 65% { opacity: 1; scale: 1; } 100% { opacity: 0; } }
  .heart { --c: #ff9ec0; width: var(--s); height: var(--s); margin: calc(var(--s) / -2);
    animation: heart calc(1.7s * var(--k)) cubic-bezier(.2,.8,.3,1) var(--d) 1 forwards; }
  .heart path { fill: none; stroke: #ffc3d7; stroke-width: 2.2; stroke-linejoin: round; }
  @keyframes heart {
    0% { opacity: 0; transform: translate(0, 6px) scale(.3) rotate(-12deg); }
    25% { opacity: 1; transform: translate(calc(var(--dx) * .3), calc(var(--dy) * .3)) scale(1.05) rotate(8deg); }
    60% { opacity: 1; transform: translate(calc(var(--dx) * .7), calc(var(--dy) * .7)) scale(1) rotate(-6deg); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.9) rotate(4deg); }
  }

  /* --- きりっ（serious）: 閃光 ---
     目の横を細い光の筋が斜めに走り、交点で光が一度だけ弾ける */
  .slash { width: 190px; height: 2px; margin: -1px -95px; rotate: -22deg;
    background: linear-gradient(90deg, transparent, rgb(150 220 255 / .9) 40%, #fff 50%, rgb(150 220 255 / .9) 60%, transparent);
    filter: drop-shadow(0 0 6px #8fd8ff); animation: slash calc(0.7s * var(--k)) cubic-bezier(.7,0,.2,1) var(--d) 1 forwards; }
  @keyframes slash { 0% { opacity: 1; clip-path: inset(0 100% 0 0); } 45% { opacity: 1; clip-path: inset(0 0 0 0); } 100% { opacity: 0; clip-path: inset(0 0 0 100%); } }
  .flare { --c: #b5e6ff; width: 54px; height: 54px; margin: -27px; animation: flare calc(0.8s * var(--k)) ease-out calc(0.22s * var(--k)) 1 forwards; }
  @keyframes flare { 0% { opacity: 0; scale: .2; rotate: -45deg; } 30% { opacity: 1; scale: 1.2; rotate: 0deg; } 100% { opacity: 0; scale: .5; rotate: 15deg; } }

  /* --- きょとん（curious）: 波紋 ---
     頭の上で細い輪が2重に広がり、短い光の線が放射状に伸びる */
  .ripple { width: 20px; height: 20px; margin: -10px; border-radius: 50%; border: 1.5px solid rgb(180 240 225 / .9);
    box-shadow: 0 0 10px rgb(111 227 205 / .5), inset 0 0 8px rgb(111 227 205 / .35);
    animation: ripple calc(1.1s * var(--k)) cubic-bezier(.1,.6,.3,1) var(--d) 1 forwards; }
  @keyframes ripple { 0% { opacity: 0; scale: .3; } 15% { opacity: 1; } 100% { opacity: 0; scale: 6; border-width: .3px; } }
  .ray { width: 2px; height: 26px; margin: -13px -1px; border-radius: 2px; transform-origin: 50% 50%;
    background: linear-gradient(transparent, #dffdf6 50%, transparent);
    filter: drop-shadow(0 0 4px #6fe3cd);
    rotate: var(--r); animation: ray calc(0.75s * var(--k)) cubic-bezier(.2,.8,.3,1) 1 forwards; }
  @keyframes ray { 0% { opacity: 0; translate: 0 0; scale: 1 .2; } 35% { opacity: 1; scale: 1 1; } 100% { opacity: 0; transform: translateY(-46px); scale: 1 .4; } }

  /* --- しょんぼり（sad）: 雨の帳 ---
     上から藍の帳が下り、細い雨の筋が落ちて、肩のあたりで小さな輪が広がる */
  .veil { position: absolute; inset: -10% -30% 30% -30%; opacity: 0;
    background: radial-gradient(70% 90% at 50% 0%, rgb(40 46 96 / .7), rgb(40 46 96 / .3) 55%, transparent 85%);
    animation: veil calc(2.2s * var(--k)) ease-in-out 1 forwards; }
  @keyframes veil { 0% { opacity: 0; translate: 0 -40%; } 30%, 70% { opacity: 1; translate: 0 0; } 100% { opacity: 0; } }
  .rain { position: absolute; top: 0; left: var(--l); width: 1.5px; height: 38px; opacity: 0; rotate: 8deg;
    background: linear-gradient(transparent, rgb(190 210 255 / .85)); border-radius: 1px;
    animation: rain calc(0.9s * var(--k)) linear var(--d) 2 forwards; }
  @keyframes rain { 0% { opacity: 0; transform: translateY(-40px); } 15% { opacity: 1; } 85% { opacity: .9; } 100% { opacity: 0; transform: translateY(220px); } }
  .drip { width: 18px; height: 6px; margin: -3px -9px; border-radius: 50%; border: 1px solid rgb(190 210 255 / .8);
    animation: drip calc(0.8s * var(--k)) ease-out var(--d) 1 forwards; }
  @keyframes drip { 0% { opacity: 0; scale: .2; } 20% { opacity: 1; } 100% { opacity: 0; scale: 2.2; } }

  /* --- わくわく（excited）: 花吹雪 ---
     頭の上でやわらかい光がふくらみ、花びらが弧を描いて舞い落ちる */
  .bloom { width: 120px; height: 120px; margin: -60px; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(255 230 200 / .55), rgb(255 160 190 / .18) 55%, transparent);
    animation: bloom calc(1s * var(--k)) ease-out 1 forwards; }
  @keyframes bloom { 0% { opacity: 0; scale: .3; } 30% { opacity: 1; } 100% { opacity: 0; scale: 1.5; } }
  .petal { width: 15px; height: 10px; margin: -5px -7.5px; border-radius: 80% 0 80% 0;
    background: linear-gradient(135deg, #fff 10%, var(--pc) 70%); box-shadow: 0 0 8px var(--pc);
    animation: petal calc(1.9s * var(--k)) cubic-bezier(.15,.7,.4,1) var(--d) 1 forwards; }
  @keyframes petal {
    0% { opacity: 0; transform: translate(0,0) rotate(0) scale(.4); }
    12% { opacity: 1; }
    40% { transform: translate(calc(var(--dx) * .8), var(--dy)) rotate(calc(var(--rot) * .5)) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 120px)) rotate(var(--rot)) scale(.8); }
  }

  /* --- たいくつ（bored）: 泡沫 ---
     ガラスのような泡がゆっくり揺れながら昇り、ぱちんと消える */
  .bubble { width: var(--s); height: var(--s); margin: calc(var(--s) / -2); border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, rgb(255 255 255 / .95) 0 9%, rgb(255 255 255 / .2) 24%, transparent 50%),
                radial-gradient(circle, rgb(210 230 255 / .14) 0 55%, rgb(190 225 255 / .7) 68%, rgb(235 205 255 / .85) 74%, transparent 77%);
    border: 1.5px solid rgb(225 238 255 / .75);
    box-shadow: 0 0 12px rgb(200 225 255 / .45), inset 0 0 8px rgb(235 205 255 / .5);
    animation: bubble calc(2.6s * var(--k)) ease-in-out var(--d) 1 forwards; }
  @keyframes bubble {
    0% { opacity: 0; transform: translate(0, 0) scale(.4); }
    15% { opacity: 1; }
    40% { transform: translate(calc(var(--dx) * .5 + 6px), calc(var(--dy) * .4)) scale(1); }
    70% { transform: translate(calc(var(--dx) * .8 - 6px), calc(var(--dy) * .75)) scale(1); opacity: 1; }
    88% { transform: translate(var(--dx), var(--dy)) scale(1.1); opacity: .9; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.5); opacity: 0; }
  }

  /* --- 完了: 祝光 --- */
  .halo { width: 40px; height: 40px; margin: -20px; border-radius: 50%; border: 2px solid rgb(255 240 200 / .9);
    box-shadow: 0 0 18px rgb(255 220 150 / .7), inset 0 0 12px rgb(255 220 150 / .5);
    animation: halo calc(1.2s * var(--k)) cubic-bezier(.1,.7,.3,1) 1 forwards; }
  @keyframes halo { 0% { opacity: 0; scale: .2; } 20% { opacity: 1; } 100% { opacity: 0; scale: 5; border-width: .4px; } }
  .beam { width: 3px; height: 60px; margin: -30px -1.5px; border-radius: 3px;
    background: linear-gradient(transparent, #fff6d8 50%, transparent); filter: drop-shadow(0 0 6px #ffd98a);
    rotate: var(--r); animation: beam calc(0.9s * var(--k)) ease-out calc(0.1s * var(--k)) 1 forwards; }
  @keyframes beam { 0% { opacity: 0; transform: translateY(0) scale(1, .2); } 40% { opacity: 1; transform: translateY(-40px) scale(1, 1); } 100% { opacity: 0; transform: translateY(-80px) scale(1, .3); } }

  /* --- 失敗: 翳り --- 画面の彩度が一瞬落ち、縁が暗くなる */
  .shade { position: absolute; inset: -20% -40%; opacity: 0;
    backdrop-filter: saturate(.25) brightness(.85);
    background: radial-gradient(120% 90% at 50% 40%, transparent 35%, rgb(10 8 20 / .75));
    animation: shade calc(1.6s * var(--k)) ease-in-out 1 forwards; }
  @keyframes shade { 0% { opacity: 0; } 18%, 60% { opacity: 1; } 100% { opacity: 0; } }
  .shard { width: 2px; height: 30px; margin: -15px -1px; background: linear-gradient(transparent, rgb(170 160 220 / .9));
    rotate: var(--r); animation: shard calc(1.1s * var(--k)) ease-in var(--d) 1 forwards; }
  @keyframes shard { 0% { opacity: 0; transform: translateY(-20px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(40px); } }

  /* --- 答え待ち: 問い --- ガラスの札に「？」が浮かび、輪が一度だけ鳴る */
  .chip { width: 40px; height: 40px; margin: -20px; border-radius: 12px; display: grid; place-items: center;
    background: linear-gradient(160deg, rgb(255 255 255 / .22), rgb(255 255 255 / .06));
    border: 1px solid rgb(255 255 255 / .35); backdrop-filter: blur(6px);
    box-shadow: 0 6px 20px rgb(0 0 0 / .35), 0 0 16px rgb(111 227 205 / .35);
    color: #eafff9; font: 700 22px/1 system-ui, sans-serif; text-shadow: 0 0 8px #6fe3cd;
    animation: chip calc(1.8s * var(--k)) cubic-bezier(.3,1.5,.5,1) 1 forwards; }
  @keyframes chip { 0% { opacity: 0; transform: translateY(10px) scale(.5) rotate(-8deg); } 22% { opacity: 1; transform: none; } 75% { opacity: 1; transform: translateY(-4px); } 100% { opacity: 0; transform: translateY(-12px); } }
  .ping { width: 40px; height: 40px; margin: -20px; border-radius: 12px; border: 1.5px solid rgb(111 227 205 / .8);
    animation: ping calc(0.9s * var(--k)) ease-out calc(0.3s * var(--k)) 1 forwards; }
  @keyframes ping { 0% { opacity: .9; scale: 1; } 100% { opacity: 0; scale: 1.8; } }

  .paused .p, .paused .veil, .paused .rain, .paused .shade, .paused .portrait { animation-play-state: paused !important; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gThink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#7fd4ff" stop-opacity=".4" />
    </linearGradient>
    <radialGradient id="gStar" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".5" stop-color="#fff1c4" />
      <stop offset="1" stop-color="#ffd27a" />
    </radialGradient>
    <radialGradient id="gFlare" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#9adcff" />
    </radialGradient>
  </defs>
</svg>

<header class="page">
  <div>
    <h1>表情のエフェクト — 見直し案</h1>
    <p>通常の表情には何も出さない。記号を重ねる漫画の表現から、光・粒・ぼかしで描く表現へ寄せた。カードを押すともう一度再生する。</p>
  </div>
  <div class="toolbar">
    <button type="button" id="replay">全部を再生</button>
    <button type="button" id="slow" aria-pressed="false">ゆっくり（×3）</button>
    <button type="button" id="loop" aria-pressed="true">繰り返す</button>
  </div>
</header>

<main>
  <h2>表情（セリフが届いたとき）</h2>
  <div class="grid" id="expr"></div>
  <h2>終わり方（GH-2552 の3つ。いまは未実装）</h2>
  <div class="grid" id="ends"></div>
</main>

<script>
const IMG = (name) => `../../../../characters/tsukumo/${name}.png`
const STAR = '<path d="M50 0 C54 38 62 46 100 50 C62 54 54 62 50 100 C46 62 38 54 0 50 C38 46 46 38 50 0Z" />'
const HEART = '<path d="M16 28 C6 20 2 14 2 9.5 C2 5.5 5.2 2.5 9 2.5 C12 2.5 14.4 4.3 16 7 C17.6 4.3 20 2.5 23 2.5 C26.8 2.5 30 5.5 30 9.5 C30 14 26 20 16 28Z" />'

// ax, ay: 立ち絵の箱の中の顔の位置（0〜1）。characters/tsukumo/character.json の faceAtByExpression と同じ値
const EXPRESSIONS = [
  { id: "default", label: "にっと", img: "default", ax: 0.5, ay: 0.22, fx: null, name: "なし",
    what: "エフェクトは出さない。吹き出しと頷きだけ。", was: "今: 大きな ♪ が1つ弾む" },
  { id: "thinking", label: "ふむ", img: "thinking", ax: 0.52, ay: 0.5, fx: "think", name: "思索の輪",
    what: "光の粒が2つ昇り、細い輪が描かれ、輪の上を3つの粒が巡って消える。", was: "今: 考え雲に「…」" },
  { id: "proud", label: "えへん", img: "proud", ax: 0.42, ay: 0.2, fx: "sparkle", name: "スパークル",
    what: "4方向に伸びる光の星が3つ順に瞬き、金の粉が散る。", was: "今: 大きな ✦ が3つ瞬く" },
  { id: "flustered", label: "あわわ", img: "flustered", ax: 0.45, ay: 0.27, fx: "blush", name: "火照り",
    what: "頬に桃色のぼかしが灯り、線だけのハートが2つ揺れて昇る。", was: "今: 大粒の汗" },
  { id: "serious", label: "きりっ", img: "serious", ax: 0.48, ay: 0.22, fx: "flash", name: "閃光",
    what: "目の横を細い光の筋が斜めに2本走り、交点で光が一度だけ弾ける。", was: "今: 目の横の ✦" },
  { id: "curious", label: "きょとん", img: "curious", ax: 0.5, ay: 0.24, fx: "ripple", name: "波紋",
    what: "頭の上で細い光の輪が2重に広がり、短い光の線が放射状に伸びる。", was: "今: 太い驚き線5本" },
  { id: "sad", label: "しょんぼり", img: "sad", ax: 0.5, ay: 0.24, fx: "rain", name: "雨の帳",
    what: "上から藍の帳が下り、細い雨の筋が落ちて、肩で小さな輪が広がる。", was: "今: どよ〜んの影と縦線" },
  { id: "excited", label: "わくわく", img: "excited", ax: 0.48, ay: 0.22, fx: "petals", name: "花吹雪",
    what: "頭の上でやわらかい光がふくらみ、花びらが弧を描いて舞い落ちる。", was: "今: 音符と星が昇る" },
  { id: "bored", label: "たいくつ", img: "bored", ax: 0.55, ay: 0.7, fx: "bubbles", name: "泡沫",
    what: "ガラスのような泡が4つ、揺れながらゆっくり昇って消える。", was: "今: 渦 ◎ が昇る" },
]
const ENDINGS = [
  { id: "finish", label: "タスクの完了", img: "proud", ax: 0.42, ay: 0.2, fx: "finish", bounce: true, name: "祝光",
    what: "光の輪が広がり、8本の光の筋が外へ伸び、星が3つ瞬く。", was: "採った案: 今の光＋星3つ" },
  { id: "fail", label: "失敗", img: "flustered", ax: 0.45, ay: 0.27, fx: "fail", name: "翳り",
    what: "立ち絵の色が一瞬抜け、縁が暗くなり、細い欠片が落ちる。", was: "採った案: ガーンの稲妻＋どよ〜ん" },
  { id: "ask", label: "答え待ち", img: "default", ax: 0.5, ay: 0.22, fx: "ask", name: "問い",
    what: "頭の横にガラスの札が浮かび、「？」が灯って輪が一度鳴る。", was: "採った案: 「？」がぽんと出る" },
]

function piece(parent, cls, vars = {}, html = "") {
  const e = document.createElement("span")
  e.className = "p " + cls
  for (const [k, v] of Object.entries(vars)) e.style.setProperty(k, v)
  e.innerHTML = html
  parent.append(e)
  return e
}
function svg(viewBox, inner) { return `<svg viewBox="${viewBox}" width="100%" height="100%" style="overflow:visible">${inner}</svg>` }

const FX = {
  think(a) {
    piece(a, "think-bead", { "--x": "18px", "--y": "-20px", "--s": "8px", "--dx": "22px", "--dy": "-30px", "--d": "0s" })
    piece(a, "think-bead", { "--x": "34px", "--y": "-44px", "--s": "12px", "--dx": "18px", "--dy": "-26px", "--d": "calc(0.15s * var(--k))" })
    piece(a, "think-ring glow", { "--x": "84px", "--y": "-86px" },
      svg("0 0 84 84", `<circle class="track" cx="42" cy="42" r="36" />
        <g class="orbit"><circle cx="42" cy="6" r="3" /><circle cx="78" cy="42" r="2.2" opacity=".8" /><circle cx="42" cy="78" r="1.6" opacity=".6" /></g>`))
  },
  sparkle(a) {
    const stars = [[-64, -40, 40, 0], [70, -64, 30, .18], [58, 22, 22, .34]]
    for (const [x, y, s, d] of stars)
      piece(a, "sparkle glow", { "--x": `${x}px`, "--y": `${y}px`, "--s": `${s}px`, "--d": `calc(${d}s * var(--k))` }, svg("0 0 100 100", STAR.replace("<path", '<path fill="url(#gStar)"')))
    for (let i = 0; i < 10; i++) {
      const t = (i / 10) * Math.PI * 2
      piece(a, "dust", { "--x": `${Math.cos(t) * 30}px`, "--y": `${Math.sin(t) * 24 - 20}px`, "--dx": `${Math.cos(t) * 60}px`, "--dy": `${Math.sin(t) * 50 - 20}px`, "--d": `calc(${0.1 + (i % 3) * 0.08}s * var(--k))` })
    }
  },
  blush(a) {
    piece(a, "blush", { "--x": "-30px", "--y": "22px" })
    piece(a, "blush", { "--x": "30px", "--y": "22px" })
    piece(a, "heart glow", { "--x": "56px", "--y": "-20px", "--s": "24px", "--dx": "18px", "--dy": "-56px", "--d": "calc(0.15s * var(--k))" }, svg("0 0 32 32", HEART))
    piece(a, "heart glow", { "--x": "72px", "--y": "6px", "--s": "16px", "--dx": "26px", "--dy": "-44px", "--d": "calc(0.4s * var(--k))" }, svg("0 0 32 32", HEART))
  },
  flash(a) {
    piece(a, "slash", { "--x": "112px", "--y": "-18px", "--d": "0s" }).style.width = "130px"
    piece(a, "slash", { "--x": "120px", "--y": "-4px", "--d": "calc(0.08s * var(--k))" }).style.width = "80px"
    piece(a, "flare glow", { "--x": "84px", "--y": "-6px" }, svg("0 0 100 100", STAR.replace("<path", '<path fill="url(#gFlare)"')))
  },
  ripple(a) {
    piece(a, "ripple", { "--x": "0px", "--y": "-30px", "--d": "0s" })
    piece(a, "ripple", { "--x": "0px", "--y": "-30px", "--d": "calc(0.18s * var(--k))" })
    for (const r of [-70, -42, -14, 14, 42, 70]) {
      const t = (r - 90) * Math.PI / 180
      piece(a, "ray", { "--x": `${Math.cos(t) * 50}px`, "--y": `${Math.sin(t) * 50 - 30}px`, "--r": `${r}deg` })
    }
  },
  rain(a, fx) {
    const veil = document.createElement("span"); veil.className = "veil"; fx.prepend(veil)
    for (let i = 0; i < 16; i++) {
      const r = document.createElement("span"); r.className = "rain"
      r.style.setProperty("--l", `${8 + ((i * 37) % 84)}%`)
      r.style.setProperty("--d", `calc(${((i * 0.13) % 0.9).toFixed(2)}s * var(--k))`)
      fx.append(r)
    }
    for (const [x, d] of [[-58, .5], [44, .8], [-12, 1.1]])
      piece(a, "drip", { "--x": `${x}px`, "--y": "96px", "--d": `calc(${d}s * var(--k))` })
  },
  petals(a) {
    piece(a, "bloom", { "--x": "0px", "--y": "-40px" })
    const colors = ["#ff8fb1", "#ffc56b", "#6fe3cd", "#ff9fd0", "#ffe27a"]
    for (let i = 0; i < 16; i++) {
      const t = -Math.PI / 2 + ((i / 15) - 0.5) * Math.PI * 1.3
      const dist = 55 + (i % 4) * 14
      piece(a, "petal", { "--x": "0px", "--y": "-40px", "--pc": colors[i % colors.length],
        "--dx": `${Math.cos(t) * dist * 1.3}px`, "--dy": `${Math.sin(t) * dist}px`,
        "--rot": `${(i % 2 ? 1 : -1) * (240 + i * 20)}deg`, "--d": `calc(${(i % 5) * 0.04}s * var(--k))` })
    }
  },
  bubbles(a) {
    const list = [[40, -30, 30, -10, -90, 0], [66, -10, 20, 16, -110, .35], [24, -6, 14, -18, -70, .7], [80, -40, 24, 10, -120, .95]]
    for (const [x, y, s, dx, dy, d] of list)
      piece(a, "bubble", { "--x": `${x}px`, "--y": `${y}px`, "--s": `${s}px`, "--dx": `${dx}px`, "--dy": `${dy}px`, "--d": `calc(${d}s * var(--k))` })
  },
  fail(a, fx) {
    const s = document.createElement("span"); s.className = "shade"; fx.prepend(s)
    for (const [x, r, d] of [[-50, 10, .1], [-20, -6, .25], [30, 8, .15], [60, -10, .32]])
      piece(a, "shard", { "--x": `${x}px`, "--y": "-50px", "--r": `${r}deg`, "--d": `calc(${d}s * var(--k))` })
  },
  ask(a) {
    piece(a, "ping", { "--x": "70px", "--y": "-50px" })
    piece(a, "chip", { "--x": "70px", "--y": "-50px" }, "？")
  },
}

// 光の筋は回転の軸を持つので、外へ伸ばすには筋ごとに包む
FX.finish = (a) => {
  piece(a, "halo", { "--x": "0px", "--y": "-10px" })
  for (let i = 0; i < 8; i++) {
    const wrap = document.createElement("span")
    wrap.style.cssText = `position:absolute;left:0;top:-10px;rotate:${i * 45 + 22.5}deg`
    piece(wrap, "beam", { "--r": "0deg" })
    a.append(wrap)
  }
  for (const [x, y, s, d] of [[-80, -50, 30, .25], [84, -64, 24, .38], [70, 34, 18, .5]])
    piece(a, "sparkle glow", { "--x": `${x}px`, "--y": `${y}px`, "--s": `${s}px`, "--d": `calc(${d}s * var(--k))` }, svg("0 0 100 100", STAR.replace("<path", '<path fill="url(#gStar)"')))
}

const cards = []
const playById = {}
function makeCard(item, into) {
  const card = document.createElement("article")
  card.className = "card"
  card.dataset.id = item.id
  card.innerHTML = `
    <button type="button" class="stage" aria-label="${item.label}のエフェクトを再生">
      <span class="portrait"><img alt="立ち絵（${item.label}）" src="${IMG(item.img)}"><span class="fx"></span></span>
    </button>
    <div class="meta">
      <div class="row"><h3>${item.label}</h3><span class="expr">${item.id}</span><span class="name ${item.fx ? "" : "none"}">${item.name}</span></div>
      <p>${item.what}</p>
      <span class="was">${item.was}</span>
    </div>`
  into.append(card)
  const portrait = card.querySelector(".portrait")
  const fx = card.querySelector(".fx")
  const play = () => {
    fx.replaceChildren()
    portrait.classList.remove("bounce")
    if (!item.fx) return
    void portrait.offsetWidth
    if (item.bounce) portrait.classList.add("bounce")
    const a = document.createElement("span")
    a.className = "a"
    a.style.setProperty("--ax", item.ax)
    a.style.setProperty("--ay", item.ay)
    fx.append(a)
    FX[item.fx](a, fx)
  }
  card.querySelector(".stage").addEventListener("click", play)
  cards.push(play)
  playById[item.id] = { play, card }
}
EXPRESSIONS.forEach((it) => makeCard(it, document.getElementById("expr")))
ENDINGS.forEach((it) => makeCard(it, document.getElementById("ends")))

const playAll = () => cards.forEach((p) => p())
document.getElementById("replay").addEventListener("click", playAll)
const slow = document.getElementById("slow")
slow.addEventListener("click", () => {
  const on = slow.getAttribute("aria-pressed") !== "true"
  slow.setAttribute("aria-pressed", String(on))
  document.documentElement.style.setProperty("--k", on ? "3" : "1")
  playAll()
})
const loopBtn = document.getElementById("loop")
let timer = null
const startLoop = () => { timer = setInterval(() => playAll(), 3200 * Number(getComputedStyle(document.documentElement).getPropertyValue("--k") || 1)) }
loopBtn.addEventListener("click", () => {
  const on = loopBtn.getAttribute("aria-pressed") !== "true"
  loopBtn.setAttribute("aria-pressed", String(on))
  clearInterval(timer)
  if (on) startLoop()
})
const params = new URLSearchParams(location.search)
if (params.has("still")) {
  loopBtn.setAttribute("aria-pressed", "false")
} else {
  startLoop()
}
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) playAll()
// 撮影用: ?still&t=0.5 で全アニメーションを t 秒の位置で止める
window.freezeCard = (id, t) => {
  const { play, card } = playById[id]
  play()
  for (const anim of card.getAnimations({ subtree: true })) { anim.pause(); anim.currentTime = t * 1000 }
}
</script>
