<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #1f1f2b; color: #e6e6ee; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  .wrap { width: 1000px; padding: 28px 24px 22px; box-sizing: border-box; }
  .sum { display: flex; gap: 8px; margin-bottom: 18px; }
  .badge { display: inline-flex; gap: 6px; align-items: center; padding: 3px 10px; border-radius: 8px; font-size: 14px;
    color: #5fd283; background: rgba(95,210,131,.12); border: 1px solid rgba(95,210,131,.35); }
  .root { font: 13px ui-monospace, Menlo, monospace; color: #8a8a99; margin: 0 0 6px 76px; }
  .row { display: grid; grid-template-columns: 64px 340px 1fr; column-gap: 12px; align-items: center; height: 38px; }
  .row .tree { font: 13px ui-monospace, Menlo, monospace; color: #e6e6ee; }
  .row .tree i { font-style: normal; color: #5b5b6a; }
  .note { font-size: 14px; color: #d8d8e2; }
  .cap { text-align: center; margin-top: 18px; font-size: 14px; color: #a8a8b8; }
  .cap b { color: #d8d8e2; font-weight: 600; margin-right: 8px; }
</style>
<div class="wrap">
  <div class="sum"><span class="badge">＋ 追加 3</span></div>
  <div class="root">/tmp/tsukumo-d2/</div>
  <div class="row"><span class="badge" style="justify-self:start;padding:2px 8px;font-size:13px">＋ 追加</span><span class="tree"><i>├──</i>&nbsp;architecture.d2</span><span class="note">D2 のソース</span></div>
  <div class="row"><span class="badge" style="justify-self:start;padding:2px 8px;font-size:13px">＋ 追加</span><span class="tree"><i>├──</i>&nbsp;arch-dagre.png</span><span class="note">dagre の出力（上の図）</span></div>
  <div class="row"><span class="badge" style="justify-self:start;padding:2px 8px;font-size:13px">＋ 追加</span><span class="tree"><i>└──</i>&nbsp;arch-elk.png</span><span class="note">elk の出力。線は直角だが横に長い</span></div>
  <div class="cap"><b>図 2</b>D2 で描いた構成図のファイル</div>
</div>
