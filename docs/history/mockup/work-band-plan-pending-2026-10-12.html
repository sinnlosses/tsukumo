<!doctype html>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: #17171c; color: #d8d8e0; font: 14px/1.4 -apple-system, "Hiragino Sans", sans-serif; width: 1040px; }
  h2 { font-size: 13px; color: #8a8a99; font-weight: 600; margin: 22px 0 8px; letter-spacing: .02em; }
  h2:first-child { margin-top: 0; }
  .row { display: flex; align-items: center; gap: 12px; background: #1e1e26; border: 1px solid #2b2b36; border-radius: 10px; padding: 12px 16px; margin-bottom: 8px; }
  .dot-live { width: 8px; height: 8px; border-radius: 50%; background: #5ee0c0; flex: none; }
  .state { font-size: 13px; color: #c9c9d4; flex: none; }
  .steps { display: flex; align-items: center; flex: none; }
  .c { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #4a4a5a; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #9a9aa8; }
  .c.now { border-color: #5ee0c0; color: #5ee0c0; }
  .c.done { background: #5ee0c0; border-color: #5ee0c0; color: #17171c; }
  .bar { width: 14px; height: 1.5px; background: #4a4a5a; }
  .title { font-weight: 700; font-size: 16px; color: #f0f0f6; margin-left: 6px; }
  .pos { margin-left: auto; font-size: 12px; color: #8a8a99; }
</style>

<h2>採用: 計画の返却を待つ間。計画と受け入れは番号の無い「・」、範囲の段は「…」の1つ、位置の n/m は出さない</h2>
<div class="row"><span class="dot-live"></span><span class="state">背景で作業中</span>
  <span class="steps"><span class="c now">·</span><span class="bar"></span><span class="c">…</span><span class="bar"></span><span class="c">·</span></span>
  <span class="title">計画を書き直す</span><span class="pos">経過 2分44秒</span></div>

<h2>変えない: 範囲が宣言されたあと。計画は済み、範囲の段に 1〜N、位置は範囲の中の n/N</h2>
<div class="row"><span class="dot-live"></span><span class="state">背景で作業中</span>
  <span class="steps"><span class="c done">✓</span><span class="bar"></span><span class="c now">1</span><span class="bar"></span><span class="c">2</span><span class="bar"></span><span class="c">3</span><span class="bar"></span><span class="c">4</span><span class="bar"></span><span class="c">·</span></span>
  <span class="title">手順5を並べ替える</span><span class="pos">1/4 · 経過 5分02秒</span></div>
