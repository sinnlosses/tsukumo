<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>会話の流れの状態の一覧（2026-11-16）</title>
    <link rel="stylesheet" href="flow.css" />
    <link rel="stylesheet" href="goal.css" />
  </head>
  <!--
    作り直した形（index.html?form=goal）の文法で、4つの場面に出てこない状態を1つずつ描いた一覧。
    流れの一部分だけを、流れと同じ部品で組んでいる。中身はすべて架空で、実物の会話ではない。
    ?pack=shirasuzu|tsukumo      パックの素材と差し色
  -->
  <body class="page-states" data-form="goal">
    <svg class="sprite" width="0" height="0" aria-hidden="true">
      <defs>
        <g id="i-chevron"><path d="m6 9 6 6 6-6" /></g>
        <g id="i-chevron-right"><path d="m9 6 6 6-6 6" /></g>
        <g id="i-check"><path d="m5 12 5 5L20 7" /></g>
        <g id="i-question"><path d="M9 9a3 3 0 0 1 5.8 1c0 2-3 2.4-3 4.2M12 18h.01" /></g>
        <g id="i-expand"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" /></g>
        <g id="i-enter"><path d="M20 5v8a3 3 0 0 1-3 3H5M9 12l-4 4 4 4" /></g>
      </defs>
    </svg>

    <header class="states-head">
      <h1>会話の流れの状態の一覧</h1>
      <p>
        作り直した形の文法で、働く・答える・読む・失敗の場面に出てこない状態を描いた。場面は
        <a href="index.html?form=goal">見本</a>、形の比較は <a href="compare.html">比較のページ</a>。
      </p>
    </header>
    <main class="states" id="states"></main>
    <script src="flow.js"></script>
    <script src="states.js"></script>
  </body>
</html>
