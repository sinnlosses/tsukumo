<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ワークフローのエージェントの様子 — 見本（2026-11-22）</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #191720;
    --surface: #221f2b;
    --ink: #e8e3ea;
    --ink-bright: #f7f6f8;
    --ink-soft: color-mix(in srgb, var(--ink) 72%, transparent);
    --ink-quiet: color-mix(in srgb, var(--ink) 60%, transparent);
    --accent: #f2b0a0;
    --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
    --line: color-mix(in srgb, var(--ink) 12%, transparent);
    --raised: color-mix(in srgb, var(--ink) 10%, transparent);
    --panel: color-mix(in srgb, var(--surface) 45%, transparent);
    --ok: #5fd38a;
    --warn: #f2b544;
    --ng: #ef6b6b;
    --mono: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #0f0e13; color: var(--ink); font: 14px/1.6 system-ui, -apple-system, "Hiragino Sans", sans-serif; }
  button { font: inherit; color: inherit; }

  .page-head { width: 1400px; margin: 0 auto; padding: 20px 0 12px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: end; }
  .page-head h1 { font-size: 20px; margin: 0; }
  .page-head p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
  .switches { margin-left: auto; display: grid; gap: 6px; justify-items: end; }
  .group { display: flex; gap: 6px; align-items: center; }
  .group .k { font-size: 12px; color: var(--ink-quiet); margin-right: 4px; }
  .group button { all: unset; cursor: pointer; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
  .group button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
  .group button:focus-visible { outline: 2px solid var(--accent); }

  /* ===== アプリの枠（1400×900） ===== */
  .app {
    position: relative; width: 1400px; height: 900px; margin: 0 auto; overflow: clip; border-radius: 10px; border: 1px solid var(--line);
    background:
      linear-gradient(color-mix(in srgb, var(--ground) 75%, transparent), color-mix(in srgb, var(--ground) 75%, transparent)),
      url("../../../../characters/tsukumo/background.png") center / cover;
  }
  .topbar { position: absolute; inset: 0 0 auto 0; height: 40px; display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--ground) 60%, transparent); }
  .topbar .face { width: 24px; height: 24px; border-radius: 50%; background: url("../../../../characters/tsukumo/face.png") center / cover; }
  .topbar .room { font-size: 16px; font-weight: 600; }
  .topbar .mode { display: flex; gap: 4px; margin-left: 8px; }
  .topbar .mode span { font-size: 13px; padding: 2px 10px; border-radius: 6px; color: var(--ink-soft); }
  .topbar .mode span.on { background: var(--raised); color: var(--ink); }

  .col { position: absolute; top: 56px; bottom: 17px; }
  .left { left: 16px; width: 246px; display: flex; flex-direction: column; gap: 10px; }
  .center { left: 296px; width: 772px; display: flex; flex-direction: column; gap: 12px; }
  .right { left: 1088px; width: 296px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; backdrop-filter: blur(12px); }

  /* 左の列 */
  .lane { padding: 10px 8px; }
  .lane h2 { font-size: 12px; font-weight: 500; color: var(--ink-quiet); margin: 2px 8px 6px; }
  .lane .row { display: flex; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; font-size: 13px; }
  .lane .row.on { background: var(--raised); }
  .lane .row .mk { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
  .lane .row span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .portrait { position: relative; flex: 1; min-height: 0; overflow: clip; }
  .portrait img { position: absolute; left: 50%; bottom: -8px; height: 92%; translate: -50% 0; object-fit: contain; filter: drop-shadow(0 8px 24px #0008); }

  /* 中央の列: ピル */
  .pill-wrap { position: relative; }
  .pill { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; border-radius: 999px; font-size: 13px; position: relative; }
  .pill .st { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); flex: none; }
  .pill .ph { font-weight: 600; }
  .pill .sep { width: 1px; height: 14px; background: var(--line); }
  .pill .now { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .pill .meta { color: var(--ink-quiet); font-size: 12px; white-space: nowrap; }
  .pill .btn { all: unset; cursor: pointer; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--raised); display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  .pill .btn.on { background: var(--accent-soft); color: var(--ink-bright); }
  .pill .segs { position: absolute; left: 34px; right: 26px; bottom: 3px; display: flex; gap: 4px; }
  .pill .segs i { flex: 1; height: 2px; border-radius: 2px; background: var(--line); position: relative; overflow: hidden; }
  .pill .segs i.done { background: color-mix(in srgb, var(--accent) 70%, transparent); }
  .pill .segs i.cur::after { content: ""; position: absolute; inset: 0 40% 0 0; background: var(--accent); }
  .faces { display: inline-flex; }
  .faces b { width: 9px; height: 9px; border-radius: 50%; margin-left: -2px; box-shadow: 0 0 0 2px var(--surface); }

  .stream { flex: 1; overflow: hidden; padding: 4px 8px; display: flex; flex-direction: column; gap: 14px; }
  .me { align-self: flex-end; max-width: 72%; padding: 10px 16px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 14%, transparent); }
  .say { align-self: flex-start; display: flex; gap: 10px; align-items: flex-start; max-width: 80%; }
  .say .ic { width: 26px; height: 26px; border-radius: 50%; background: url("../../../../characters/tsukumo/face.png") center / cover; flex: none; }
  .say p { margin: 0; padding: 6px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); background: color-mix(in srgb, var(--ground) 70%, transparent); }
  .fold { font-size: 12px; color: var(--ink-quiet); padding-left: 4px; }
  .composer { height: 104px; border-radius: 14px; border: 1.5px solid color-mix(in srgb, var(--accent) 70%, transparent); background: color-mix(in srgb, var(--surface) 70%, transparent); padding: 14px 18px; color: var(--ink-quiet); flex: none; }

  /* 右の列: サイドバー */
  .right .panel { height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .sb-head { padding: 12px 14px 8px; display: grid; gap: 8px; }
  .sb-head .t { display: flex; justify-content: space-between; font-size: 13px; font-weight: 600; }
  .sb-head .t span { font-weight: 400; color: var(--ink-quiet); font-size: 12px; }
  .sb-head input { all: unset; font-size: 12px; padding: 5px 10px; border-radius: 8px; background: var(--raised); color: var(--ink-quiet); }
  .sb-body { flex: 1; overflow: hidden; padding: 0 8px; }
  .stage-h { font-size: 12px; color: var(--ink-quiet); margin: 10px 6px 4px; display: flex; gap: 6px; }
  .trow { display: grid; grid-template-columns: 14px 1fr; gap: 1px 8px; padding: 6px 6px; border-radius: 8px; }
  .trow .ring { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ink-quiet); margin-top: 3px; }
  .trow.now { background: var(--accent-soft); }
  .trow.now .ring { border-color: var(--accent); background: radial-gradient(var(--accent) 40%, transparent 45%); }
  .trow .tt { font-size: 13px; line-height: 1.45; }
  .trow .sub { grid-column: 2; font-size: 12px; color: var(--ink-quiet); display: flex; gap: 8px; }
  .trow .sub code { font-family: var(--mono); }

  /* 案A: 顔ぶれ（サイドバーの「いま」の行に入れ子） */
  .roster { grid-column: 1 / 3; margin: 6px 0 2px 6px; padding-left: 12px; border-left: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); display: grid; gap: 1px; }
  .roster .rh { font-size: 12px; color: var(--ink-quiet); display: flex; gap: 6px; padding: 0 4px 2px; }
  .roster .rh b { font-weight: 500; color: var(--ink-soft); }
  .ag { all: unset; cursor: pointer; display: grid; grid-template-columns: 14px 1fr auto; gap: 0 8px; align-items: center; padding: 4px 6px; border-radius: 6px; font-size: 12px; }
  .ag:hover, .ag:focus-visible { background: var(--raised); }
  .ag[aria-current="true"] { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .ag .n { color: var(--ink); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ag .tm { font-family: var(--mono); color: var(--ink-quiet); }
  .ag .tk { grid-column: 2 / 4; display: flex; gap: 2px; height: 6px; align-items: end; margin-top: 2px; }
  .ag .tk i { width: 3px; border-radius: 1px; background: color-mix(in srgb, var(--ink) 30%, transparent); }
  .ag .tk i.l { background: var(--accent); }
  .ag .tk i.e { background: var(--ng); }
  .ag .why { grid-column: 2 / 4; color: var(--ink-quiet); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .ag.queued .n, .ag.queued .tm { color: var(--ink-quiet); }

  /* 状態の印（3案で共通） */
  .si { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; line-height: 1; flex: none; }
  .si.run { border: 2px solid var(--accent); border-right-color: transparent; animation: spin 1.1s steps(8) infinite; }
  .si.done { background: color-mix(in srgb, var(--ok) 20%, transparent); color: var(--ok); }
  .si.done::before { content: "✓"; }
  .si.err { background: color-mix(in srgb, var(--ng) 22%, transparent); color: var(--ng); }
  .si.err::before { content: "!"; font-weight: 700; }
  .si.queued { border: 1.5px dashed var(--ink-quiet); }
  .si.think { border: 2px solid color-mix(in srgb, var(--accent) 60%, transparent); }
  @keyframes spin { to { rotate: 360deg; } }
  @media (prefers-reduced-motion: reduce) { .si.run { animation: none; } }

  .usage { border-top: 1px solid var(--line); background: color-mix(in srgb, var(--ground) 40%, transparent); padding: 10px 14px 12px; display: grid; gap: 8px; }
  .usage .u { display: grid; grid-template-columns: 1fr auto; font-size: 12px; color: var(--ink-soft); }
  .usage .u i { grid-column: 1 / 3; height: 3px; border-radius: 2px; background: var(--line); margin-top: 4px; position: relative; }
  .usage .u i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 2px; }

  /* 案A: エージェントのサイドシート（中央の列の右端に重ねる。ADR 0061 の置き場） */
  .sheet { position: absolute; top: 108px; right: 324px; width: 440px; bottom: 141px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 18px 48px #000a; display: flex; flex-direction: column; overflow: hidden; }
  .sheet header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 4px; }
  .sheet header .l1 { display: flex; gap: 8px; align-items: center; font-size: 15px; font-weight: 600; }
  .sheet header .l1 .x { margin-left: auto; color: var(--ink-quiet); font-weight: 400; }
  .sheet header .l2 { display: flex; gap: 12px; font-size: 12px; color: var(--ink-quiet); flex-wrap: wrap; }
  .sheet header .l2 b { color: var(--ink-soft); font-weight: 500; }
  .sheet .body { padding: 10px 14px; overflow: hidden; display: grid; gap: 2px; align-content: start; }
  .sheet .sh { font-size: 12px; color: var(--ink-quiet); margin: 6px 2px 4px; }
  .step { display: grid; grid-template-columns: 44px 14px 1fr auto; gap: 8px; align-items: center; font-size: 12px; padding: 3px 4px; border-radius: 6px; }
  .step .at { font-family: var(--mono); color: var(--ink-quiet); }
  .step .w { font-family: var(--mono); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .step .d { font-family: var(--mono); color: var(--ink-quiet); }
  .step.cur { background: var(--accent-soft); }
  .msg { font-size: 13px; padding: 8px 10px; border-radius: 8px; background: var(--raised); margin: 2px 0 6px; }
  .msg small { display: block; color: var(--ink-quiet); font-size: 12px; }

  /* 案B: ピルのポップオーバー */
  .pop { position: absolute; top: 48px; right: 0; width: 420px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 18px 48px #000a; padding: 12px 14px; z-index: 5; display: grid; gap: 4px; }
  .pop h3 { margin: 0 0 4px; font-size: 13px; display: flex; gap: 8px; }
  .pop h3 span { color: var(--ink-quiet); font-weight: 400; font-size: 12px; margin-left: auto; }
  .pop .ph-h { font-size: 12px; color: var(--ink-quiet); margin: 6px 0 2px; }
  .prow { display: grid; grid-template-columns: 14px 120px 1fr auto; gap: 8px; align-items: center; font-size: 12px; padding: 4px 6px; border-radius: 6px; }
  .prow .w { font-family: var(--mono); color: var(--ink-soft); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .prow .tm { font-family: var(--mono); color: var(--ink-quiet); }
  .prow.cur { background: var(--accent-soft); }

  /* 案C: 流れの中のレーンの札 */
  .lanes { padding: 12px 16px 14px; display: grid; gap: 6px; }
  .lanes h3 { margin: 0 0 2px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: flex-start; }
  .lanes h3 > span:last-child { margin-left: auto; color: var(--ink-quiet); font-size: 12px; font-weight: 400; }
  .lane-row { display: grid; grid-template-columns: 14px 112px 1fr 52px; gap: 8px; align-items: center; font-size: 12px; }
  .lane-row .track { position: relative; height: 16px; border-radius: 4px; background: color-mix(in srgb, var(--ink) 5%, transparent); }
  .lane-row .bar { position: absolute; top: 3px; bottom: 3px; border-radius: 3px; background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .lane-row .bar.done { background: color-mix(in srgb, var(--ok) 45%, transparent); }
  .lane-row .bar.err { background: color-mix(in srgb, var(--ng) 55%, transparent); }
  .lane-row .bar.run { background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 55%, transparent), var(--accent)); }
  .lane-row .bar .lbl { position: absolute; left: 6px; top: -2px; font: 12px/16px var(--mono); color: #2a1712; white-space: nowrap; }
  .lane-row .bar .lbl.out { left: auto; right: calc(100% + 6px); color: var(--ink-soft); }
  .lane-row .tm { font-family: var(--mono); color: var(--ink-quiet); text-align: right; }
  .lane-row .n { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .lanes .axis { display: grid; grid-template-columns: 134px 1fr 52px; font: 12px var(--mono); color: var(--ink-quiet); }
  .lanes .axis div { display: flex; justify-content: space-between; }
  .lanes .nowline { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--ink-soft); }

  /* 下の説明 */
  .notes { width: 1400px; margin: 18px auto 48px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .note { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .note.hl { border-color: var(--accent); }
  .note h2 { font-size: 15px; margin: 0 0 6px; }
  .note p, .note li { font-size: 13px; color: var(--ink-soft); margin: 0 0 4px; }
  .note ul { margin: 0; padding-left: 18px; }
  .note .where { font-size: 12px; color: var(--ink-quiet); }
  .wide { grid-column: 1 / 4; }
  table.place { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.place th, table.place td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.place th { color: var(--ink-quiet); font-weight: 500; font-size: 12px; }
</style>
</head>
<body>

<header class="page-head">
  <div>
    <h1>ワークフローのエージェントの様子 — 3案</h1>
    <p>ワークフローの実行中に、エージェントごとの状態（誰が・どの段で・いま何を・どれだけ）を見せる置き場の比較。データはすべて架空。1400×900 の実寸。</p>
  </div>
  <div class="switches">
    <div class="group" data-key="plan"><span class="k">案</span>
      <button data-v="a">A サイドバーの「いま」に顔ぶれ（推奨）</button>
      <button data-v="b">B ピルから開く顔ぶれ</button>
      <button data-v="c">C 流れの中のレーン</button>
    </div>
    <div class="group" data-key="scene"><span class="k">場面</span>
      <button data-v="seq">順に回る（task-flow）</button>
      <button data-v="par">並んで回る（レビュー）</button>
    </div>
    <div class="group" data-key="open"><span class="k">詳細</span>
      <button data-v="0">閉じる</button>
      <button data-v="1">開く</button>
    </div>
  </div>
</header>

<div class="app" id="app">
  <div class="topbar">
    <span class="face"></span><span class="room">tsukumo-2</span>
    <div class="mode"><span class="on">仕事</span><span>雑談</span></div>
  </div>

  <!-- 左の列 -->
  <div class="col left">
    <div class="panel lane">
      <h2>やり取り</h2>
      <div class="row on"><span class="mk"></span><span id="lane-title">タスク GH-2556 を進めて</span></div>
    </div>
    <div class="portrait"><img src="../../../../characters/tsukumo/default.png" alt="" /></div>
  </div>

  <!-- 中央の列 -->
  <div class="col center">
    <div class="pill-wrap">
      <div class="pill panel" id="pill"></div>
      <div class="pop" id="pop" hidden></div>
    </div>
    <div class="stream" id="stream"></div>
    <div class="composer">つくも への依頼を書く</div>
  </div>

  <!-- 右の列 -->
  <div class="col right">
    <div class="panel">
      <div class="sb-head">
        <div class="t">タスク <span>12件</span></div>
        <input value="探す" readonly />
      </div>
      <div class="sb-body" id="sidebar"></div>
      <div class="usage">
        <div class="u">コンテキスト <span>48%</span><i><b style="width:48%"></b></i></div>
        <div class="u">5時間 <span>34%</span><i><b style="width:34%"></b></i></div>
        <div class="u">7日 <span>61%</span><i><b style="width:61%"></b></i></div>
      </div>
    </div>
  </div>

  <aside class="sheet" id="sheet" hidden></aside>
</div>

<section class="notes" id="notes"></section>

<script>
/* ---------- 架空のデータ ---------- */
const SCENES = {
  seq: {
    request: "タスク GH-2556 を進めて",
    task: { id: "GH-2556", title: "設定の「既定に戻す」がページと関係なく色を戻す", sub: "Sonnet · ∞" },

    phases: ["実装", "受け入れ", "振り返り"], phaseAt: 1,
    elapsed: "14:32",
    agents: [
      { name: "実装", phase: "実装", state: "done", time: "9:48", steps: 41, ticks: "lllllllllllllll", end: "済み · 申し送り 1件" },
      { name: "受け入れ 1", phase: "受け入れ", state: "done", time: "2:10", steps: 12, ticks: "llllllle", end: "差し戻し · 指摘 2件" },
      { name: "直し 1", phase: "受け入れ", state: "run", time: "1:58", steps: 9, ticks: "lllllllll", now: "Edit src/browser/…/settings-reset.ts", cur: true },
      { name: "受け入れ 2", phase: "受け入れ", state: "queued", time: "—", steps: 0, ticks: "" },
      { name: "振り返り", phase: "振り返り", state: "queued", time: "—", steps: 0, ticks: "" },
    ],
    lanesSpan: [ [0, 64], [64, 79], [79, 92], null, null ],
  },
  par: {
    request: "この差分をレビューして",
    task: { id: "—", title: "この差分をレビューして（タスク外の依頼）", sub: "ワークフロー review-changes" },
    workflow: "review-changes",
    phases: ["レビュー", "確かめ"], phaseAt: 0,
    elapsed: "3:41",
    agents: [
      { name: "review:bugs", phase: "レビュー", state: "run", time: "3:41", steps: 23, ticks: "lllllllllll", now: "Grep usePopover src/browser", cur: true },
      { name: "review:perf", phase: "レビュー", state: "think", time: "3:41", steps: 17, ticks: "llllllll", now: "考えている · 18秒" },
      { name: "review:a11y", phase: "レビュー", state: "done", time: "2:05", steps: 11, ticks: "lllllll", end: "済み · 指摘 3件" },
      { name: "review:css", phase: "レビュー", state: "err", time: "0:47", steps: 4, ticks: "llle", end: "失敗 · 上限に達した" },
      { name: "verify", phase: "確かめ", state: "queued", time: "—", steps: 0, ticks: "", why: "レビューの指摘を待つ" },
    ],
    lanesSpan: [ [0, 100], [0, 100], [0, 57], [0, 21], null ],
  },
};

const STEPS = {
  seq: [
    ["14:21", "done", "Read  src/browser/…/settings-reset.ts", "0.4秒"],
    ["14:22", "done", "Grep  resetToDefault", "0.8秒"],
    ["14:24", "done", "Edit  settings-reset.ts", "0.2秒"],
    ["14:25", "done", "Bash  pnpm run test settings-reset", "38秒"],
    ["14:27", "done", "Read  test/…/settings-reset.test.ts", "0.3秒"],
    ["14:28", "done", "Edit  settings-reset.test.ts", "0.2秒"],
    ["14:29", "err",  "Bash  pnpm run test settings-reset", "41秒 · 1件落ちた"],
    ["14:31", "run",  "Edit  settings-reset.ts", "12秒"],
  ],
  par: [
    ["03:12", "done", "Bash  git diff main...HEAD --stat", "0.6秒"],
    ["03:12", "done", "Read  src/browser/…/use-popover.ts", "0.3秒"],
    ["03:13", "done", "Read  src/browser/…/work-strip.tsx", "0.4秒"],
    ["03:14", "done", "Grep  addEventListener src/browser", "0.9秒"],
    ["03:15", "done", "Read  src/browser/…/pill-detail.tsx", "0.3秒"],
    ["03:15", "run",  "Grep  usePopover src/browser", "4秒"],
  ],
};

/* ---------- 状態 ---------- */
const params = new URLSearchParams(location.search);
const state = { plan: params.get("plan") || "a", scene: params.get("scene") || "seq", open: params.get("open") || "0" };

const $ = (id) => document.getElementById(id);
const si = (s) => `<span class="si ${s}"></span>`;
const counts = (ag) => {
  const c = { run: 0, done: 0, err: 0, queued: 0 };
  ag.forEach((a) => { c[a.state === "think" ? "run" : a.state]++ });
  return c;
};
const faceDots = (ag) => `<span class="faces">${ag.map((a) => `<b style="background:${{run:"var(--accent)",think:"color-mix(in srgb,var(--accent) 60%,transparent)",done:"var(--ok)",err:"var(--ng)",queued:"var(--line)"}[a.state]}"></b>`).join("")}</span>`;
const ticks = (t) => [...t].map((c, i, arr) => `<i class="${c === "e" ? "e" : i === arr.length - 1 ? "l" : ""}" style="height:${3 + ((i * 7) % 4)}px"></i>`).join("");

function render() {
  const s = SCENES[state.scene];
  const ag = s.agents;
  const cur = ag.find((a) => a.cur);
  const c = counts(ag);
  $("lane-title").textContent = s.request;

  /* ピル */
  const segs = s.phases.map((_, i) => `<i class="${i < s.phaseAt ? "done" : i === s.phaseAt ? "cur" : ""}"></i>`).join("");
  const nowText = state.plan === "c"
    ? `${c.run} 体が動いています`
    : state.plan === "a" && state.scene === "par"
      ? `${c.run} 体が並んで動いています`
      : `${cur.name} · ${cur.now}`;
  const pillBtn = state.plan === "b"
    ? `<button class="btn ${state.open === "1" ? "on" : ""}" data-toggle>${faceDots(ag)} 顔ぶれ ${c.run}/${ag.length}</button>`
    : `<button class="btn">手順 ⌄</button>`;
  $("pill").innerHTML = `<span class="st"></span><span class="ph">${s.phases[s.phaseAt]}</span><span class="sep"></span>
    <span class="now">${nowText}</span><span class="meta">${s.phaseAt + 1}/${s.phases.length} · 経過 ${s.elapsed}</span>${pillBtn}
    <div class="segs">${segs}</div>`;

  /* ピルのポップオーバー（案B） */
  const pop = $("pop");
  pop.hidden = !(state.plan === "b" && state.open === "1");
  if (!pop.hidden) {
    let html = `<h3>${s.workflow} の顔ぶれ <span>動いている ${c.run} · 済み ${c.done} · 失敗 ${c.err} · 待ち ${c.queued}</span></h3>`;
    s.phases.forEach((p) => {
      const rows = ag.filter((a) => a.phase === p);
      if (!rows.length) return;
      html += `<div class="ph-h">${p}</div>`;
      html += rows.map((a) => `<div class="prow ${a.cur ? "cur" : ""}">${si(a.state)}<span>${a.name}</span><span class="w">${a.now || a.end || a.why || "まだ始まっていない"}</span><span class="tm">${a.time}</span></div>`).join("");
    });
    pop.innerHTML = html;
  }

  /* 流れ */
  let stream = `<div class="me">${s.request}</div>
    <div class="say"><span class="ic"></span><p>${state.scene === "seq" ? "GH-2556 ですね。計画は登録のままで通ったので、実装から振り返りまで流れに任せますの。" : "差分のレビューですね。4つの観点に分けて並べて見てもらいます。"}</p></div>`;
  if (state.scene === "seq") {
    stream += `<div class="fold">› 実装 · 9分48秒 — 設定のページごとに既定を引くようにした</div>
      <div class="say"><span class="ic"></span><p>受け入れで指摘が2件付いたので、直しの番に入りましたの。</p></div>`;
  }
  if (state.plan === "c") stream += lanesCard(s);
  $("stream").innerHTML = stream;

  /* サイドバー */
  let sb = `<div class="stage-h">いま</div>
    <div class="trow now"><span class="ring"></span><span class="tt">${s.task.title}</span>
      <span class="sub"><code>${s.task.id}</code><span>${s.task.sub}</span></span>`;
  if (state.plan === "a") {
    sb += `<div class="roster"><div class="rh"><b>${s.workflow}</b><span>· 動いている ${c.run} / ${ag.length}</span></div>`;
    sb += ag.map((a, i) => `<button class="ag ${a.state === "queued" ? "queued" : ""}" data-agent="${i}" aria-current="${state.open === "1" && a.cur}">${si(a.state)}<span class="n">${a.name}</span><span class="tm">${a.time}</span>
      ${a.state === "queued" ? (a.why ? `<span class="why">${a.why}</span>` : "") : a.end ? `<span class="why">${a.end}</span>` : `<span class="tk">${ticks(a.ticks)}</span>`}</button>`).join("");
    sb += `</div>`;
  }
  sb += `</div>
    <div class="stage-h">つぎ</div>
    <div class="trow"><span class="ring"></span><span class="tt">左右の列のタブの採否を決める</span><span class="sub"><code>GH-2570</code><span>Opus</span></span></div>
    <div class="trow"><span class="ring"></span><span class="tt">書き出しの Mermaid の余白をそろえる</span><span class="sub"><code>GH-2558</code><span>Haiku · ∞</span></span></div>
    <div class="stage-h">待ち</div>
    <div class="trow"><span class="ring" style="border-style:dashed"></span><span class="tt">ItemList の流れの分岐を Stepper の札にそろえる</span><span class="sub"><span>GH-2556 待ち</span><code>GH-2566</code></span></div>`;
  $("sidebar").innerHTML = sb;

  /* サイドシート（案A） */
  const sheet = $("sheet");
  sheet.hidden = !(state.plan === "a" && state.open === "1");
  if (!sheet.hidden) {
    const msgs = state.scene === "seq"
      ? `<div class="sh">申し送り（つくも へ）</div><div class="msg">指摘 2件のうち 1件目を直した。テストを打ち直す<small>14:29 · SendMessage</small></div>`
      : `<div class="sh">申し送り（つくも へ）</div><div class="msg">popover の閉じ方で 1件見つけた。残りの観点を見ている<small>03:14 · SendMessage</small></div>`;
    sheet.innerHTML = `<header>
        <div class="l1">${si(cur.state)} ${cur.name}<span class="x">✕</span></div>
        <div class="l2"><span>段 <b>${cur.phase}</b></span><span>モデル <b>${state.scene === "seq" ? "Sonnet" : "Opus"}</b></span><span>経過 <b>${cur.time}</b></span><span>手順 <b>${cur.steps}</b></span><span>トークン <b>${state.scene === "seq" ? "38k" : "61k"}</b></span></div>
      </header>
      <div class="body">${msgs}<div class="sh">手順（新しい順に下へ）</div>
        ${STEPS[state.scene].map(([at, st, w, d]) => `<div class="step ${st === "run" ? "cur" : ""}"><span class="at">${at}</span>${si(st)}<span class="w">${w}</span><span class="d">${d}</span></div>`).join("")}
      </div>`;
  }

  /* 説明 */
  $("notes").innerHTML = NOTES[state.plan];

  document.querySelectorAll(".group").forEach((g) => g.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(state[g.dataset.key] === b.dataset.v))));
}

function lanesCard(s) {
  const ag = s.agents;
  const c = counts(ag);
  const rows = ag.map((a, i) => {
    const sp = s.lanesSpan[i];
    const bar = sp ? `<span class="bar ${a.state === "think" ? "run" : a.state}" style="left:${sp[0]}%;width:${sp[1] - sp[0]}%">${a.state === "run" || a.state === "think" ? `<span class="lbl ${sp[1] - sp[0] < 40 ? "out" : ""}">${a.now}</span>` : ""}</span>` : "";
    return `<div class="lane-row">${si(a.state)}<span class="n">${a.name}</span><span class="track">${bar}</span><span class="tm">${a.time}</span></div>`;
  }).join("");
  return `<div class="panel lanes"><h3>${s.workflow} ${faceDots(ag)}<span>動いている ${c.run} · 済み ${c.done} · 失敗 ${c.err} · 待ち ${c.queued}</span></h3>${rows}
    <div class="axis"><span></span><div><span>0:00</span><span>${s.elapsed}</span></div><span></span></div></div>`;
}

const PLACE = `<div class="note wide"><h2>情報 → 置き場（同じ情報を2か所に出さない）</h2>
  <table class="place"><tr><th>情報</th><th>案A</th><th>案B</th><th>案C</th></tr>
  <tr><td>段の位置・全体の経過</td><td>ピル</td><td>ピル</td><td>ピル</td></tr>
  <tr><td>いちばん新しい手順の1行</td><td>ピル（並んで回るときは「n 体が並んで動いています」に替える）</td><td>ピル</td><td>レーンの札の中（ピルは「n 体」）</td></tr>
  <tr><td>エージェントの顔ぶれと状態</td><td>サイドバーの「いま」の行の下</td><td>ピルの「顔ぶれ」から開くポップオーバー</td><td>流れの中の札</td></tr>
  <tr><td>1体の手順の履歴・申し送り</td><td>サイドシート（行を押す）</td><td>無し</td><td>無し（済んだら「作業の経過」に畳む）</td></tr>
  <tr><td>立ち絵の側</td><td colspan="3">出さない（舞台に進行を出さない決まり）。エージェントの状態が変わったときに話すかは、今の「セリフの間合い」のまま</td></tr></table></div>`;

const NOTES = {
  a: `<div class="note hl"><h2>A サイドバーの「いま」に顔ぶれ（推奨）</h2>
      <p>タスク → ワークフロー → エージェントの入れ子。ADR 0061 の「いま」の段の行の下に、エージェントを1行ずつ出す。行は状態の印・名札・経過と、手順の刻み（1手順1本の短い棒）か、済んだ・待ちのわけ。</p>
      <p>行を押すと、ADR 0061 のサイドシートと同じ置き場に、その1体の手順の履歴・申し送り・モデル・トークンを出す（「詳細: 開く」）。</p>
      <p class="where">サイドバーは「道具は右に寄せる」（ADR 0058）の置き場。のぞいた瞬間に「どのタスクで、誰が、どれだけ」が開かずに読める。</p></div>
    <div class="note"><h2>弱いところ</h2><ul>
      <li>並んで回る体が多い（6体以上）と「つぎ」の段が下へ押される。6体を超えたら、動いている体と失敗だけを残して「ほか n 体」に畳む</li>
      <li>タスクに結ばれない依頼（場面「並んで回る」）は、「いま」の段に依頼の行を仮に立てる。タスクの一覧に依頼が混ざる形になる</li>
      <li>左右の列のタブの見本（保留中）を採るなら、右の「タスク」タブがそのまま置き場になる</li></ul></div>
    ${PLACE}`,
  b: `<div class="note"><h2>B ピルから開く顔ぶれ</h2>
      <p>ピルの右に、状態の色の点を並べた「顔ぶれ 1/5」の口を足す。押すと、ADR 0070 の「手順」の詳細と同じ作りのポップオーバーで、段ごとにエージェントを1行ずつ出す。外を押すと閉じる。</p>
      <p class="where">足すのは口1つとポップオーバーだけで、器（3列）とサイドバーに手を入れない。いちばん小さい。</p></div>
    <div class="note"><h2>弱いところ</h2><ul>
      <li>開かないと見えない。常に見えているのは色の点だけで、「どれが止まっているか」は押すまで分からない</li>
      <li>1体の手順の履歴を出す場所が無い（ポップオーバーの中で入れ子にすると重い）</li>
      <li>「手順」と「顔ぶれ」の2つの口がピルに並ぶ</li></ul></div>
    ${PLACE}`,
  c: `<div class="note"><h2>C 流れの中のレーン</h2>
      <p>会話の流れの末尾に、ワークフロー1本を1枚の札にして出す。エージェントごとに1本のレーンで、横軸は経過。走っている帯の上に今の手順を書く。済むと「作業の経過」に畳まれ、あとから並びと長さを読み返せる。</p>
      <p class="where">目が止まる流れの下端にあり、並んで回る様子と「どこで延びたか」がいちばん分かる。</p></div>
    <div class="note"><h2>弱いところ</h2><ul>
      <li>流れの中に進行が出る。ADR 0070 で進行をピルへ寄せた方針と逆向きになり、段の位置がピルと札の2か所に出かかる</li>
      <li>流れを上へ送って読んでいるあいだは見えない</li>
      <li>札の高さが体の数で伸び、セリフと最終レポートを押し上げる</li></ul></div>
    ${PLACE}`,
};

document.querySelectorAll(".group button").forEach((b) => b.addEventListener("click", () => {
  state[b.closest(".group").dataset.key] = b.dataset.v;
  const q = new URLSearchParams(state); history.replaceState(null, "", "?" + q);
  render();
}));
document.addEventListener("click", (e) => {
  if (e.target.closest("[data-toggle]")) { state.open = state.open === "1" ? "0" : "1"; render(); }
  else if (e.target.closest("[data-agent]")) { state.open = "1"; render(); }
  else if (e.target.closest(".sheet .x")) { state.open = "0"; render(); }
});
render();
</script>
</body>
</html>
