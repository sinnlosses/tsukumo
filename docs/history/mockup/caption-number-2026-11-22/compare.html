<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>図表の番号の見本（今と案）</title>
<style>
  :root {
    --ground: #191720;
    --ink: #e8e3ea;
    --ink-quiet: color-mix(in srgb, var(--ink) 60%, transparent);
    --ink-soft: color-mix(in srgb, var(--ink) 72%, transparent);
    --rule: color-mix(in srgb, var(--ink) 16%, transparent);
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, monospace;
    --font-label: 0.75rem;
    --font-secondary: 0.75rem;
    --font-subheading: 0.875rem;
    --space-xs: 4px;
    --space-md: 12px;
  }
  body {
    margin: 0;
    padding: 32px;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 14px;
  }
  h1 { font-size: 16px; margin: 0 0 24px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; }
  .col h2 { font-size: 13px; color: var(--ink-soft); margin: 0 0 16px; font-weight: 600; }
  .paper {
    padding: 24px;
    border: 1px solid var(--rule);
    border-radius: 12px;
    background: color-mix(in srgb, var(--ground), var(--ink) 4%);
    display: flex;
    flex-direction: column;
    gap: 32px;
  }
  .figure { display: flex; flex-direction: column; align-items: center; }
  .shot {
    width: 360px; height: 120px; border-radius: 8px;
    background: linear-gradient(135deg, #2a2633, #3a3344);
    border: 1px solid var(--rule);
  }
  .caption { margin-top: var(--space-xs); text-align: center; color: var(--ink-quiet); }
  .table-caption { margin-bottom: var(--space-xs); width: 100%; text-align: center; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--rule); padding: 6px 8px; text-align: left; }
  th { color: var(--ink-soft); font-weight: 600; }

  /* 今: 図の番号は等幅・12px・字間 0.08em・題との間 12px。表の番号は本文書体の 12px・600、題は 14px。 */
  .now .fig-caption { font-size: var(--font-secondary); }
  .now .fig-number {
    margin-inline-end: var(--space-md);
    font-family: var(--font-mono);
    font-size: var(--font-label);
    letter-spacing: 0.08em;
  }
  .now .tbl-number { margin-inline-end: var(--space-md); font-size: var(--font-secondary); font-weight: 600; }
  .now .tbl-text { font-size: var(--font-subheading); color: var(--ink-soft); }

  /* 案: 番号は本文書体・600 のまま、大きさは題にそろえ、「図1」「表1」と詰める。題との間は 0.5em。 */
  .plan .fig-caption { font-size: var(--font-secondary); }
  .plan .fig-number { margin-inline-end: 0.5em; font-weight: 600; }
  .plan .tbl-caption { font-size: var(--font-subheading); }
  .plan .tbl-number { margin-inline-end: 0.5em; font-weight: 600; color: var(--ink-quiet); }
  .plan .tbl-text { color: var(--ink-soft); }
</style>
</head>
<body>
<h1>図表の番号（「図 n」「表 n」）の見本</h1>
<div class="grid">
  <section class="col now">
    <h2>今</h2>
    <div class="paper">
      <div class="figure">
        <div class="shot"></div>
        <p class="caption fig-caption"><span class="fig-number">図 1</span><span>順に回る場面の図（前回の直しのあと→今回）</span></p>
      </div>
      <div class="figure">
        <p class="caption table-caption"><span class="tbl-number">表 1</span><span class="tbl-text">フィードバックと直したこと</span></p>
        <table>
          <tr><th>フィードバック</th><th>直したこと</th></tr>
          <tr><td>矢印が狭い</td><td>列の間を 32px に広げた</td></tr>
          <tr><td>手順は既定で畳む</td><td>「手順 n」を畳んだ</td></tr>
        </table>
      </div>
    </div>
  </section>
  <section class="col plan">
    <h2>案（太さはそのまま・大きさを題にそろえる・番号を詰める）</h2>
    <div class="paper">
      <div class="figure">
        <div class="shot"></div>
        <p class="caption fig-caption"><span class="fig-number">図1</span><span>順に回る場面の図（前回の直しのあと→今回）</span></p>
      </div>
      <div class="figure">
        <p class="caption table-caption tbl-caption"><span class="tbl-number">表1</span><span class="tbl-text">フィードバックと直したこと</span></p>
        <table>
          <tr><th>フィードバック</th><th>直したこと</th></tr>
          <tr><td>矢印が狭い</td><td>列の間を 32px に広げた</td></tr>
          <tr><td>手順は既定で畳む</td><td>「手順 n」を畳んだ</td></tr>
        </table>
      </div>
    </div>
  </section>
</div>
</body>
</html>
