<!doctype html>
<!--
  レポートとプログレスの見直し案の試作・全体版（2026-11-12）。使い捨て。中身はすべて架空。
  案A「舞台と紙」（../ui-rebuild-2026-11-12/whole.html）の紙の上で、3つの群を切り替えて見る。
    ?group=paper  紙:          deliver 渡す / again 2回目 / decide 判断を仰ぐ / quick 短い答え
    ?group=parts  部品の見本帳: text 文 / number 数 / compare 比べる / link つながり / proof 証拠 / touch 触る
    ?group=flow   進み具合:     work 働く / laps 流れと周回 / long 長い作業 / wait 止まる・待つ / ask 割り込み /
                                fail 失敗 / stopped 止めた / away 戻る / loop ループ
  ?moment= で場面、?tone=day で昼、?depth=1〜3 で読む深さ（紙の群）、?bar=0 で切り替えの帯を隠す。
  進み具合の印は、成果の暦と同じ狐火の形（今の画面の Lamp）を使う。
  左の舞台は上から、部屋の頭・今日の灯り・この依頼でのやり取りの流れ・いまの吹き出し（手元つき）・立ち絵。
  吹き出しは立ち絵のすぐ上に付く。立ち絵の右上の札は相づち（押すとキャラクターが返す）。
  立ち絵は characters/local/karakasa があればそれ、無ければ同梱の tsukumo。
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>レポートとプログレスの見直し案（試作・全体版）</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        --accent: #ff9e9e;
        --accent-ink: var(--accent);
        --night: #14121a;
        --stage-w: clamp(300px, 27vw, 520px);
        --ink: #ece8ef;
        --ink-soft: rgb(236 232 239 / 0.78);
        --ink-quiet: rgb(236 232 239 / 0.56);
        --sheet: #211e29;
        --float: #2c2836;
        --raise: rgb(236 232 239 / 0.06);
        --rule: rgb(236 232 239 / 0.12);
        --ok: #6fcf7f;
        --warn: #e3b341;
        --ng: #f0646a;
        --data: #3987e5;
        --data-2: #d95926;
        --data-3: #199e70;
        --data-mute: rgb(236 232 239 / 0.26);
        --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
        --voice: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
        --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
        background: var(--night);
        color: var(--ink);
        font: 16px/1.8 var(--sans);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
        line-break: strict;
        text-autospace: normal;
      }
      body[data-tone="day"] .tone {
        --accent-ink: color-mix(in oklab, var(--accent), #1f1c27 46%);
        --ink: #1f1c27;
        --ink-soft: rgb(31 28 39 / 0.8);
        --ink-quiet: rgb(31 28 39 / 0.62);
        --sheet: #f4f2f7;
        --float: #ffffff;
        --raise: rgb(31 28 39 / 0.05);
        --rule: rgb(31 28 39 / 0.14);
        --ok: #1c7c37;
        --warn: #8a6500;
        --ng: #c62f38;
        --data: #2a78d6;
        --data-2: #eb6834;
        --data-3: #1baf7a;
        --data-mute: rgb(31 28 39 / 0.22);
      }
      .tone {
        color: var(--ink);
      }
      button,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent-ink);
        outline-offset: 2px;
      }
      code,
      .mono,
      kbd {
        font-family: var(--mono);
        font-size: 0.86em;
      }
      kbd {
        border-radius: 5px;
        padding: 1px 6px;
        background: var(--raise);
      }
      p {
        margin: 0;
      }

      /* 舞台 */
      .room {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: var(--stage-w) minmax(0, 1fr);
      }
      /* 舞台は上から、部屋の頭・今日の灯り・やり取りの流れ・いまの吹き出し・立ち絵。
         吹き出しは立ち絵のすぐ上に積むので、画面の高さが変わっても立ち絵から離れない。
         立ち絵の高さは幅から決まる（素材は 874×800）。 */
      .stage {
        --portrait-h: calc(var(--stage-w) * 1.08);
        position: relative;
        overflow: hidden;
        background: var(--scene) center / cover no-repeat;
        display: flex;
        flex-direction: column;
      }
      .stage::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgb(20 18 26 / 0.78) 0, rgb(20 18 26 / 0.28) 170px, transparent 300px),
          linear-gradient(90deg, transparent 62%, var(--night));
        pointer-events: none;
      }
      .stage > * {
        position: relative;
        z-index: 2;
      }
      .stage img.portrait {
        position: absolute;
        z-index: 1;
        left: -6%;
        bottom: 0;
        width: 118%;
        mask-image: linear-gradient(0deg, black 82%, transparent), linear-gradient(90deg, black 80%, transparent);
        mask-composite: intersect;
      }
      .st-top {
        padding: 14px 18px 0;
        font-size: 13.5px;
        color: var(--ink-soft);
      }
      .rh {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .rh b {
        font-size: 18px;
        color: var(--ink);
      }
      .rh .seg {
        margin-left: auto;
        background: rgb(24 20 28 / 0.6);
      }
      .rh-nav {
        display: flex;
        gap: 14px;
        margin-top: 2px;
        font-size: 13px;
      }
      .rh-nav span:last-child {
        margin-left: auto;
      }
      .today {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        margin-top: 10px;
        padding: 5px 12px 6px;
        border: 0;
        border-radius: 11px;
        background: rgb(24 20 28 / 0.6);
        backdrop-filter: blur(6px);
        color: var(--ink-soft);
        font-size: 13px;
        text-align: left;
      }
      .today > span:first-child {
        white-space: nowrap;
      }
      .today b {
        color: var(--ink);
      }
      .today .plus {
        color: var(--accent);
        font-weight: 700;
      }
      .wk {
        display: flex;
        gap: 4px;
        margin-left: auto;
      }
      .wk span {
        display: grid;
        justify-items: center;
        align-content: end;
        width: 22px;
        height: 36px;
        font-size: 12px;
        line-height: 1.2;
        color: var(--ink-quiet);
      }
      .wk .is-today {
        color: var(--ink);
        font-weight: 700;
      }
      .talk-wrap {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .more {
        position: absolute;
        z-index: 1;
        top: 8px;
        left: 18px;
        border: 0;
        border-radius: 999px;
        padding: 1px 12px;
        background: rgb(24 20 28 / 0.82);
        color: var(--ink-soft);
        font-size: 13px;
      }
      .talk {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: flex-start;
        gap: 6px;
        padding: 14px 18px 12px;
        overflow: hidden;
        mask-image: linear-gradient(180deg, transparent 30px, black 96px);
      }
      .vl {
        flex: none;
        max-width: 95%;
        border: 0;
        border-radius: 11px;
        padding: 4px 11px 5px;
        background: rgb(24 20 28 / 0.74);
        color: rgb(236 232 239 / 0.9);
        font: 600 14px/1.6 var(--voice);
        text-align: left;
      }
      .vl time {
        font: 12px var(--mono);
        color: rgb(236 232 239 / 0.62);
        margin-right: 7px;
      }
      .vl .lamp {
        vertical-align: -2px;
        margin-right: 4px;
      }
      .vl.you {
        align-self: flex-end;
        background: color-mix(in srgb, var(--accent) 17%, rgb(24 20 28 / 0.74));
        color: var(--ink);
        font: 13.5px/1.6 var(--sans);
      }
      .vl.you::before {
        content: "あなた";
        font-size: 12px;
        font-weight: 700;
        color: var(--accent);
        margin-right: 7px;
      }
      button.vl:hover,
      .today:hover {
        background: rgb(58 48 64 / 0.86);
      }
      .say {
        flex: none;
        margin: 0 22px 0 14px;
        padding: 9px 16px 11px;
        border-radius: 16px;
        background: rgb(46 34 44 / 0.93);
        backdrop-filter: blur(8px);
        box-shadow: 0 10px 26px rgb(0 0 0 / 0.42);
        color: #f6f1f4;
        font: 600 16.5px/1.75 var(--voice);
      }
      .say .tail {
        position: absolute;
        left: 36%;
        bottom: -12px;
        width: 28px;
        height: 28px;
        border-radius: 4px;
        background: rgb(46 34 44);
        transform: rotate(45deg);
      }
      .say .who {
        display: flex;
        gap: 8px;
        align-items: baseline;
        font: 700 13px var(--sans);
        color: var(--accent);
      }
      .say .who span {
        font-weight: 400;
        color: rgb(236 232 239 / 0.62);
      }
      .say .hands {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 8px;
        margin-top: 8px;
        padding-top: 7px;
        border-top: 1px solid rgb(236 232 239 / 0.14);
        font: 13px/1.55 var(--sans);
        color: rgb(236 232 239 / 0.76);
      }
      .say .hands b {
        font-weight: 700;
        color: rgb(236 232 239 / 0.6);
      }
      .stage .seat {
        flex: none;
        height: calc(var(--portrait-h) - 30px);
      }
      .aizuchi {
        position: absolute;
        top: 12px;
        right: 16px;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 6px;
        max-width: 62%;
      }
      .aizuchi button {
        border: 0;
        border-radius: 999px;
        padding: 4px 15px;
        background: rgb(24 20 28 / 0.78);
        backdrop-filter: blur(6px);
        box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 72%, transparent);
        color: var(--ink);
        font-size: 13.5px;
      }
      .aizuchi button:hover {
        background: color-mix(in srgb, var(--accent) 26%, rgb(24 20 28));
      }
      .ph.flash {
        outline: 2px solid var(--accent-ink);
        outline-offset: 6px;
        border-radius: 8px;
      }
      .n-voice {
        display: none;
      }

      /* 紙の骨組み。本文の列（1行 40 字まで）と欄外の列を持つ。 */
      .desk {
        overflow: auto;
        padding: 22px 28px 130px 8px;
        scroll-behavior: smooth;
      }
      .paper {
        max-width: 1010px;
        margin: 0 auto;
        background: var(--sheet);
        border-radius: 18px;
        padding: 28px 44px 44px;
        display: grid;
        grid-template-columns: minmax(0, 41em) minmax(0, 1fr);
        column-gap: 40px;
        align-content: start;
      }
      .paper.note {
        max-width: 700px;
        grid-template-columns: minmax(0, 1fr);
      }
      .paper > * {
        grid-column: 1;
        min-width: 0;
      }
      .paper > .wide {
        grid-column: 1 / -1;
      }
      .pair {
        grid-column: 1 / -1;
        display: grid;
        grid-template-columns: subgrid;
        align-items: start;
      }
      .pair > :first-child {
        min-width: 0;
      }
      .mg {
        grid-column: 2;
        font-size: 13.5px;
        line-height: 1.65;
        color: var(--ink-quiet);
        padding-top: 4px;
      }
      .mg p {
        margin: 0 0 8px;
      }
      .mg b.n {
        font: 700 12px var(--mono);
        color: var(--accent-ink);
        margin-right: 5px;
      }
      .mg ul {
        margin: 0;
        padding-left: 1.1em;
      }
      .mg.voice {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 9px;
        align-items: start;
        align-self: end;
        padding-bottom: 8px;
      }
      .mg.voice img {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        object-fit: cover;
        object-position: 50% 20%;
        box-shadow: 0 0 0 1.5px var(--accent-ink);
      }
      .mg.voice p {
        margin: 0;
        padding: 5px 11px;
        border-radius: 4px 12px 12px 12px;
        background: var(--raise);
        color: var(--ink);
        font: 600 14px/1.6 var(--voice);
      }
      .mg .mg-n {
        font-weight: 700;
        color: var(--ink-soft);
        margin-bottom: 2px;
      }

      /* 紙の頭 */
      .p-top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .ask {
        font-size: 13px;
        color: var(--ink-quiet);
        flex: 1;
      }
      .p-tools {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .seg {
        display: inline-flex;
        background: var(--raise);
        border-radius: 9px;
        padding: 2px;
      }
      .seg button,
      .tool {
        border: 0;
        background: none;
        border-radius: 7px;
        padding: 2px 12px;
        font-size: 13.5px;
        color: var(--ink-soft);
      }
      .seg button[aria-pressed="true"] {
        background: var(--float);
        color: var(--ink);
        font-weight: 700;
      }
      .tool {
        background: var(--raise);
      }
      .stamp {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 18px;
        font-size: 13px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
      }
      .vd {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border-radius: 7px;
        padding: 1px 12px 1px 8px;
        font-weight: 700;
        font-size: 13.5px;
        color: var(--c);
        background: color-mix(in srgb, var(--c) 14%, transparent);
      }
      .vd i {
        font-style: normal;
      }
      .vd-ok {
        --c: var(--ok);
      }
      .vd-part,
      .vd-wait {
        --c: var(--warn);
      }
      .vd-you,
      .vd-run {
        --c: var(--accent-ink);
      }
      .vd-ng {
        --c: var(--ng);
      }
      .vd-stop {
        --c: var(--ink-soft);
      }
      .add,
      .g-ok {
        color: var(--ok);
      }
      .del,
      .g-ng {
        color: var(--ng);
      }
      .g-un {
        color: var(--ink-quiet);
      }
      .lamps {
        display: inline-flex;
        align-items: flex-end;
        gap: 1px;
      }
      .lamp {
        flex: none;
      }
      .lamp-lit {
        color: color-mix(in srgb, var(--accent-ink) 72%, transparent);
      }
      .lamp-now {
        color: var(--accent-ink);
        filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 60%, transparent));
      }
      .lamp-none,
      .lamp-skip {
        color: var(--ink-quiet);
      }
      .lamp-x {
        display: inline-grid;
        place-items: center;
        width: var(--z);
        height: var(--z);
        color: var(--ng);
        font-weight: 800;
        font-size: 13px;
      }
      h1.concl {
        font-size: 24px;
        line-height: 1.55;
        margin: 12px 0 6px;
        text-wrap: balance;
        word-break: auto-phrase;
        letter-spacing: 0.01em;
      }
      h1.concl.mid {
        font-size: 20px;
      }
      .sub {
        color: var(--ink-soft);
        margin-bottom: 20px;
        text-wrap: pretty;
      }
      h2 {
        font-size: 19px;
        line-height: 1.5;
        margin: 38px 0 10px;
        word-break: auto-phrase;
        text-wrap: balance;
      }
      h3 {
        font-size: 16px;
        margin: 22px 0 4px;
      }
      .prose p,
      p.body {
        margin: 0 0 14px;
        text-wrap: pretty;
      }
      .quiet {
        font-size: 13.5px;
        color: var(--ink-quiet);
      }
      sup.ref {
        font: 700 12px var(--mono);
        color: var(--accent-ink);
        margin-left: 2px;
      }

      /* あなたの番 */
      .turn {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin: 4px 0 6px;
      }
      .turn section {
        background: var(--raise);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .turn h3 {
        margin: 0 0 4px;
        font-size: 13.5px;
        color: var(--ink-quiet);
        font-weight: 700;
      }
      .turn .mine {
        box-shadow: inset 3px 0 0 var(--accent-ink);
      }
      .turn .mine h3 {
        color: var(--accent-ink);
      }
      .btn {
        display: inline-block;
        margin-top: 8px;
        border: 0;
        border-radius: 8px;
        padding: 3px 14px;
        background: var(--accent);
        color: #1b1418;
        font-size: 13.5px;
        font-weight: 700;
      }
      .btn.ghost {
        background: var(--raise);
        color: var(--ink);
      }
      .chip {
        border: 0;
        border-radius: 999px;
        padding: 2px 13px;
        margin: 4px 6px 0 0;
        background: var(--float);
        font-size: 13.5px;
      }

      /* 主要な数 */
      .kf {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 44px;
        margin: 26px 0 4px;
      }
      .kf > div {
        min-width: 150px;
      }
      .kf .v {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.25;
      }
      .kf .v small {
        font-size: 15px;
        font-weight: 500;
        color: var(--ink-soft);
        margin-left: 3px;
      }
      .kf .l {
        font-size: 13px;
        color: var(--ink-soft);
        line-height: 1.5;
      }
      .kf .d {
        font-size: 13.5px;
        color: var(--ink-quiet);
        font-variant-numeric: tabular-nums;
      }
      .meter {
        height: 6px;
        border-radius: 3px;
        background: color-mix(in srgb, var(--data) 24%, transparent);
        margin: 6px 0 2px;
        overflow: hidden;
      }
      .meter i {
        display: block;
        height: 100%;
        border-radius: 3px;
        background: var(--data);
      }

      /* 確かさの台帳 */
      .ledger {
        display: grid;
        gap: 1px;
      }
      .lg-label {
        font-size: 13.5px;
        color: var(--ink-quiet);
        margin: 10px 0 0 10px;
      }
      .lg summary {
        list-style: none;
        display: grid;
        grid-template-columns: 20px minmax(0, 1fr) auto auto;
        gap: 10px;
        align-items: baseline;
        padding: 6px 10px;
        border-radius: 9px;
        cursor: pointer;
      }
      .lg summary::-webkit-details-marker {
        display: none;
      }
      .lg summary:hover {
        background: var(--raise);
      }
      .lg .g {
        font-weight: 800;
        text-align: center;
      }
      .lg-ok .g {
        color: var(--ok);
      }
      .lg-ng .g {
        color: var(--ng);
      }
      .lg-un .g {
        color: var(--ink-quiet);
        border: 1.5px dashed var(--ink-quiet);
        border-radius: 50%;
        width: 19px;
        height: 19px;
        line-height: 16px;
        font-size: 13px;
      }
      .lg .cmd {
        color: var(--ink-quiet);
        font-size: 13.5px;
      }
      .seal {
        font-size: 12.5px;
        border-radius: 5px;
        padding: 0 7px;
        color: var(--ink-quiet);
        box-shadow: inset 0 0 0 1px var(--rule);
      }
      .seal.seen {
        color: var(--ok);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ok) 50%, transparent);
      }
      .lg-body {
        margin: 0 10px 10px 40px;
        font-size: 14px;
        color: var(--ink-soft);
      }
      pre {
        margin: 6px 0 0;
        padding: 10px 12px;
        background: var(--raise);
        border-radius: 8px;
        font: 13.5px/1.65 var(--mono);
        color: var(--ink-soft);
        overflow: auto;
      }

      /* 計画（狐火が灯る） */
      .plan {
        list-style: none;
        margin: 8px 0 0;
        padding: 0;
      }
      .ph {
        display: grid;
        grid-template-columns: 26px minmax(0, 1fr);
        column-gap: 10px;
        position: relative;
        padding-bottom: 16px;
      }
      .ph > .lamp,
      .ph > .lamp-x {
        justify-self: center;
        margin-top: 5px;
      }
      .ph::before {
        content: "";
        position: absolute;
        left: 12px;
        top: 30px;
        bottom: 0;
        width: 1.5px;
        background: var(--rule);
      }
      .ph:last-child::before {
        display: none;
      }
      .ph-head {
        display: flex;
        gap: 10px;
        align-items: baseline;
      }
      .ph-t {
        font-weight: 500;
        color: var(--ink-soft);
      }
      .ph-now > .ph-main > .ph-head .ph-t,
      .ph-fail > .ph-main > .ph-head .ph-t {
        font-weight: 700;
        color: var(--ink);
      }
      .ph-none > .ph-main > .ph-head .ph-t,
      .ph-skip > .ph-main > .ph-head .ph-t {
        color: var(--ink-quiet);
      }
      .ph-time {
        margin-left: auto;
        font: 13.5px var(--mono);
        color: var(--ink-quiet);
        white-space: nowrap;
      }
      .ph-note {
        font-size: 14px;
        color: var(--ink-soft);
      }
      .dchip {
        font: 13px var(--mono);
        color: var(--ink-quiet);
        white-space: nowrap;
      }
      .tag {
        font-size: 12.5px;
        font-weight: 700;
        border-radius: 5px;
        padding: 0 7px;
        color: var(--c, var(--ink-soft));
        background: color-mix(in srgb, var(--c, var(--ink-soft)) 15%, transparent);
        white-space: nowrap;
      }
      .tag.you {
        --c: var(--accent-ink);
      }
      .tag.ng {
        --c: var(--ng);
      }
      .tag.warn {
        --c: var(--warn);
      }
      .live {
        margin-top: 8px;
        background: var(--raise);
        border-radius: 10px;
        padding: 10px 14px;
        font-size: 14.5px;
      }
      .act {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr) auto;
        gap: 10px;
        align-items: baseline;
        padding: 2px 0;
      }
      .act .k {
        font-size: 12.5px;
        font-weight: 700;
        color: var(--ink-quiet);
      }
      .act .when {
        font: 13px var(--mono);
        color: var(--ink-quiet);
      }
      .act.said .k {
        color: var(--accent-ink);
      }
      .act.kept .k {
        color: var(--ok);
      }
      .act.gone {
        color: var(--ink-quiet);
        font-size: 13px;
      }
      .note-line {
        font-size: 13.5px;
        border-radius: 8px;
        padding: 5px 12px;
        margin-top: 6px;
        color: var(--ink-soft);
        background: color-mix(in srgb, var(--c, var(--warn)) 11%, transparent);
      }
      .note-line b {
        color: var(--c, var(--warn));
        margin-right: 4px;
      }
      .par {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 6px;
      }
      .par > div,
      .lap {
        background: var(--raise);
        border-radius: 9px;
        padding: 7px 12px;
        font-size: 13.5px;
      }
      .lap {
        display: grid;
        grid-template-columns: 62px minmax(0, 1fr) auto;
        gap: 10px;
        margin-top: 4px;
        align-items: baseline;
      }
      .lap .w {
        font-weight: 700;
      }
      .lap.now {
        box-shadow: inset 3px 0 0 var(--accent-ink);
      }
      .fold-done {
        font-size: 14px;
        color: var(--ink-soft);
        cursor: pointer;
      }
      .route {
        margin-top: 34px;
        border-top: 1px solid var(--rule);
        padding-top: 12px;
      }
      .route > summary {
        cursor: pointer;
        color: var(--ink-soft);
        font-size: 14px;
      }
      .foot-tools {
        margin-top: 20px;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* 戻る・差分・選ぶ */
      .away section {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr);
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--rule);
      }
      .away h3 {
        margin: 0;
        font-size: 13px;
        color: var(--ink-quiet);
      }
      .away ul,
      .delta ul,
      .ul {
        margin: 0;
        padding-left: 1.15em;
      }
      .read-mark {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 13.5px;
        color: var(--accent-ink);
        margin: 24px 0 6px;
      }
      .read-mark::before,
      .read-mark::after {
        content: "";
        flex: 1;
        height: 1px;
        background: color-mix(in srgb, var(--accent-ink) 50%, transparent);
      }
      .delta {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin: 2px 0 12px;
      }
      .delta section {
        border-radius: 12px;
        background: var(--raise);
        padding: 12px 14px;
        font-size: 14px;
      }
      .delta h3 {
        margin: 0 0 4px;
        font-size: 13.5px;
      }
      .opt {
        display: grid;
        grid-template-columns: 74px minmax(0, 1fr) auto;
        gap: 14px;
        align-items: start;
        padding: 12px 14px;
        border-radius: 12px;
        margin-top: 6px;
      }
      .opt.adopt {
        background: var(--raise);
      }
      .opt .v {
        font-size: 13px;
        font-weight: 700;
        color: var(--ink-quiet);
        padding-top: 3px;
      }
      .opt.adopt .v {
        color: var(--ok);
      }
      .opt b {
        display: block;
      }
      .opt p {
        font-size: 14px;
        color: var(--ink-soft);
      }
      .opt.reject b,
      .opt.reject p {
        color: var(--ink-quiet);
      }
      .opt[data-picked="true"] {
        box-shadow: inset 0 0 0 2px var(--accent-ink);
      }

      /* 図の共通の形: 題（主張）・本体・脚（出どころ） */
      .fig {
        margin: 18px 0 8px;
      }
      .fig-t {
        font-weight: 700;
        font-size: 15.5px;
        line-height: 1.6;
        margin-bottom: 10px;
        text-wrap: balance;
        word-break: auto-phrase;
      }
      .fig-f {
        font-size: 13px;
        color: var(--ink-quiet);
        margin-top: 8px;
      }
      .spec {
        padding: 6px 0 22px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 8px;
      }
      .spec:last-of-type {
        border-bottom: 0;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 14.5px;
        font-variant-numeric: tabular-nums;
      }
      th {
        font-size: 13.5px;
        font-weight: 600;
        color: var(--ink-quiet);
        text-align: left;
        padding: 4px 10px 6px;
        border-bottom: 1px solid var(--rule);
        white-space: nowrap;
      }
      th button {
        border: 0;
        background: none;
        padding: 0;
        font-weight: inherit;
        color: inherit;
      }
      th[aria-sort] button {
        color: var(--ink);
      }
      td {
        padding: 7px 10px;
        border-bottom: 1px solid var(--rule);
      }
      tr:last-child td {
        border-bottom: 0;
      }
      .r {
        text-align: right;
      }
      tr.em td {
        font-weight: 700;
      }
      tr.total td {
        border-top: 1.5px solid var(--ink-quiet);
        color: var(--ink-soft);
      }
      tbody tr:hover td {
        background: var(--raise);
      }
      .cellbar {
        display: inline-block;
        height: 8px;
        border-radius: 0 3px 3px 0;
        background: var(--data-mute);
        vertical-align: middle;
        margin-right: 8px;
      }
      tr.em .cellbar {
        background: var(--data);
      }
      .st {
        white-space: nowrap;
      }
      .st i {
        font-style: normal;
        font-weight: 800;
        margin-right: 4px;
      }
      .st.ok i {
        color: var(--ok);
      }
      .st.warn i {
        color: var(--warn);
      }
      .st.ng i {
        color: var(--ng);
      }
      .st.na {
        color: var(--ink-quiet);
      }
      .hbar {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        row-gap: 7px;
        column-gap: 12px;
        font-size: 13.5px;
        align-items: center;
      }
      .hbar .lbl {
        color: var(--ink-soft);
        text-align: right;
      }
      .hbar .bar {
        display: flex;
        align-items: center;
        gap: 8px;
        font-variant-numeric: tabular-nums;
      }
      .hbar .bar i {
        height: 14px;
        border-radius: 0 4px 4px 0;
        background: var(--data-mute);
      }
      .hbar .em i {
        background: var(--data);
      }
      .hbar .em {
        font-weight: 700;
      }
      svg.chart {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .chart text {
        font: 13px var(--sans);
        fill: var(--ink-soft);
      }
      .chart .grid {
        stroke: var(--rule);
        stroke-width: 1;
      }
      .chart .ln {
        fill: none;
        stroke-width: 2;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .chart .mute {
        stroke: var(--data-mute);
      }
      .chart .main {
        stroke: var(--data);
      }
      .chart .dot {
        fill: var(--data);
        stroke: var(--sheet);
        stroke-width: 2;
      }
      .chart .node {
        fill: none;
        stroke: var(--ink-quiet);
        stroke-width: 1.2;
      }
      .chart .node.new {
        stroke: var(--data);
        stroke-width: 2;
      }
      .chart .edge {
        fill: none;
        stroke: var(--ink-quiet);
        stroke-width: 1.2;
      }
      .chart .nt {
        font-size: 13px;
        fill: var(--ink);
        text-anchor: middle;
      }
      .chart .et {
        font-size: 12px;
        fill: var(--ink-quiet);
      }
      .db {
        display: grid;
        grid-template-columns: 76px minmax(0, 1fr);
        gap: 10px 12px;
        font-size: 13.5px;
        align-items: center;
      }
      .db .track {
        position: relative;
        height: 22px;
      }
      .db .track::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 10.5px;
        height: 1px;
        background: var(--rule);
      }
      .db .seg-l {
        position: absolute;
        top: 9px;
        height: 4px;
        background: color-mix(in srgb, var(--data) 45%, transparent);
      }
      .db .p {
        position: absolute;
        top: 5px;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        border-radius: 50%;
        box-shadow: 0 0 0 2px var(--sheet);
      }
      .db .p.b {
        background: var(--ink-quiet);
      }
      .db .p.a {
        background: var(--data);
      }
      .db .val {
        position: absolute;
        top: -1px;
        font-size: 13.5px;
        font-variant-numeric: tabular-nums;
        transform: translateX(-50%);
        margin-top: -14px;
        color: var(--ink-soft);
      }
      .db .val.a {
        font-weight: 700;
        color: var(--ink);
      }
      .key {
        display: flex;
        gap: 16px;
        font-size: 13px;
        color: var(--ink-quiet);
        margin-top: 8px;
      }
      .key i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        margin-right: 5px;
        vertical-align: -1px;
      }
      .sm {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .sm p {
        font-size: 13px;
        color: var(--ink-soft);
      }
      .sm b {
        color: var(--ink);
      }

      /* 見比べ */
      .modes {
        display: flex;
        gap: 6px;
        align-items: center;
        margin-bottom: 8px;
        font-size: 13.5px;
      }
      .cmp {
        --p: 50%;
        position: relative;
      }
      .cmp[data-mode="side"] {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .cmp figure {
        margin: 0;
        font-size: 13.5px;
        color: var(--ink-quiet);
      }
      .cmp:not([data-mode="side"]) figure + figure {
        position: absolute;
        inset: 0;
      }
      .cmp:not([data-mode="side"]) figcaption {
        display: none;
      }
      .cmp[data-mode="swipe"] figure + figure {
        clip-path: inset(0 0 0 var(--p));
      }
      .cmp[data-mode="swipe"]::after {
        content: "";
        position: absolute;
        top: 0;
        bottom: 0;
        left: var(--p);
        width: 2px;
        background: var(--accent-ink);
      }
      .cmp[data-mode="onion"] figure + figure {
        opacity: var(--p-o, 0.5);
      }
      .shot {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 8px;
      }
      .shot .s-bg {
        fill: var(--night);
      }
      .shot .s-p {
        fill: #2c2836;
      }
      .shot .s-bar {
        fill: #3a3546;
      }
      .shot .s-main {
        fill: #ece8ef;
        opacity: 0.9;
      }
      .shot .s-ch {
        fill: var(--accent);
        opacity: 0.75;
      }
      .shot .s-t {
        fill: #1f1c27;
        font: 600 12px var(--sans);
        text-anchor: middle;
      }
      input[type="range"] {
        accent-color: var(--accent-ink);
      }
      .diff {
        font: 13.5px/1.75 var(--mono);
        background: var(--raise);
        border-radius: 10px;
        overflow: hidden;
      }
      .diff-h {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 12px;
        color: var(--ink-quiet);
        border-bottom: 1px solid var(--rule);
      }
      .diff .l {
        display: grid;
        grid-template-columns: 34px 34px 16px minmax(0, 1fr);
        padding: 0 12px 0 0;
        white-space: pre;
      }
      .diff .n {
        text-align: right;
        color: var(--ink-quiet);
        opacity: 0.7;
        padding-right: 8px;
      }
      .diff .l.a {
        background: color-mix(in srgb, var(--ok) 12%, transparent);
      }
      .diff .l.d {
        background: color-mix(in srgb, var(--ng) 12%, transparent);
      }
      .diff mark {
        color: inherit;
        border-radius: 3px;
      }
      .diff .l.a mark {
        background: color-mix(in srgb, var(--ok) 34%, transparent);
      }
      .diff .l.d mark {
        background: color-mix(in srgb, var(--ng) 34%, transparent);
      }
      .diff .l.mk {
        box-shadow: inset 3px 0 0 var(--data);
      }
      .vs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        font-size: 14.5px;
      }
      .vs h4 {
        margin: 0 0 4px;
        font-size: 14.5px;
      }

      /* 時間の図・手順 */
      .tl {
        font-size: 13px;
      }
      .tl-row {
        display: grid;
        grid-template-columns: 118px minmax(0, 1fr);
        align-items: center;
        height: 26px;
      }
      .tl-row.child .tl-name {
        padding-left: 14px;
        color: var(--ink-quiet);
      }
      .tl-track {
        position: relative;
        height: 100%;
        border-left: 1px solid var(--rule);
      }
      .tl-bar {
        position: absolute;
        top: 7px;
        height: 12px;
        border-radius: 3px;
        background: var(--data-mute);
      }
      .tl-bar.em {
        background: var(--data);
      }
      .tl-bar.wait {
        background: none;
        box-shadow: inset 0 0 0 1.5px var(--warn);
        border-radius: 3px;
      }
      .tl-ev {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 1px;
        background: var(--accent-ink);
      }
      .tl-axis {
        position: relative;
        height: 20px;
        margin-left: 118px;
        color: var(--ink-quiet);
        font: 12.5px var(--mono);
      }
      .tl-axis span {
        position: absolute;
        transform: translateX(-50%);
        white-space: nowrap;
      }
      .tl-axis span:first-child {
        transform: none;
      }
      .tl-axis span:last-child {
        left: auto;
        right: 0;
        transform: none;
      }
      .steps {
        display: flex;
        flex-wrap: wrap;
        align-items: stretch;
        gap: 6px;
        font-size: 14px;
      }
      .steps > div {
        background: var(--raise);
        border-radius: 9px;
        padding: 6px 12px;
        max-width: 190px;
      }
      .steps > div small {
        display: block;
        color: var(--ink-quiet);
        font-size: 13px;
      }
      .steps > span {
        align-self: center;
        color: var(--ink-quiet);
      }

      /* 文の部品 */
      .ul.lab li b:first-child {
        margin-right: 6px;
      }
      .chk {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .chk li {
        display: grid;
        grid-template-columns: 22px 1fr;
      }
      .chk .done {
        color: var(--ink-soft);
      }
      .chk i {
        font-style: normal;
        font-weight: 800;
      }
      .chk .done i {
        color: var(--ok);
      }
      dl.dl {
        display: grid;
        grid-template-columns: 9em minmax(0, 1fr);
        gap: 6px 16px;
        margin: 0;
        font-size: 15px;
      }
      dl.dl dt {
        color: var(--ink-quiet);
        font-size: 13.5px;
        padding-top: 2px;
      }
      dl.dl dd {
        margin: 0;
      }
      .caution {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 8px;
        padding: 10px 14px;
        border-radius: 10px;
        background: color-mix(in srgb, var(--c) 10%, transparent);
        box-shadow: inset 3px 0 0 var(--c);
        font-size: 15px;
      }
      .caution i {
        font-style: normal;
        font-weight: 800;
        color: var(--c);
      }
      blockquote {
        margin: 0;
        padding-left: 16px;
        box-shadow: inset 2px 0 0 var(--ink-quiet);
        color: var(--ink-soft);
      }
      blockquote footer {
        font-size: 13.5px;
        color: var(--ink-quiet);
      }
      .scale > * {
        margin: 0 0 6px;
      }

      /* 証拠の部品 */
      .trace {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .trace li {
        display: grid;
        grid-template-columns: 22px 1fr;
        column-gap: 8px;
        padding: 5px 0;
      }
      .trace i {
        font-style: normal;
        font-weight: 800;
      }
      .trace .ng i {
        color: var(--ng);
      }
      .trace .ok i {
        color: var(--ok);
      }
      .trace small {
        display: block;
        color: var(--ink-quiet);
        font-size: 13px;
      }
      .pins {
        position: relative;
      }
      .pin {
        position: absolute;
        width: 22px;
        height: 22px;
        margin: -12px 0 0 -12px;
        border-radius: 50%;
        background: var(--accent);
        color: #1b1418;
        font: 700 12px/22px var(--mono);
        text-align: center;
        box-shadow: 0 0 0 2px var(--sheet);
      }
      .thread {
        background: var(--float);
        border-radius: 10px;
        padding: 8px 12px;
        color: var(--ink-soft);
      }
      .thread b {
        color: var(--accent-ink);
      }
      mark.sel {
        background: color-mix(in srgb, var(--accent) 28%, transparent);
        color: inherit;
        border-radius: 3px;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 10px;
      }
      .tabs button {
        border: 0;
        background: none;
        padding: 4px 12px;
        font-size: 14px;
        color: var(--ink-quiet);
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .tabs button[aria-selected="true"] {
        color: var(--ink);
        font-weight: 700;
        border-bottom-color: var(--accent-ink);
      }
      .pv {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 6px 20px;
        align-items: center;
      }
      .pv-axis {
        grid-column: 1 / -1;
        height: 34px;
        position: relative;
        border-bottom: 1.5px solid var(--ink-quiet);
      }
      .pv-axis i {
        position: absolute;
        bottom: 0;
        width: 1.5px;
        height: 9px;
        background: var(--ink-soft);
      }
      .pv-axis i.hit {
        background: var(--ng);
        height: 15px;
      }

      /* 入力欄と経過の札 */
      .dock {
        position: fixed;
        right: 28px;
        bottom: 20px;
        left: calc(var(--stage-w) + 8px);
        display: flex;
        justify-content: center;
        pointer-events: none;
        z-index: 5;
      }
      .dock::before {
        content: "";
        position: absolute;
        z-index: -1;
        inset: -36px -28px -20px -8px;
        background: linear-gradient(180deg, transparent, var(--night) 36px);
      }
      .dock-in {
        pointer-events: auto;
        width: min(1010px, 100%);
        background: var(--float);
        border-radius: 14px;
        padding: 10px 12px 10px 18px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.35);
        font-size: 14px;
        color: var(--ink-soft);
      }
      .dock-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .dock-row .grow {
        flex: 1;
        color: var(--ink-quiet);
      }
      .dock-row .mono {
        color: var(--ink);
      }
      .dock .q {
        padding: 4px 0 10px;
        border-bottom: 1px solid var(--rule);
        margin-bottom: 8px;
        color: var(--ink);
      }
      .dock .q p {
        font-size: 15px;
        font-weight: 700;
      }
      .dock .q small {
        display: block;
        color: var(--ink-quiet);
        font-size: 13.5px;
      }
      .pickrow {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .pickrow button {
        border: 0;
        border-radius: 9px;
        padding: 4px 14px;
        background: var(--raise);
        font-size: 14px;
      }
      .pickrow button[aria-pressed="true"] {
        background: var(--accent);
        color: #1b1418;
        font-weight: 700;
      }

      /* 試作の切り替えの帯（評価の対象ではない） */
      .proto-bar {
        position: fixed;
        left: 12px;
        bottom: 12px;
        max-width: calc(var(--stage-w) - 24px);
        z-index: 50;
        background: #f6f3e8;
        color: #1b1a17;
        border-radius: 14px;
        padding: 6px;
        font: 13px/1 var(--sans);
        box-shadow: 0 4px 18px rgb(0 0 0 / 0.45);
      }
      .proto-bar div {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
      }
      .proto-bar div + div {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px solid rgb(0 0 0 / 0.12);
      }
      .proto-bar button {
        border: 0;
        background: none;
        color: inherit;
        border-radius: 999px;
        padding: 6px 9px;
      }
      .proto-bar button[aria-pressed="true"] {
        background: #1b1a17;
        color: #f6f3e8;
      }
      .proto-bar[data-open="0"] div {
        display: none;
      }
      .proto-bar[data-open="1"] .pb-sum {
        margin-top: 4px;
      }
      body[data-bar="0"] .proto-bar {
        display: none;
      }

      @media (max-width: 900px) {
        .paper {
          grid-template-columns: minmax(0, 1fr);
          padding: 22px 22px 32px;
        }
        .mg {
          grid-column: 1;
          padding: 2px 0 0 12px;
          box-shadow: inset 2px 0 0 var(--rule);
          margin-bottom: 10px;
        }
      }
      @media (max-width: 760px) {
        .room {
          grid-template-columns: 1fr;
        }
        .stage {
          display: none;
        }
        .desk {
          padding: 10px 8px 130px;
        }
        .turn,
        .delta,
        .vs,
        .sm,
        .par {
          grid-template-columns: 1fr;
        }
        .away section {
          grid-template-columns: 1fr;
          gap: 2px;
        }
        .dock {
          left: 8px;
          right: 8px;
          flex-direction: column;
          gap: 6px;
        }
        .n-voice {
          pointer-events: auto;
          display: grid;
          grid-template-columns: 44px minmax(0, 1fr);
          gap: 10px;
          align-items: end;
        }
        .n-voice img {
          width: 44px;
          height: 44px;
          border-radius: 50%;
          object-fit: cover;
          object-position: 50% 20%;
          box-shadow: 0 0 0 2px var(--accent);
        }
        .n-voice p {
          padding: 7px 13px;
          border-radius: 14px 14px 14px 4px;
          background: rgb(46 34 44 / 0.95);
          color: #f6f1f4;
          font: 600 14.5px/1.65 var(--voice);
          box-shadow: 0 8px 20px rgb(0 0 0 / 0.4);
        }
        .n-voice small {
          display: block;
          font: 13px/1.5 var(--sans);
          color: rgb(236 232 239 / 0.72);
        }
        .proto-bar {
          left: 8px;
          right: 8px;
          bottom: auto;
          top: 8px;
          max-width: none;
        }
        .p-top {
          flex-wrap: wrap;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .desk {
          scroll-behavior: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="room">
      <aside class="stage" id="stage">
        <div class="st-top" id="st-top"></div>
        <div class="talk-wrap"><button type="button" class="more" id="more">▴ これまでのやり取り</button><div class="talk" id="thread" aria-label="この依頼でのやり取り"></div></div>
        <div class="say" id="now" aria-live="polite"></div>
        <div class="seat"><div class="aizuchi" id="aizuchi"></div></div>
        <img class="portrait" id="portrait" alt="" />
      </aside>
      <main class="desk" id="desk"></main>
    </div>
    <div class="dock" id="dock"></div>
    <nav class="proto-bar" aria-label="試作の切り替え" id="bar"></nav>

    <script>
      const ROOT = "../../../../characters/"
      const PACKS = {
        karakasa: { dir: ROOT + "local/karakasa", name: "唐傘", accent: "#ff9e9e" },
        tsukumo: { dir: ROOT + "tsukumo", name: "つくも", accent: "#6fe3cd" },
      }
      const params = new URLSearchParams(location.search)
      const state = {
        group: params.get("group") ?? "paper",
        moment: params.get("moment") ?? "",
        tone: params.get("tone") ?? "night",
        depth: Number(params.get("depth") ?? 2),
        pack: "karakasa",
        sort: { key: "sec", dir: -1 },
        cmp: "side",
        ticks: 24,
        choice: "",
        pick: "",
        tab: "a",
        react: undefined,
        barOpen: false,
      }
      document.body.dataset.bar = params.get("bar") ?? "1"
      const pack = () => PACKS[state.pack]
      const TASK = "グラフの目盛りの数を設定で変えられるようにして"

      // ---- 小さな部品 -------------------------------------------------
      const FLAME =
        "M12 2.5c1.6 3.7 5.5 5.6 5.5 10.6a5.5 5.5 0 0 1-11 0c0-2.7 1.4-4.2 2.6-5.6.2 1.4 1 2.3 2 2.6-.4-2.8.3-5.3.9-7.6z"
      function lamp(kind, size = 18) {
        if (kind === "fail") return `<span class="lamp-x" style="--z:${size}px" aria-hidden="true">✕</span>`
        const hollow = kind === "none" || kind === "skip"
        const body = hollow
          ? `<path d="${FLAME}" fill="none" stroke="currentColor" stroke-width="1.3" ${kind === "skip" ? 'stroke-dasharray="2 2.4"' : ""}/>`
          : `<path d="${FLAME}" fill="currentColor"/>${kind === "now" ? '<path d="M12 11c.9 1.6 2.3 2.4 2.3 4.2a2.3 2.3 0 0 1-4.6 0c0-1.3.9-2.4 2.3-4.2z" fill="var(--sheet)" opacity=".85"/>' : ""}`
        return `<svg class="lamp lamp-${kind}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${body}</svg>`
      }
      function lamps(kinds, label) {
        return `<span class="lamps" role="img" aria-label="${label}">${kinds.map((k) => lamp(k, k === "now" ? 20 : 15)).join("")}</span>`
      }
      const rep = (kind, n) => Array.from({ length: n }, () => kind)
      const VD = {
        ok: ["✓", "済んだ"],
        part: ["◐", "一部済んだ"],
        you: ["●", "あなたの番"],
        run: ["◌", "働いている"],
        stop: ["■", "止めた"],
        ng: ["✕", "失敗で止まった"],
        wait: ["…", "待っている"],
      }
      const vd = (k, label) => `<span class="vd vd-${k}"><i aria-hidden="true">${VD[k][0]}</i>${label ?? VD[k][1]}</span>`
      function ph(o) {
        const size = o.k === "now" ? 22 : 18
        return `<li class="ph ph-${o.k}" ${o.id === undefined ? "" : `data-phid="${o.id}"`}>${lamp(o.k, size)}<div class="ph-main"><div class="ph-head"><span class="ph-t">${o.t}</span>${o.tag ?? ""}<span class="ph-time">${o.time ?? ""}</span></div>${o.note ? `<p class="ph-note">${o.note}${o.diff ? ` <span class="dchip">${o.diff}</span>` : ""}</p>` : ""}${o.body ?? ""}</div></li>`
      }
      function lg(k, text, cmd, seal, body, open) {
        const g = { ok: "✓", ng: "✕", un: "?" }[k]
        return `<details class="lg lg-${k}" ${open ? "open" : ""}><summary><span class="g">${g}</span><span>${text}</span>${seal ? `<span class="seal ${seal === "記録あり" ? "seen" : ""}">${seal}</span>` : "<span></span>"}<code class="cmd">${cmd}</code></summary>${body ? `<div class="lg-body">${body}</div>` : ""}</details>`
      }
      const fig = (title, body, foot) =>
        `<figure class="fig"><figcaption class="fig-t">${title}</figcaption>${body}${foot ? `<p class="fig-f">${foot}</p>` : ""}</figure>`
      const spec = (name, body, rules) =>
        `<div class="pair spec"><div>${body}</div><aside class="mg"><p class="mg-n">${name}</p><ul>${rules.map((r) => `<li>${r}</li>`).join("")}</ul></aside></div>`
      // 案内の付箋: キャラクターが紙の欄外から、見てほしい所を一言で指す。1枚に3つまで。
      const guide = (text) =>
        `<aside class="mg voice"><img src="${pack().dir}/face.png" alt="" /><p>${text}</p></aside>`
      const src = (items) =>
        `<aside class="mg" aria-label="出どころ">${items.map(([n, t]) => `<p><b class="n">${n}</b>${t}</p>`).join("")}</aside>`
      function paperTop(ask, withDepth) {
        const seg = withDepth
          ? `<div class="seg" role="group" aria-label="読む深さ">${[
              [1, "一目"],
              [2, "本文"],
              [3, "記録"],
            ]
              .map(([n, l]) => `<button type="button" data-depth="${n}" aria-pressed="${state.depth === n}">${l}</button>`)
              .join("")}</div><button type="button" class="tool" data-copy="この紙の Markdown（架空）">写す</button>`
          : ""
        return `<div class="p-top wide"><p class="ask">${ask}</p><div class="p-tools">${seg}</div></div>`
      }
      const shot = (after) =>
        after
          ? `<svg viewBox="0 0 320 200" class="shot" role="img" aria-label="後の配置"><rect width="320" height="200" rx="8" class="s-bg"/><rect width="84" height="200" rx="8" class="s-ch"/><rect x="92" y="8" width="220" height="184" rx="6" class="s-main"/><rect x="104" y="168" width="196" height="16" rx="6" class="s-bar"/><text x="202" y="92" class="s-t">後の配置</text></svg>`
          : `<svg viewBox="0 0 320 200" class="shot" role="img" aria-label="前の配置"><rect width="320" height="200" rx="8" class="s-bg"/><rect width="320" height="14" class="s-bar"/><rect x="8" y="22" width="48" height="96" rx="4" class="s-p"/><rect x="60" y="22" width="150" height="96" rx="4" class="s-main"/><rect x="216" y="22" width="96" height="96" rx="4" class="s-p"/><rect x="8" y="126" width="150" height="66" rx="4" class="s-ch"/><rect x="164" y="126" width="148" height="66" rx="4" class="s-p"/><text x="135" y="74" class="s-t">前の配置</text></svg>`

      // ---- 紙 ---------------------------------------------------------
      function ledger(again, full) {
        const failed = again
          ? `<p class="lg-label">落ちた ― 1件</p>${lg("ng", "幅 390 で、目盛りの数字が2か所重なる", "capture-view.ts --size 390x844", "記録あり", "間引きの規則が幅 720 を境にしていて、390 では効いていない。<pre>重なり: x=212 「18」と「20」、x=301 「36」と「38」</pre>", true)}`
          : ""
        const unknown = `<p class="lg-label">確かめていない ― 1件</p>${lg("un", "Safari での目盛りの字の詰まり", "未実行", "", "撮る道具が Chromium だけのため。確かめるなら、Safari で幅 720 の目盛りを見る。", full)}`
        const passed =
          full || again
            ? `<p class="lg-label">確かめた ― 4件</p>${lg("ok", "型の検査・lint・整形", "pnpm run check", "記録あり", "14:02 に走り、終了コード 0。", false)}${lg("ok", "単体テスト <b>3,156 件</b>（足した 4 件を含む）", "pnpm run test", "記録あり", "", false)}${lg("ok", "E2E <b>71 件</b>", "pnpm run test:e2e", "記録あり", "", false)}${lg("ok", "幅 1400 と 720 で目盛りが 24 本に見える", "目で見た", "申告のみ", "走った記録が無い確かめ。画は「変えたところ」に置いた。", false)}`
            : `<p class="lg-label">確かめた ― 4件</p>${lg("ok", "型の検査・lint・単体 <b>3,156</b>・E2E <b>71</b>・画 2枚", "開くと1件ずつ", "記録あり 3 ・ 申告 1", "", false)}`
        return `<div class="ledger wide">${failed}${unknown}${passed}</div>`
      }
      function route(open, again) {
        if (again)
          return `<details class="route wide" ${open ? "open" : ""}><summary>この結論に至った道筋 ― 3段 ・ 9分05秒 ・ 道具 23 回</summary><ol class="plan">
          ${ph({ k: "lit", t: "前のレポートの指摘を読み直す", time: "1分10秒", note: "指摘は 2 件。どちらも幅 720 の話だった。", diff: "変更なし" })}
          ${ph({ k: "lit", t: "間引きの規則を直す", time: "4分35秒", note: "幅 720 より狭いとき、目盛りの本数を半分にした。", diff: "3ファイル +41 −12" })}
          ${ph({ k: "lit", t: "3つの幅で確かめる", time: "3分20秒", note: "幅 390 で2か所の重なりが残ると分かった。" })}
        </ol><p class="quiet">生の記録（道具の呼び出し 23 回）は、段を押すと開く。</p></details>`
        return `<details class="route wide" ${open ? "open" : ""}><summary>この結論に至った道筋 ― 4段 ・ 14分20秒 ・ 道具 41 回</summary><ol class="plan">
          ${ph({ k: "lit", t: "今の形を調べる", time: "1分40秒", note: "目盛りの数は <code>axis.ts</code> の定数 12 から来ていた。", diff: "変更なし" })}
          ${ph({ k: "lit", t: "目盛りを設定から読む", time: "3分02秒", note: "設定に <code>ticks</code> を足し、既定を 12 のまま残した。", diff: "2ファイル +38 −6" })}
          ${ph({ k: "lit", t: "表示の層を直す", time: "5分48秒", note: "途中で円グラフにも目盛りがあると分かり、この段に足した。", diff: "6ファイル +52 −31" })}
          ${ph({ k: "lit", t: "テストと画で確かめる", time: "3分50秒", note: "単体を 4 件足し、幅 1400 と 720 の画を撮った。" })}
        </ol><p class="quiet">生の記録（道具の呼び出し 41 回）は、段を押すと開く。</p></details>`
      }
      function deliver(again) {
        const d = state.depth
        const stamp = again
          ? `${vd("part")}<span>前回から <b>2件解決 ・ 1件新しく</b></span>${lamps(rep("lit", 3), "3段とも済んだ")}<span>3段 ・ 9分05秒</span>`
          : `${vd("ok")}${lamps(rep("lit", 4), "4段とも済んだ")}<span>4段 ・ 14分20秒</span>`
        const head = `${paperTop(`頼んだこと: ${again ? "前のレポートの指摘を直して" : TASK}`, true)}
          <div class="stamp wide">${stamp}<span>${again ? '<b class="add">+41</b> <b class="del">−12</b> ・ 3ファイル' : '<b class="add">+90</b> <b class="del">−37</b> ・ 8ファイル'}</span><span>${again ? '<b class="g-ng">✕1</b> ' : ""}<b class="g-un">?1</b> <b class="g-ok">✓4</b></span></div>
          <h1 class="concl wide">${again ? "幅 720 の重なりは消えた。幅 390 では、まだ2か所重なる。" : "グラフの目盛りの数を、設定の <code>ticks</code> で 4〜48 本に変えられるようになった。"}</h1>
          <p class="sub wide">${again ? "前回の指摘2件は直した。間引きの規則が幅 720 を境にしているため、もっと狭い幅では効いていない。" : "既定は今と同じ 12 本で、設定を変えない人の画面は変わらない。"}</p>
          ${again ? `<div class="delta wide"><section><h3 class="g-ok">✓ 解決 ― 2件</h3><ul><li>幅 720 で数字が重なる</li><li>既定の 12 が設定に出ていない</li></ul></section><section><h3 class="g-ng">✕ 新しく ― 1件</h3><ul><li>幅 390 で2か所重なる</li></ul></section><section><h3 class="g-un">? 残っている ― 1件</h3><ul><li>Safari で見ていない</li></ul></section></div>` : ""}
          <div class="turn wide">
            <section class="mine"><h3>あなたの番</h3><p>${again ? "幅 390 も間引くかを決める。" : "設定の画面で目盛りを 24 にして、見え方を確かめる。"}</p>${again ? '<div class="pickrow"><button type="button">1　間引く</button><button type="button">2　今のまま</button></div>' : '<button class="btn" type="button">設定を開く</button>'}</section>
            <section><h3>続けて頼めること</h3><div><button class="chip" type="button">${again ? "間引きの境を幅に比例させて" : "Safari でも見え方を確かめて"}</button><button class="chip" type="button">設定の画面に説明を足して</button></div><p class="quiet" style="margin-top:6px">押すと入力欄に入る。送るまでは始まらない。</p></section>
          </div>`
        if (d === 1)
          return `<article class="paper tone">${head}<p class="quiet wide" style="margin-top:18px">ここまでが「一目」。確かさ（${again ? "落ちた 1・" : ""}確かめていない 1・確かめた 4）と本文は「本文」で開く。</p></article>`
        return `<article class="paper tone">${head}
          <div class="kf wide">
            <div><p class="v">4〜48<small>本</small></p><p class="l">設定できる目盛りの数</p><p class="d">前は 12 本に固定</p></div>
            <div><p class="v">6<small>/ 6 個</small></p><p class="l">設定を読むグラフの部品</p><div class="meter"><i style="width:100%"></i></div></div>
            <div><p class="v">3,156<small>件</small></p><p class="l">通った単体テスト</p><p class="d">3,152 → 3,156（+4）</p></div>
          </div>
          <div class="pair"><h2>確かさ</h2>${guide(again ? "幅 390 のところだけ、まだ直っていないの。先にここを見てね。" : "ここだけ、まだ見ていないの。Safari のことよ。")}</div>
          ${ledger(again, d === 3)}
          <h2>変えたところ</h2>
          <div class="pair"><div class="prose"><p>目盛りの数は <code>axis.ts</code> の定数から、設定の <code>ticks</code> を読む形に替えた<sup class="ref">1</sup>。範囲の外の値は、設定を読むところで 4 か 48 に丸める<sup class="ref">2</sup>。</p>
            <p>グラフの部品 6 個は、同じ <code>useAxisTicks</code> から数を受け取る。円グラフは目盛りを使わないと思っていたが、外周の目盛りがあったので足した<sup class="ref">3</sup>。</p></div>
            ${src([
              [1, "<code>src/chart/axis.ts:14</code> の <code>DEFAULT_TICKS</code>"],
              [2, "<code>src/setting/parse.ts:88</code>・単体テスト「範囲の外を丸める」"],
              [3, "<code>src/chart/pie-chart.tsx:61</code>"],
            ])}</div>
          <div class="pair">${fig("設定を 24 にすると、目盛りは倍の細かさになる（幅 1400）", `<div class="cmp" data-mode="side"><figure>${shot(false)}<figcaption>前 ― 12 本</figcaption></figure><figure>${shot(true)}<figcaption>後 ― 24 本</figcaption></figure></div>`, "")}${guide("前と後、並べておいたわ。見比べてみて。")}</div>
          <h2>置いた前提</h2>
          <ul class="ul"><li>目盛りの数は 4〜48 の範囲だけ受け付ける。範囲は頼まれていなかったので、今の最小と最大の比から置いた。</li></ul>
          ${route(d === 3, again)}
          <div class="foot-tools wide"><button class="tool" type="button">前のレポートと比べる</button><button class="tool" type="button">HTML で保存</button><span class="quiet" style="align-self:center">キー: <kbd>{</kbd> <kbd>}</kbd> で見出しを移る ・ <kbd>d</kbd> で読む深さ ・ <kbd>o</kbd> で節を畳む</span></div>
        </article>`
      }
      function decide() {
        const opts = [
          ["adopt", "設定ファイル", "起こし直すだけで変わり、読み口が1つで済む。", "勧める ・ 確度 高"],
          ["consider", "環境変数", "設定ファイルの上書きとしてなら足せる。単独では、起こすたびに指定が要る。", "足すなら後で"],
          ["reject", "定数のまま", "変えるたびに組み立て直しが要る。頼まれたことを満たさない。", "勧めない"],
        ]
        return `<article class="paper tone">${paperTop("頼んだこと: 目盛りの数をどこで決めるか、案を比べて", true)}
          <div class="stamp wide">${vd("you")}<span>3案を調べた ・ 6分10秒</span><span>変更なし</span><span><b class="g-un">?1</b> <b class="g-ok">✓3</b></span></div>
          <h1 class="concl wide">目盛りの数は設定ファイルで決めるのを勧める。決めてくれたら、約 10 分で入れられる。</h1>
          <p class="sub wide">${state.pick ? `<b>決めた: ${state.pick}。</b> 入力欄に「${state.pick}で進めて」を入れた。送ると始める。` : "下の3案から選ぶと、入力欄に続きの依頼が入る。"}</p>
          <div class="wide">${opts
            .map(
              ([v, name, why, tag]) =>
                `<div class="opt ${v}" data-picked="${state.pick === name}"><span class="v">${v === "adopt" ? "✓ " : v === "reject" ? "― " : "〜 "}${tag}</span><div><b>${name}</b><p>${why}</p></div><button type="button" class="btn ${v === "adopt" ? "" : "ghost"}" style="margin-top:0" data-pick="${name}">これにする</button></div>`,
            )
            .join("")}</div>
          <h2>比べた点</h2>
          ${fig("設定ファイルだけが、3点とも満たす", `<table><thead><tr><th>案</th><th>組み立て直しが要らない</th><th>読み口が1つ</th><th>今の設定と重ならない</th></tr></thead><tbody>

        const week = [2, 3, 1, count, 0, 0, 0]
        const kindOf = (n) => (n === 0 ? "none" : n >= 4 ? "now" : "lit")
        document.getElementById("st-top").innerHTML = `<div class="rh"><b>tsukumo-3</b><span aria-hidden="true">▾</span><div class="seg" role="group" aria-label="仕事と雑談"><button type="button" aria-pressed="true">仕事</button><button type="button" aria-pressed="false">雑談</button></div></div>
          <div>${m.head ?? "部品の見本帳"}</div>
          <div class="rh-nav"><span>タスク 3</span><span>成果</span><span>キャラ</span><span>設定</span><span>探す <kbd>⌘K</kbd></span></div>
          <button type="button" class="today" aria-label="今日の灯り。押すと成果を開く"><span>今日 <b>${count} つ</b>灯した${plus ? ' <span class="plus">＋1</span>' : ""}</span><span class="wk">${["月", "火", "水", "木", "金", "土", "日"]
            .map((d, i) => `<span class="${i === 3 ? "is-today" : ""}">${lamp(kindOf(week[i]), 11 + Math.min(week[i], 4) * 2)}${d}</span>`)
            .join("")}</span></button>`
        const rows = [...s.thread, ...(r ? [["her", "いま", line], ["you", "いま", r.you]] : [])]
        document.getElementById("more").hidden = rows.length <= 3
        document.getElementById("thread").innerHTML = rows
          .map(([who, time, text, lit, ph]) => {
            const body = `${who === "her" ? `<time>${time}</time>${lit ? lamp("lit", 14) : ""}` : ""}${text}`
            return ph === undefined ? `<p class="vl ${who === "you" ? "you" : ""}">${body}</p>` : `<button type="button" class="vl" data-goto="${ph}" title="紙のこの段へ移る">${body}</button>`
          })
          .join("")
        const hands = s.hands && !r ? `<div class="hands"><b>${s.hands[0]}</b><span>${s.hands[1]}</span></div>` : ""
        document.getElementById("now").innerHTML = `<div class="who">${pack().name}<span>いま</span></div>${said}${hands}<i class="tail" aria-hidden="true"></i>`
        document.getElementById("aizuchi").innerHTML =
          s.chips && !r ? s.chips.map(([label], i) => `<button type="button" data-aizuchi="${i}">${label}</button>`).join("") : ""
        const img = document.getElementById("portrait")
        img.src = `${pack().dir}/${face}.png`
        img.alt = `${pack().name}の立ち絵`
        // 狭い幅では舞台を出さず、顔といまのセリフを入力欄の上に置く。
        return `<div class="n-voice"><img src="${pack().dir}/face.png" alt="" /><p>${said}${s.hands && !r ? `<small>${s.hands[0]}: ${s.hands[1]}</small>` : ""}</p></div>`
      }

      function paintTicks() {
        const passed = (Date.now() - startedAt) / 1000
        for (const el of document.querySelectorAll("[data-tick]")) el.textContent = fmt(Number(el.dataset.tick) + passed)
      }
      function render(keepScroll) {
        const { group, key, m } = view()
        state.moment = key
        const desk = document.getElementById("desk")
        const top = desk.scrollTop
        document.body.dataset.tone = state.tone
        document.body.style.setProperty("--accent", pack().accent)
        document.getElementById("stage").style.setProperty("--scene", `url("${pack().dir}/background.png")`)
        const narrowVoice = renderStage(m)
        desk.innerHTML = m.html()
        desk.scrollTop = keepScroll ? top : 0
        document.getElementById("dock").innerHTML = narrowVoice + (m.dock ?? dockPlain)()
        document.title = `${m.title ?? "見本帳"} ― tsukumo（試作）`
        const bar = document.getElementById("bar")
        bar.dataset.open = state.barOpen ? "1" : "0"
        bar.innerHTML =
          `<div>${Object.entries(GROUPS)
            .map(([k, g]) => `<button type="button" data-group="${k}" aria-pressed="${k === state.group}">${g.label}</button>`)
            .join("")}<button type="button" data-tone-toggle aria-pressed="${state.tone === "day"}">昼</button></div>` +
          `<div>${Object.entries(group.moments)
            .map(([k, each]) => `<button type="button" data-moment="${k}" aria-pressed="${k === key}">${each.label}</button>`)
            .join("")}</div>` +
          `<button type="button" class="pb-sum" data-bar-toggle aria-expanded="${state.barOpen}">${state.barOpen ? "▾ 帯を畳む" : `▴ 場面を替える（${group.label} › ${m.label}）`}</button>`
        const url = new URL(location.href)
        for (const k of ["group", "moment", "tone", "depth"]) url.searchParams.set(k, state[k])
        history.replaceState(null, "", url)
        paintTicks()
      }

      document.addEventListener("click", (event) => {
        const b = event.target.closest("button")
        if (!b) return
        const d = b.dataset
        if (d.group) {
          state.group = d.group
          state.moment = ""
          state.react = undefined
          return render(false)
        }
        if (d.moment) {
          state.moment = d.moment
          state.react = undefined
          return render(false)
        }
        if (d.goto !== undefined) {
          const target = document.querySelector(`[data-phid="${d.goto}"]`)
          if (target) {
            target.scrollIntoView({ block: "center" })
            target.classList.add("flash")
            setTimeout(() => target.classList.remove("flash"), 1600)
          }
          return
        }
        if (d.aizuchi !== undefined) {
          const [you, face, line] = stageOf().chips[Number(d.aizuchi)]
          state.react = { you, face, line }
          return render(true)
        }
        if ("barToggle" in d) {
          state.barOpen = !state.barOpen
          return render(true)
        }
        if ("toneToggle" in d) state.tone = state.tone === "day" ? "night" : "day"
        else if (d.depth) state.depth = Number(d.depth)
        else if (d.sort) state.sort = { key: d.sort, dir: state.sort.key === d.sort ? -state.sort.dir : -1 }
        else if (d.cmp) state.cmp = d.cmp
        else if (d.choice) state.choice = d.choice
        else if (d.pick) state.pick = d.pick
        else if (d.tab) state.tab = d.tab
        else if (d.copy) {
          navigator.clipboard?.writeText(d.copy)
          b.textContent = "写した"
          return
        } else return
        render(true)
      })
      document.addEventListener("input", (event) => {
        const el = event.target
        if ("cmpRange" in el.dataset) {
          const box = el.closest(".fig").querySelector(".cmp")
          box.style.setProperty("--p", `${el.value}%`)
          box.style.setProperty("--p-o", el.value / 100)
        }
        if ("ticks" in el.dataset) {
          state.ticks = Number(el.value)
          document.getElementById("pv-n").textContent = state.ticks
          document.getElementById("pv-k").firstChild.textContent = hits(state.ticks)
          document.getElementById("pv-axis").innerHTML = axisTicks(state.ticks)
        }
      })
      setInterval(paintTicks, 1000)

      const probe = new Image()
      probe.onerror = () => {
        state.pack = "tsukumo"
        render(false)
      }
      probe.src = `${PACKS.karakasa.dir}/default.png`
      render(false)
    </script>
  </body>
</html>
