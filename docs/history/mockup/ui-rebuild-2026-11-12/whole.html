<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>案A「舞台と紙」の全体（使い捨ての試作）</title>
    <!--
      使い捨ての試作。問いは「案A『舞台と紙』で、タスクの一覧・メニュー・ほかの画面はどうなるか」。
      配置3案の見比べは同じ置き場の index.html にある。
      会話の4局面と雑談のほかに、右から重ねる紙（タスク・成果・使用量・キャラクター・設定）と、
      探す（⌘K）・セッションの切り替え・これまでのセリフを足した。
      ?moment= ?mode= ?sheet= ?overlay= ?tone= ?pack= で場面を名指しでき、?bar=0 は上の切り替えの帯を隠す。
      中身は架空の依頼・架空のタスク・架空のレポートで、実物の会話ではない。
      開き方: このファイルをブラウザで開く。素材は ../../../../characters/ から相対で読む
      （唐傘は履歴に入らない characters/local/karakasa に置いたときだけ出て、無ければ同梱の tsukumo に落ちる）。
      本番のコードではない。テストもエラー処理も持たない。
    -->
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        --accent: #ff9e9e;
        --night: #14121a;
        --ink: #ece8ef;
        --ink-soft: rgb(236 232 239 / 0.74);
        --ink-quiet: rgb(236 232 239 / 0.52);
        --sheet: #211e29;
        --float: #2d2937;
        --raise: rgb(236 232 239 / 0.07);
        --rule: rgb(236 232 239 / 0.11);
        --ok: #7ee081;
        --warn: #e3c766;
        --ng: #f2a0a0;
        --sans: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", system-ui, sans-serif;
        --voice: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
        --mono: "IBM Plex Mono", "SF Mono", ui-monospace, Menlo, monospace;
        background: var(--night);
        color: var(--ink);
        font: 16px/1.85 var(--sans);
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      body[data-tone="day"] .tone {
        --ink: #1f1c27;
        --ink-soft: rgb(31 28 39 / 0.78);
        --ink-quiet: rgb(31 28 39 / 0.58);
        --sheet: #eceaf1;
        --float: #fbfaff;
        --raise: rgb(31 28 39 / 0.06);
        --rule: rgb(31 28 39 / 0.15);
        --ok: #1c7c37;
        --warn: #8a6500;
        --ng: #b3362f;
      }
      .tone {
        color: var(--ink);
      }
      button,
      textarea,
      input {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      kbd {
        font: 11px var(--mono);
        padding: 1px 5px;
        border-radius: 4px;
        background: var(--raise);
        color: var(--ink-soft);
      }
      code {
        font: 0.88em var(--mono);
        background: var(--raise);
        padding: 1px 6px;
        border-radius: 5px;
      }

      /* ── 試作の切り替えの帯（評価する画面の一部ではない） ── */
      #protobar {
        position: fixed;
        inset: 0 0 auto 0;
        height: 34px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        background: #f4f1c9;
        color: #23210f;
        font: 12px/1 var(--mono);
      }
      #protobar button {
        border: 1px solid #23210f55;
        background: none;
        color: inherit;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      #protobar button[aria-pressed="true"] {
        background: #23210f;
        color: #f4f1c9;
      }
      #protobar output {
        min-width: 11em;
        text-align: center;
        font-weight: 700;
      }
      #protobar .gap {
        width: 14px;
      }
      #protobar small {
        margin-left: auto;
        font-size: 11px;
        opacity: 0.7;
      }
      #app {
        position: fixed;
        inset: 34px 0 0 0;
      }
      body[data-bar="0"] #protobar {
        display: none;
      }
      body[data-bar="0"] #app {
        inset: 0;
      }
      .shell {
        position: absolute;
        inset: 0;
      }

      /* ── 読む面の組版（3案で共有する中身） ── */
      .paper {
        color: var(--ink);
        line-break: strict;
        text-autospace: normal;
      }
      :where(.paper p, .paper li) {
        max-width: 42em;
        text-wrap: pretty;
      }
      :where(.paper p) {
        margin: 0 0 1em;
      }
      .r-head {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .r-head .sp {
        margin-left: auto;
        font: 12px var(--mono);
        color: var(--ink-quiet);
      }
      .chip {
        font: 12px var(--mono);
        padding: 2px 7px;
        border-radius: 5px;
        background: var(--raise);
      }
      .done {
        color: var(--ok);
        font-weight: 600;
      }
      .r-ask {
        font-size: 13px;
        color: var(--ink-quiet);
        margin: 8px 0 0 !important;
      }
      .lead {
        font-size: 27px;
        line-height: 1.5;
        font-weight: 700;
        margin: 30px 0 6px;
        word-break: auto-phrase;
        text-wrap: balance;
        font-feature-settings: "palt";
        letter-spacing: 0.02em;
      }
      .lead2 {
        color: var(--ink-soft);
        margin: 0 0 30px !important;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
        padding: 18px 0 20px;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
      }
      .stat b {
        display: block;
        font: 600 28px/1.3 var(--sans);
        font-variant-numeric: tabular-nums;
      }
      .stat b i {
        font-style: normal;
        font-weight: 400;
        font-size: 16px;
        color: var(--ink-quiet);
        margin-right: 8px;
      }
      .stat span {
        font-size: 12.5px;
        color: var(--ink-quiet);
      }
      .checks {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 20px;
        font-size: 13px;
        color: var(--ink-soft);
        margin: 14px 0 0;
      }
      .checks span::before {
        content: "✓";
        color: var(--ok);
        margin-right: 5px;
        font-weight: 700;
      }
      .paper h2 {
        font-size: 20px;
        line-height: 1.5;
        margin: 56px 0 12px;
        font-weight: 700;
        word-break: auto-phrase;
        scroll-margin-top: 24px;
      }
      .paper figure {
        margin: 34px 0 0;
      }
      .paper figcaption {
        font-size: 13px;
        color: var(--ink-quiet);
        margin-top: 8px;
      }
      .flow {
        width: 100%;
        height: auto;
        color: var(--ink-quiet);
      }
      .flow .n rect {
        fill: var(--raise);
      }
      .flow .n.new rect {
        fill: color-mix(in srgb, var(--accent) 26%, transparent);
      }
      .flow text {
        fill: var(--ink);
        font: 13px var(--sans);
        text-anchor: middle;
      }
      .flow .l {
        fill: var(--ink-quiet);
        font-size: 11.5px;
      }
      .flow .e {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.2;
      }
      .paper table {
        border-collapse: collapse;
        width: 100%;
        font-size: 15px;
        margin-top: 6px;
      }
      .paper th {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-quiet);
        text-align: left;
        padding: 8px 16px 8px 0;
        border-bottom: 1px solid var(--rule);
      }
      .paper td {
        padding: 11px 16px 11px 0;
        border-bottom: 1px solid var(--rule);
        vertical-align: top;
      }
      .opts {
        list-style: none;
        padding: 0;
        margin: 6px 0 0;
      }
      .opts li {
        display: grid;
        grid-template-columns: 84px 1fr;
        gap: 2px 14px;
        padding: 13px 0;
        border-bottom: 1px solid var(--rule);
        max-width: none;
      }
      .opts b {
        font-weight: 600;
      }
      .opts span {
        grid-column: 2;
        color: var(--ink-soft);
        font-size: 15px;
      }
      .verdict {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--ink-quiet);
      }
      .verdict.adopt {
        color: var(--ok);
      }

      /* 働くあいだの紙 */
      .w-req {
        font-size: 13px;
        color: var(--ink-quiet);
        margin: 0 !important;
      }
      .w-title {
        font-size: 23px;
        line-height: 1.5;
        font-weight: 700;
        margin: 8px 0 6px;
        word-break: auto-phrase;
      }
      .w-meta {
        font-size: 13.5px;
        color: var(--ink-soft);
        margin: 0 !important;
      }
      .w-meta time {
        font-family: var(--mono);
      }
      .tl {
        list-style: none;
        margin: 38px 0 0;
        padding: 0;
      }
      .tl > li {
        position: relative;
        padding: 0 0 30px 42px;
        max-width: none;
      }
      .tl > li::before {
        content: "";
        position: absolute;
        left: 6px;
        top: 5px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 1.5px solid var(--ink-quiet);
        background: var(--sheet);
        z-index: 1;
      }
      .tl > li::after {
        content: "";
        position: absolute;
        left: 14.5px;
        top: 24px;
        bottom: -5px;
        width: 1.5px;
        background: var(--rule);
      }
      .tl > li:last-child::after {
        display: none;
      }
      .tl > .past::before {
        content: "✓";
        border-color: transparent;
        background: color-mix(in srgb, var(--ok) 24%, var(--sheet));
        color: var(--ok);
        font: 700 11px/18px var(--sans);
        text-align: center;
      }
      .tl > .now::before {
        border: 5px solid var(--accent);
      }
      .tl > .next {
        color: var(--ink-quiet);
      }
      .tl h3 {
        font-size: 16.5px;
        line-height: 1.7;
        margin: 0;
        font-weight: 700;
      }
      .tl h3 small {
        font: 12px var(--mono);
        color: var(--ink-quiet);
        margin-left: 10px;
        font-weight: 400;
      }
      .interim {
        margin: 10px 0 0;
        padding: 14px 18px;
        background: var(--raise);
        border-radius: 10px;
        font-size: 15px;
        max-width: 42em;
      }
      .interim small {
        display: block;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .live {
        list-style: none;
        padding: 0;
        margin: 10px 0 0;
        font-size: 15px;
      }
      .live li {
        padding: 2px 0;
        color: var(--ink-quiet);
        max-width: none;
      }
      .live li.cur {
        color: var(--ink);
        font-weight: 600;
      }
      .live .t {
        font: 12px var(--mono);
        color: var(--ink-quiet);
        margin-left: 10px;
        font-weight: 400;
      }

      /* 迎える */
      .g-who {
        font-size: 12.5px;
        color: color-mix(in srgb, var(--accent) 80%, white);
        margin: 0 0 6px;
      }
      .g-voice {
        font: 600 30px/1.6 var(--voice);
        margin: 0 0 30px;
        word-break: auto-phrase;
        text-shadow: 0 2px 18px rgb(0 0 0 / 0.6);
      }
      .g-group {
        margin-top: 30px;
      }
      .g-group h3 {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-quiet);
        margin: 0 0 4px;
      }
      .g-row {
        display: flex;
        align-items: baseline;
        gap: 12px;
        width: 100%;
        text-align: left;
        background: none;
        border: 0;
        border-top: 1px solid var(--rule);
        padding: 11px 4px;
        font-size: 15px;
        line-height: 1.6;
      }
      .g-row:hover {
        background: var(--raise);
      }
      .g-row code {
        flex: none;
      }
      .g-row em {
        margin-left: auto;
        flex: none;
        font-style: normal;
        font-size: 12.5px;
        color: var(--ink-quiet);
      }

      /* 入力欄（1行から、打った分だけ伸びる） */
      .composer {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        text-shadow: none;
        background: var(--float);
        border-radius: 16px;
        padding: 9px 10px 9px 12px;
        box-shadow:
          0 0 0 1px var(--rule),
          0 14px 36px rgb(0 0 0 / 0.38);
      }
      .composer:focus-within {
        box-shadow:
          0 0 0 1.5px var(--accent),
          0 14px 36px rgb(0 0 0 / 0.38);
      }
      .composer textarea {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        resize: none;
        field-sizing: content;
        max-height: 38vh;
        font: 16px/1.6 var(--sans);
        padding: 5px 2px;
      }
      .composer textarea::placeholder {
        color: var(--ink-quiet);
      }
      .c-bar {
        display: contents;
      }
      .c-bar .c-btn:first-child {
        order: -1;
      }
      .composer[data-size="large"] {
        flex-direction: column;
        align-items: stretch;
        padding: 12px 12px 10px 14px;
      }
      .composer[data-size="large"] textarea {
        min-height: 4.8em;
        flex: 1;
      }
      .composer[data-size="large"] .c-bar {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .composer[data-size="large"] .c-hint {
        margin-right: auto;
      }
      .c-btn {
        flex: none;
        height: 36px;
        min-width: 36px;
        border-radius: 10px;
        border: 0;
        background: var(--raise);
        font-size: 13.5px;
        padding: 0 11px;
      }
      .c-send {
        background: var(--accent);
        color: #2b1216;
        font-weight: 600;
      }
      .c-send kbd {
        background: rgb(43 18 22 / 0.14);
        color: inherit;
        margin-left: 4px;
      }
      .c-hint {
        flex: none;
        align-self: center;
        font-size: 12px;
        color: var(--ink-quiet);
      }

      /* お伺い（入力欄の位置に出る） */
      .inq {
        background: var(--float);
        border-radius: 18px;
        padding: 18px 20px 16px;
        box-shadow:
          0 0 0 1.5px color-mix(in srgb, var(--warn) 70%, transparent),
          0 24px 60px rgb(0 0 0 / 0.5);
      }
      .inq header {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 12.5px;
        color: var(--warn);
        font-weight: 600;
      }
      .inq header span {
        margin-left: auto;
        font: 12px var(--mono);
        color: var(--ink-quiet);
        font-weight: 400;
      }
      .inq h2 {
        font-size: 20px;
        line-height: 1.5;
        margin: 4px 0 10px;
        font-weight: 700;
      }
      .inq dl {
        margin: 0 0 12px;
        display: grid;
        gap: 3px;
        font-size: 13.5px;
        line-height: 1.7;
        color: var(--ink-soft);
      }
      .inq dl div {
        display: grid;
        grid-template-columns: 5.2em 1fr;
        gap: 10px;
      }
      .inq dt {
        color: var(--ink-quiet);
      }
      .inq dd {
        margin: 0;
      }
      .opt {
        display: grid;
        grid-template-columns: 26px 1fr auto;
        align-items: baseline;
        gap: 0 8px;
        width: 100%;
        text-align: left;
        border: 0;
        border-radius: 11px;
        background: var(--raise);
        padding: 9px 12px;
        margin-top: 6px;
        line-height: 1.55;
      }
      .opt b {
        font-size: 15.5px;
        font-weight: 600;
      }
      .opt span {
        grid-column: 2;
        font-size: 13px;
        color: var(--ink-soft);
      }
      .opt em {
        grid-row: 1;
        grid-column: 3;
        font-style: normal;
        font-size: 11.5px;
        color: var(--warn);
      }
      .opt[aria-checked="true"] {
        background: color-mix(in srgb, var(--accent) 20%, var(--float));
        box-shadow: inset 0 0 0 1.5px var(--accent);
      }
      .inq footer {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .inq input {
        flex: 1;
        min-width: 0;
        border: 0;
        border-radius: 10px;
        background: var(--raise);
        padding: 0 12px;
        height: 38px;
        font-size: 14.5px;
      }
      .inq input::placeholder {
        color: var(--ink-quiet);
      }
      .inq .c-btn {
        height: 38px;
      }

      /* 欄外（目次・聞くの札・作業の要点） */
      .side-h {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-quiet);
        margin: 0 0 6px;
      }
      .outline a {
        display: block;
        font-size: 13px;
        line-height: 1.6;
        color: var(--ink-soft);
        padding: 4px 0 4px 12px;
        border-left: 2px solid transparent;
        cursor: pointer;
      }
      .outline a.cur {
        color: var(--ink);
        border-left-color: var(--accent);
      }
      .slip {
        margin-top: 26px;
        padding: 12px 14px;
        border-radius: 10px;
        background: rgb(236 232 239 / 0.07);
        font-size: 13px;
        line-height: 1.7;
      }
      .slip small {
        display: block;
        color: var(--ink-quiet);
        font-size: 11.5px;
      }
      .slip p {
        margin: 2px 0 0;
      }
      .slip .a {
        color: var(--ink-soft);
      }
      .facts {
        margin: 0;
        font-size: 13px;
        line-height: 1.7;
      }
      .facts div {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 6px 0;
        border-bottom: 1px solid var(--rule);
      }
      .facts dt {
        color: var(--ink-quiet);
      }
      .facts dd {
        margin: 0;
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .facts-note {
        font-size: 12px;
        color: var(--ink-quiet);
        line-height: 1.7;
        margin: 10px 0 0;
      }

      /* 部屋の頭・吹き出し・立ち絵（舞台の部品） */
      .room-name {
        font: 600 15px/1.4 var(--sans);
        letter-spacing: 0.02em;
      }
      .room-state {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        line-height: 1.4;
        color: var(--ink-soft);
      }
      .room-state i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ink-quiet);
      }
      .room-state[data-state="work"] i {
        background: var(--accent);
      }
      .room-state[data-state="ask"] i {
        background: var(--warn);
      }
      .room-state[data-state="deliver"] i {
        background: var(--ok);
      }
      .room-state time {
        font-family: var(--mono);
      }
      .room-nav {
        display: flex;
        gap: 2px;
      }
      .room-nav button {
        font-size: 12.5px;
        color: var(--ink-soft);
        background: none;
        border: 0;
        padding: 4px 8px;
        border-radius: 6px;
      }
      .room-nav button:hover {
        background: rgb(255 255 255 / 0.1);
        color: var(--ink);
      }
      .b-old {
        font: 600 14px/1.7 var(--voice);
        color: rgb(255 255 255 / 0.74);
        margin: 0 0 0 4px;
        padding: 3px 12px;
        border-radius: 10px;
        background: rgb(20 18 26 / 0.5);
        backdrop-filter: blur(6px);
      }
      .b-now {
        background: color-mix(in srgb, #1d1a25 84%, var(--accent));
        border-radius: 16px 16px 16px 4px;
        padding: 11px 16px 13px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.45);
        animation: bubble-in 0.32s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .b-now small {
        display: block;
        font: 11.5px/1.6 var(--sans);
        color: color-mix(in srgb, var(--accent) 80%, white);
      }
      .b-now p {
        margin: 0;
        font: 600 16.5px/1.75 var(--voice);
        word-break: auto-phrase;
      }
      @keyframes bubble-in {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
      }
      .portrait {
        pointer-events: none;
        user-select: none;
        view-transition-name: portrait;
      }
      .tone-main {
        view-transition-name: sheet;
      }
      .dock {
        view-transition-name: dock;
      }
      ::view-transition-group(*) {
        animation-duration: 0.42s;
        animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @media (prefers-reduced-motion: reduce) {
        .b-now {
          animation: none;
        }
      }

      /* ══ A 舞台と紙 ══ */
      .A {
        --stage-w: clamp(300px, 26vw, 600px);
        display: grid;
        grid-template: minmax(0, 1fr) / var(--stage-w) minmax(0, 1fr);
      }
      .A[data-moment="greet"] {
        --stage-w: clamp(340px, 42vw, 900px);
      }
      .scene {
        position: absolute;
        inset: 0;
        background: var(--scene-img) left center / cover no-repeat;
      }
      .A .scene::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(180deg, rgb(20 18 26 / 0.62), transparent 24%),
          linear-gradient(0deg, rgb(20 18 26 / 0.5), transparent 36%),
          linear-gradient(
            90deg,
            rgb(20 18 26 / 0.12) 0,
            rgb(20 18 26 / 0.5) calc(var(--stage-w) * 0.86),
            rgb(20 18 26 / 0.9) calc(var(--stage-w) + 140px)
          );
      }
      .A-stage {
        position: relative;
        min-width: 0;
        z-index: 2;
        pointer-events: none;
      }
      .A-stage > :not(.portrait) {
        pointer-events: auto;
      }
      .A-stage .room {
        position: absolute;
        top: 16px;
        left: 22px;
        right: 8px;
        display: grid;
        gap: 4px;
        text-shadow: 0 1px 10px rgb(0 0 0 / 0.8);
      }
      .A-stage .room-nav {
        margin: 2px 0 0 -8px;
      }
      .A-stage .portrait {
        position: absolute;
      }
      body[data-fit="bust"] .A-stage {
        --portrait-h: calc(var(--stage-w) * 1.14 * var(--ratio));
      }
      body[data-fit="bust"] .A-stage .portrait {
        left: -5%;
        bottom: 0;
        width: 114%;
        -webkit-mask-image:
          linear-gradient(#0000, #000 11%), linear-gradient(90deg, #000 80%, #0000);
        -webkit-mask-composite: source-in;
        mask-image: linear-gradient(#0000, #000 11%), linear-gradient(90deg, #000 80%, #0000);
        mask-composite: intersect;
      }
      body[data-fit="full"] .A-stage {
        --portrait-h: min(70%, calc(var(--stage-w) * 1.34));
      }
      body[data-fit="full"] .A-stage .portrait {
        left: 50%;
        bottom: -1%;
        height: var(--portrait-h);
        transform: translateX(-50%);
      }
      .A-stage .bubbles {
        position: absolute;
        left: 20px;
        right: 6px;
        bottom: calc(var(--portrait-h) - 4px);
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      body[data-fit="full"] .A-stage .bubbles {
        bottom: calc(var(--portrait-h) - 12px);
      }
      .A-right {
        position: relative;
        display: flex;
        justify-content: center;
        min-width: 0;
        min-height: 0;
        padding-top: 16px;
      }
      .A-sheet {
        position: relative;
        flex: 0 1 880px;
        min-width: 0;
        display: flex;
      }
      .A-sheet .paper {
        flex: 1;
        min-width: 0;
        overflow: auto;
        scrollbar-width: thin;
        background: var(--sheet);
        border-radius: 12px 12px 0 0;
        padding: 38px 64px 150px;
        box-shadow: 0 24px 70px rgb(0 0 0 / 0.5);
      }
      .A-sheet::after {
        content: "";
        position: absolute;
        inset: auto 12px 0 0;
        height: 110px;
        background: linear-gradient(transparent, var(--sheet) 64%);
        pointer-events: none;
      }
      .A-sheet .dock {
        position: absolute;
        left: 30px;
        right: 30px;
        bottom: 16px;
        z-index: 2;
      }
      .A[data-moment="ask"] .paper > * {
        opacity: 0.32;
      }
      .A-margin {
        flex: 0 1 260px;
        min-width: 190px;
        padding: 42px 22px 0 28px;
        overflow: auto;
        text-shadow: 0 1px 8px rgb(0 0 0 / 0.6);
      }
      .A-home {
        flex: 0 1 680px;
        min-width: 0;
        align-self: center;
        padding: 0 36px 7vh 12px;
      }

      /* ══ 狭い画面（760px 以下は今と同じ縦1列） ══ */
      .N {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto auto;
        background: var(--night);
      }
      .N .tone {
        --sheet: #17151d;
      }
      .N-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
        border-bottom: 1px solid var(--rule);
      }
      .face {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        object-fit: cover;
        flex: none;
      }
      .N-head b {
        display: block;
        font-size: 14.5px;
        line-height: 1.5;
      }
      .N-main {
        overflow: auto;
        background: var(--sheet);
        padding: 22px 18px 40px;
      }
      .N-main .lead {
        font-size: 22px;
      }
      .N-main .stats {
        gap: 12px;
      }
      .N-main .stat b {
        font-size: 21px;
      }
      .N-main .g-voice {
        font-size: 23px;
        text-shadow: none;
      }
      .N-voice {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        padding: 8px 14px 0;
      }
      .N-voice .b-now {
        padding: 8px 14px 9px;
      }
      .N-voice .b-now p {
        font-size: 15px;
      }
      .N-dock {
        padding: 10px 12px 12px;
      }
      .N .c-hint {
        display: none;
      }

      /* ══ 案Aの全体: 部屋の頭 ══ */
      .A-stage .room {
        top: 14px;
        left: 20px;
        right: 12px;
        grid-template-columns: 1fr auto;
        gap: 6px 10px;
        align-items: center;
        max-width: 336px;
      }
      .room-pick {
        justify-self: start;
        border: 0;
        background: none;
        padding: 2px 6px;
        margin-left: -6px;
        border-radius: 6px;
        font: 600 15px/1.4 var(--sans);
        letter-spacing: 0.02em;
        text-shadow: inherit;
      }
      .room-pick span {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-left: 9px;
        border-right: 1.5px solid var(--ink-soft);
        border-bottom: 1.5px solid var(--ink-soft);
        transform: translateY(-3px) rotate(45deg);
      }
      .room-pick:hover,
      .room-pick[aria-expanded="true"] {
        background: rgb(255 255 255 / 0.1);
      }
      .gate {
        display: inline-flex;
        background: rgb(20 18 26 / 0.5);
        backdrop-filter: blur(6px);
        border-radius: 8px;
        padding: 2px;
        text-shadow: none;
      }
      .gate button {
        border: 0;
        background: none;
        color: var(--ink-soft);
        font-size: 12.5px;
        padding: 2px 12px;
        border-radius: 6px;
      }
      .gate button[aria-pressed="true"] {
        background: rgb(236 232 239 / 0.18);
        color: var(--ink);
      }
      .room-state[data-state="chat"] i {
        background: var(--accent);
      }
      .meter {
        border: 0;
        background: none;
        display: flex;
        align-items: center;
        gap: 6px;
        font: 12px var(--mono);
        color: var(--ink-soft);
        padding: 2px 4px;
        border-radius: 6px;
        text-shadow: inherit;
      }
      .meter i {
        width: 34px;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--ink-soft) var(--v), rgb(255 255 255 / 0.2) var(--v));
      }
      .kbtn {
        border: 0;
        background: none;
        font-size: 12.5px;
        color: var(--ink-soft);
        padding: 4px 6px;
        border-radius: 6px;
        text-shadow: inherit;
      }
      .kbtn kbd {
        margin-left: 6px;
        background: rgb(20 18 26 / 0.55);
      }
      .meter:hover,
      .kbtn:hover {
        background: rgb(255 255 255 / 0.1);
        color: var(--ink);
      }
      .A-stage .room-nav {
        margin: 0 0 0 -8px;
      }

      /* セッションの切り替え（部屋の名前から出る） */
      .pop {
        position: absolute;
        z-index: 22;
        top: 44px;
        left: 14px;
        width: 336px;
        background: var(--float);
        border-radius: 14px;
        padding: 8px;
        box-shadow:
          0 0 0 1px var(--rule),
          0 24px 60px rgb(0 0 0 / 0.55);
        text-shadow: none;
      }
      .pop h4 {
        font-size: 11.5px;
        font-weight: 500;
        color: var(--ink-quiet);
        margin: 8px 10px 2px;
      }
      .pop button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        border-radius: 9px;
        padding: 7px 10px;
        font-size: 14px;
        line-height: 1.5;
      }
      .pop button small {
        display: block;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .pop button:hover,
      .pop button[aria-current="true"] {
        background: var(--raise);
      }

      /* これまでのセリフ */
      .logbtn {
        border: 0;
        background: rgb(20 18 26 / 0.5);
        backdrop-filter: blur(6px);
        color: var(--ink-soft);
        font-size: 11.5px;
        border-radius: 999px;
        padding: 2px 10px;
        margin-left: 4px;
      }
      .A-stage[data-log]::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(rgb(20 18 26 / 0.1), rgb(20 18 26 / 0.74) 22%);
      }
      .A-stage .bubbles.log {
        top: 112px;
        overflow: auto;
        scrollbar-width: none;
      }
      .bubbles.log > :first-child {
        margin-top: auto;
      }
      .bubbles.log .b-old small {
        font: 11px var(--mono);
        margin-right: 8px;
        opacity: 0.7;
      }

      /* 入力欄の足し分（動き方の札・コマンドの候補） */
      .composer {
        position: relative;
      }
      .c-mode {
        font-size: 12.5px;
        color: var(--ink-soft);
      }
      .slash {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(100% + 8px);
        background: var(--float);
        border-radius: 12px;
        padding: 6px;
        box-shadow:
          0 0 0 1px var(--rule),
          0 14px 36px rgb(0 0 0 / 0.4);
      }
      .slash[hidden] {
        display: none;
      }
      .slash div {
        display: flex;
        gap: 12px;
        align-items: baseline;
        padding: 7px 10px;
        border-radius: 8px;
        font-size: 14px;
      }
      .slash div:first-child {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .slash code {
        background: none;
        padding: 0;
      }
      .slash small {
        margin-left: auto;
        color: var(--ink-quiet);
      }

      /* 戻ってきたときの札・やり取りの並び */
      .away {
        display: flex;
        gap: 12px;
        align-items: baseline;
        background: var(--raise);
        border-radius: 10px;
        padding: 9px 14px;
        font-size: 13.5px;
        line-height: 1.6;
        margin: 0 0 22px;
      }
      .away b {
        flex: none;
        font-weight: 600;
      }
      .away button {
        margin-left: auto;
        border: 0;
        background: none;
        color: var(--ink-quiet);
      }
      .turns {
        margin-bottom: 30px;
      }

      /* 雑談 */
      .A[data-mode="chat"] {
        --stage-w: clamp(340px, 40vw, 860px);
      }
      .A-chat {
        flex: 0 1 700px;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 0 28px 18px 8px;
      }
      .ch-thread {
        flex: 1;
        min-height: 0;
        overflow: auto;
        scrollbar-width: none;
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 28px 4px 20px;
      }
      .ch-thread > :first-child {
        margin-top: auto;
      }
      .ch-her {
        align-self: flex-start;
        max-width: 82%;
        background: color-mix(in srgb, #1d1a25 84%, var(--accent));
        border-radius: 16px 16px 16px 4px;
        padding: 10px 16px 12px;
        box-shadow: 0 10px 30px rgb(0 0 0 / 0.35);
      }
      .ch-her small {
        display: block;
        font-size: 11.5px;
        line-height: 1.6;
        color: color-mix(in srgb, var(--accent) 70%, white);
      }
      .ch-her p {
        margin: 0;
        font: 600 17px/1.8 var(--voice);
        word-break: auto-phrase;
      }
      .ch-me {
        align-self: flex-end;
        max-width: 74%;
        background: var(--float);
        border-radius: 16px 16px 4px 16px;
        padding: 9px 15px;
      }
      .ch-me p {
        margin: 0;
        font-size: 15.5px;
        line-height: 1.7;
      }
      .ch-me small {
        display: block;
        text-align: right;
        font: 11px var(--mono);
        color: var(--ink-quiet);
      }
      .mem {
        list-style: none;
        margin: 0 0 26px;
        padding: 0;
        font-size: 13px;
        line-height: 1.7;
        color: var(--ink-soft);
      }
      .mem li {
        padding: 5px 0;
        border-bottom: 1px solid var(--rule);
      }

      /* ══ 重ねる紙（タスク・成果・使用量・キャラ・設定） ══ */
      .over-veil {
        position: absolute;
        inset: 0;
        z-index: 4;
        background: rgb(12 10 16 / 0.52);
      }
      .over {
        position: absolute;
        z-index: 5;
        top: 16px;
        right: 0;
        bottom: 0;
        width: min(calc(100% - 64px), 1000px);
        display: flex;
        flex-direction: column;
        background: var(--sheet);
        border-radius: 12px 0 0 0;
        box-shadow: -24px 0 70px rgb(0 0 0 / 0.5);
      }
      .over[data-fresh] {
        animation: over-in 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      @keyframes over-in {
        from {
          opacity: 0;
          transform: translateX(36px);
        }
      }
      .over-head {
        display: flex;
        align-items: baseline;
        gap: 14px;
        padding: 22px 32px 14px;
      }
      .over-head h1 {
        font-size: 22px;
        line-height: 1.5;
        margin: 0;
        font-weight: 700;
      }
      .over-sub {
        font-size: 13px;
        color: var(--ink-quiet);
      }
      .over-head .close {
        margin-left: auto;
        align-self: center;
      }
      .close kbd {
        margin-left: 6px;
      }
      .over-body {
        flex: 1;
        min-height: 0;
        overflow: auto;
        scrollbar-width: thin;
        padding: 0 32px 40px;
      }
      .over-body.flush {
        padding: 0;
        overflow: hidden;
      }
      .over h3 {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--ink-quiet);
        margin: 26px 0 6px;
      }

      /* タスク */
      .tk {
        display: grid;
        grid-template-columns: minmax(280px, 42%) minmax(0, 1fr);
        height: 100%;
      }
      .tk-list {
        overflow: auto;
        scrollbar-width: thin;
        padding: 0 12px 24px 22px;
        border-right: 1px solid var(--rule);
      }
      .tk-tools {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--sheet);
        padding: 2px 0 10px;
      }
      .search {
        width: 100%;
        height: 38px;
        border: 0;
        border-radius: 10px;
        background: var(--raise);
        padding: 0 12px;
        font-size: 14.5px;
      }
      .search::placeholder {
        color: var(--ink-quiet);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 10px;
      }
      .chips button {
        border: 0;
        border-radius: 999px;
        background: var(--raise);
        color: var(--ink-soft);
        font-size: 12.5px;
        padding: 3px 10px;
      }
      .chips button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--sheet);
      }
      .tk-group {
        font-size: 12px;
        font-weight: 500;
        color: var(--ink-quiet);
        margin: 14px 0 4px 10px;
      }
      .tk-row {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 1px 10px;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        border-radius: 10px;
        padding: 8px 10px;
        line-height: 1.55;
      }
      .tk-row:hover {
        background: var(--raise);
      }
      .tk-row[aria-selected="true"] {
        background: color-mix(in srgb, var(--accent) 18%, transparent);
      }
      .tk-row code {
        align-self: start;
        margin-top: 3px;
      }
      .tk-row b {
        font-size: 14.5px;
        font-weight: 600;
      }
      .tk-row span {
        grid-column: 2;
        font-size: 12.5px;
        color: var(--ink-quiet);
      }
      .tk-detail {
        overflow: auto;
        scrollbar-width: thin;
        padding: 4px 32px 0;
        display: flex;
        flex-direction: column;
      }
      .tk-detail h2 {
        font-size: 22px;
        margin: 12px 0 0;
      }
      .tk-detail p,
      .tk-detail li {
        font-size: 15px;
        line-height: 1.8;
        margin: 0;
      }
      .tk-detail ol {
        margin: 0;
        padding-left: 1.4em;
      }
      .tk-act {
        position: sticky;
        bottom: 0;
        margin-top: auto;
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
        padding: 28px 0 18px;
        background: linear-gradient(transparent, var(--sheet) 34%);
      }
      .tk-act .c-btn {
        height: 40px;
        padding: 0 16px;
      }
      .tk-act .c-hint {
        margin-right: auto;
      }

      /* 成果 */
      .dy {
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 44px;
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
      }
      .cal span {
        font-size: 11.5px;
        color: var(--ink-quiet);
        text-align: center;
        padding: 4px 0;
      }
      .cal button {
        position: relative;
        aspect-ratio: 4 / 5;
        border: 0;
        border-radius: 9px;
        background: none;
        color: var(--ink-soft);
        font: 12px var(--mono);
        display: grid;
        place-items: start center;
        padding-top: 6px;
      }
      .cal button .fox {
        position: absolute;
        bottom: 4px;
      }
      .cal button .fox-2 {
        filter: drop-shadow(0 0 3px color-mix(in srgb, var(--accent) 35%, transparent));
      }
      .cal button .fox-3 {
        filter: drop-shadow(0 0 7px color-mix(in srgb, var(--accent) 65%, transparent));
      }
      .cal button:hover,
      .cal button[aria-pressed="true"] {
        background: var(--raise);
        color: var(--ink);
      }
      .cal-note {
        font-size: 12px;
        color: var(--ink-quiet);
        margin: 12px 0 0;
      }
      .dy h2 {
        font-size: 20px;
        margin: 0 0 2px;
      }
      .dy-list {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 15px;
      }
      .dy-list li {
        padding: 8px 0;
        border-bottom: 1px solid var(--rule);
      }
      .dy-list code {
        margin-right: 10px;
      }
      .diary-v {
        writing-mode: vertical-rl;
        height: 300px;
        max-width: 100%;
        overflow: auto;
        font: 600 17px/2.1 var(--voice);
        letter-spacing: 0.06em;
        background: var(--raise);
        border-radius: 10px;
        padding: 20px 22px;
        margin: 0;
      }

      /* 使用量 */
      .big {
        font-size: 14px;
        color: var(--ink-quiet);
        margin: 0 0 10px;
      }
      .big b {
        font: 600 28px/1.3 var(--sans);
        color: var(--ink);
        margin-right: 4px;
      }
      .big span {
        margin-left: 12px;
      }
      .bar {
        display: flex;
        height: 14px;
        border-radius: 7px;
        overflow: hidden;
        background: var(--raise);
      }
      .bar i {
        display: block;
      }
      .legend {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px 24px;
        font-size: 13px;
        margin-top: 12px;
      }
      .legend span::before {
        content: "";
        display: inline-block;
        width: 9px;
        height: 9px;
        border-radius: 2px;
        background: var(--c);
        margin-right: 8px;
      }
      .legend em {
        font: normal 12px var(--mono);
        color: var(--ink-quiet);
        margin-left: 8px;
      }
      .quota {
        display: grid;
        grid-template-columns: 6.5em 1fr 14em;
        gap: 14px;
        align-items: center;
        font-size: 14px;
        padding: 10px 0;
        border-bottom: 1px solid var(--rule);
      }
      .quota .track {
        height: 8px;
        border-radius: 4px;
        background: var(--raise);
        overflow: hidden;
      }
      .quota .track i {
        display: block;
        height: 100%;
        background: var(--ink-soft);
      }
      .quota small {
        font-size: 12.5px;
        color: var(--ink-quiet);
      }
      .week {
        display: flex;
        align-items: flex-end;
        gap: 10px;
        height: 130px;
      }
      .week div {
        flex: 1;
        text-align: center;
        font: 11px var(--mono);
        color: var(--ink-quiet);
      }
      .week i {
        display: block;
        border-radius: 4px 4px 0 0;
        background: var(--ink-soft);
        margin-bottom: 6px;
      }
      .tip {
        display: flex;
        align-items: center;
        gap: 16px;
        background: var(--raise);
        border-radius: 12px;
        padding: 14px 18px;
        margin-top: 30px;
        font-size: 14px;
        line-height: 1.7;
      }
      .tip .c-btn {
        margin-left: auto;
        height: 38px;
      }

      .pk {
        display: grid;
        grid-template-columns: 230px minmax(0, 1fr);
        gap: 36px;
      }
      .pk-row {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        border-radius: 12px;
        padding: 8px 10px;
        font-size: 15px;
        line-height: 1.5;
      }
      .pk-row small {
        display: block;
        font-size: 12px;
        color: var(--ink-quiet);
      }
      .pk-row img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        object-fit: cover;
      }
      .pk-row:hover,
      .pk-row[aria-selected="true"] {
        background: var(--raise);
      }
      .pk-name {
        font: 600 30px/1.4 var(--voice);
        margin: 0;
      }
      .pk-tag {
        font-size: 14px;
        color: var(--ink-soft);
        margin: 4px 0 14px;
      }
      .pk-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(118px, 1fr));
        gap: 10px;
      }
      .pk-grid figure {
        margin: 0;
        background: var(--raise);
        border-radius: 10px;
        overflow: hidden;
        text-align: center;
        font-size: 12.5px;
        padding-bottom: 7px;
      }
      .pk-grid img {
        display: block;
        width: 100%;
        aspect-ratio: 1;
        object-fit: cover;
        object-position: 50% 18%;
        margin-bottom: 6px;
      }

      /* 設定 */
      .st-row {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 12px 0;
        border-bottom: 1px solid var(--rule);
        font-size: 15px;
        line-height: 1.6;
      }
      .st-row small {
        display: block;
        font-size: 12.5px;
        color: var(--ink-quiet);
      }
      .st-row .seg,
      .st-row code {
        margin-left: auto;
        flex: none;
      }
      .seg {
        display: inline-flex;
        background: var(--raise);
        border-radius: 9px;
        padding: 2px;
      }
      .seg button {
        border: 0;
        background: none;
        color: var(--ink-soft);
        font-size: 13px;
        padding: 5px 12px;
        border-radius: 7px;
      }
      .seg button[aria-pressed="true"] {
        background: var(--sheet);
        color: var(--ink);
        box-shadow: 0 0 0 1px var(--rule);
      }

      /* 探す（⌘K） */
      .pal-veil {
        position: absolute;
        inset: 0;
        z-index: 30;
        background: rgb(12 10 16 / 0.46);
      }
      .pal {
        position: absolute;
        z-index: 31;
        top: 12%;
        left: 50%;
        transform: translateX(-50%);
        width: min(640px, calc(100% - 32px));
        background: var(--float);
        color: var(--ink);
        border-radius: 16px;
        overflow: hidden;
        box-shadow:
          0 0 0 1px var(--rule),
          0 30px 80px rgb(0 0 0 / 0.6);
      }
      .pal input {
        width: 100%;
        border: 0;
        outline: 0;
        background: none;
        font-size: 17px;
        padding: 16px 18px;
        border-bottom: 1px solid var(--rule);
      }
      .pal input::placeholder {
        color: var(--ink-quiet);
      }
      .pal-list {
        max-height: 54vh;
        overflow: auto;
        scrollbar-width: thin;
        padding: 6px;
      }
      .pal-g {
        font-size: 11.5px;
        color: var(--ink-quiet);
        padding: 10px 12px 2px;
        margin: 0;
      }
      .pal-i {
        display: flex;
        align-items: baseline;
        gap: 10px;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        border-radius: 9px;
        padding: 8px 12px;
        font-size: 14.5px;
        line-height: 1.5;
      }
      .pal-i[aria-selected="true"] {
        background: color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .pal-i small {
        margin-left: auto;
        font-size: 12px;
        color: var(--ink-quiet);
      }

      @media (max-width: 1120px) {
        .A-margin {
          display: none;
        }
      }
      @media (max-width: 760px) {
        .N .over {
          inset: 0;
          width: auto;
          border-radius: 0;
        }
        .tk,
        .dy,
        .pk {
          grid-template-columns: minmax(0, 1fr);

        }
        .over-body.flush {

        }

          padding: 0 20px 32px;
        }
        .quota {
          grid-template-columns: 6.5em 1fr;
        }
        .quota small {
          grid-column: 1 / -1;
        }
      }
    </style>

        if (!state.sheet) return ""
        return `<div class="over-veil" data-close></div>
          <section class="over tone" role="dialog" aria-label="${SHEET_NAMES[state.sheet]}"${fresh ? " data-fresh" : ""}>${SHEETS[state.sheet]()}</section>`
      }

      // ── 探す（⌘K） ──
      const leave = { sheet: null, overlay: null }
      function paletteItems() {
        const items = [
          ["移る", "タスク", "", { sheet: "tasks", overlay: null }],
          ["移る", "成果", "", { sheet: "diary", overlay: null }],
          ["移る", "使用量", "", { sheet: "usage", overlay: null }],
          ["移る", "キャラクター", "", { sheet: "pack", overlay: null }],
          ["移る", "設定", "", { sheet: "settings", overlay: null }],
          ["移る", chatting() ? "仕事に戻る" : "雑談に切り替える", "", { ...leave, mode: chatting() ? "work" : "chat" }],
          ...TASKS.filter((task) => !task.blocked).map((task) => [
            "タスクを頼む",
            `${task.id} ${task.title}`,
            "↩ で頼む",
            { ...leave, mode: "work", moment: "work" },
          ]),
          ["コマンド", "/next-task", "次のタスクを進める", { ...leave, mode: "work", moment: "work" }],
          ["コマンド", "/compact", "会話をまとめて文脈を空ける", { overlay: null }],
          ["コマンド", "/clear", "新しく始める", { ...leave, mode: "work", moment: "greet" }],
          ["見た目", "紙の色を切り替える", state.tone === "night" ? "いまは夜" : "いまは昼", { overlay: null, tone: state.tone === "night" ? "day" : "night" }],
        ]
        const word = state.palette.trim()
        return word === "" ? items : items.filter(([, label, note]) => `${label} ${note}`.includes(word))
      }
      function paletteList() {
        const items = paletteItems()
        if (items.length === 0) return `<p class="pal-g">当てはまるものが無い</p>`
        let group = ""
        return items
          .map(([name, label, note], index) => {
            const head = name === group ? "" : `<p class="pal-g">${name}</p>`
            group = name
            return `${head}<button type="button" class="pal-i" role="option" data-pick="${index}" aria-selected="${index === state.picked}">${label}<small>${note}</small></button>`
          })
          .join("")
      }
      function palette() {
        return `<div class="pal-veil" data-overlay="palette"></div>
          <div class="pal tone" role="dialog" aria-label="探す">
            <input id="pal-q" placeholder="画面・タスク・コマンドを探す" aria-label="探す" value="${state.palette}">
            <div class="pal-list" id="pal-list" role="listbox">${paletteList()}</div>
          </div>`
      }

      const SHELLS = {
        // A: 画面全体が舞台。左に立ち絵、中央に紙、右に欄外。ほかの画面は右から紙を1枚重ねて出す。
        A() {
          const greeting = !chatting() && state.moment === "greet"
          const right = chatting()
            ? chatView()
            : greeting
              ? `<div class="A-home">${greet()}</div>`
              : `<div class="A-sheet tone tone-main"><main class="paper" id="paper">${paperContent()}</main><div class="dock">${dock()}</div></div>
                 <aside class="A-margin">${turns()}${margin()}</aside>`
          const speaks = state.sheet !== null || (!chatting() && !greeting)
          return `<div class="A shell" data-moment="${state.moment}" data-mode="${state.mode}">
            <div class="scene"></div>
            <aside class="A-stage"${state.overlay === "log" ? " data-log" : ""}>
              ${room()}${state.overlay === "sessions" ? sessions() : ""}${speaks ? bubbles() : ""}${portrait()}
            </aside>
            <div class="A-right">${right}${overSheet()}</div>
            ${state.overlay === "palette" ? palette() : ""}
          </div>`
        },
        // 760px 以下は縦1列。ほかの画面は全面の紙で出し、入口は頭の「≡」（探す）にまとめる。
        N() {
          const line = pack().lines[state.moment]
          return `<div class="N shell" data-moment="${state.moment}">
            <header class="N-head"><img class="face" src="${pack().dir}/face.png" alt="">
              <div style="flex: 1; min-width: 0"><span class="room-state" data-state="${state.moment}"><i></i>${STATE_LABEL[state.moment]}</span><b>${state.moment === "greet" ? "tsukumo-3" : "ID の変換を新旧どちらの形でも受け付ける"}</b></div>
              <button type="button" class="c-btn" data-overlay="palette" aria-label="メニューと探す">≡</button></header>
            <main class="N-main tone"><div class="paper" id="paper">${state.moment === "greet" ? greet(false) : paperContent()}</div></main>
            ${state.moment === "greet" ? "" : `<div class="N-voice"><img class="face" src="${pack().dir}/face.png" alt=""><div class="b-now"><p>${line.now}</p></div></div>`}
            <div class="N-dock"><div class="dock">${dock()}</div></div>
            ${overSheet()}${state.overlay === "palette" ? palette() : ""}
          </div>`
        },
      }

      function render() {
        const app = document.getElementById("app")
        const body = document.body
        body.dataset.tone = state.tone
        body.dataset.fit = pack().fit
        body.dataset.bar = state.bar ? "1" : "0"
        body.style.setProperty("--accent", chatting() ? pack().chatAccent : pack().accent)
        body.style.setProperty("--ratio", String(pack().ratio))
        body.style.setProperty("--scene-img", `url("${pack().dir}/background.png")`)
        app.innerHTML = SHELLS[narrow.matches ? "N" : "A"]()
        fresh = false

        for (const button of document.querySelectorAll("#protobar button")) {
          const data = button.dataset
          const on =
            (data.bMoment && !chatting() && !state.sheet && data.bMoment === state.moment) ||
            (data.bMode && chatting() && !state.sheet) ||
            (data.bSheet && data.bSheet === state.sheet) ||
            (data.bOverlay && data.bOverlay === state.overlay)
          if (data.bMoment || data.bMode || data.bSheet || data.bOverlay) {
            button.setAttribute("aria-pressed", String(Boolean(on)))
          }
        }
        document.getElementById("pb-tone").textContent = state.tone === "night" ? "紙: 夜" : "紙: 昼"
        document.getElementById("pb-pack").textContent = `立ち絵: ${pack().name}`

        if (state.overlay === "palette") document.getElementById("pal-q")?.focus()
        const thread = document.getElementById("thread")
        if (thread) thread.scrollTop = thread.scrollHeight
        const log = app.querySelector(".bubbles.log")
        if (log) log.scrollTop = log.scrollHeight

        clearInterval(ticker)
        const ticks = app.querySelectorAll("[data-tick]")
        if (ticks.length > 0) {
          let seconds = 114
          ticker = setInterval(() => {
            seconds += 1
            const label = `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`
            for (const tick of ticks) tick.textContent = label
          }, 1000)
        }
      }

      // 動きを付けるのは、局面か仕事・雑談が変わるときだけ。紙を重ねるときは紙だけが右から入る。
      function go(patch) {
        const posture =
          (patch.moment !== undefined && patch.moment !== state.moment) ||
          (patch.mode !== undefined && patch.mode !== state.mode)
        fresh = patch.sheet !== undefined && patch.sheet !== null && patch.sheet !== state.sheet
        if (patch.overlay === "palette") Object.assign(state, { palette: "", picked: 0 })
        Object.assign(state, patch)
        const next = new URLSearchParams()
        for (const key of ["moment", "mode", "sheet", "overlay", "tone", "pack"]) {
          if (state[key]) next.set(key, state[key])
        }
        if (!state.bar) next.set("bar", "0")
        history.replaceState(null, "", `?${next}`)
        const still = matchMedia("(prefers-reduced-motion: reduce)").matches
        if (posture && document.startViewTransition && !still) document.startViewTransition(render)
        else render()
      }
      const toggle = (key, value) => (state[key] === value ? null : value)
      const dispatchTask = () => go({ ...leave, mode: "work", moment: "work" })
      const stepMoment = (step) =>
        go({
          moment: MOMENTS[(MOMENTS.indexOf(state.moment) + step + MOMENTS.length) % MOMENTS.length],
        })
      function refreshTasks() {
        document.getElementById("tk-rows").innerHTML = taskRows()
        document.getElementById("tk-chips").innerHTML = filterChips()
        document.getElementById("tk-detail").innerHTML = taskDetail()
      }
      function stepTask(step) {
        const ids = [...document.querySelectorAll(".tk-row")].map((row) => row.dataset.task)
        if (ids.length === 0) return
        const at = ids.indexOf(state.task)
        state.task = ids[Math.max(0, Math.min(ids.length - 1, at + step))]
        refreshTasks()
        document.querySelector('.tk-row[aria-selected="true"]')?.scrollIntoView({ block: "nearest" })
      }
      function refreshSheet() {
        const sheet = document.querySelector(".over")
        if (sheet) sheet.innerHTML = SHEETS[state.sheet]()
      }
      function runPalette(index) {
        const item = paletteItems()[index]
        if (item) go(item[3])
      }

      document.getElementById("protobar").addEventListener("click", (event) => {
        const data = event.target.closest("button")?.dataset
        if (!data) return
        if (data.bMoment) go({ ...leave, mode: "work", moment: data.bMoment })
        if (data.bMode) go({ ...leave, mode: data.bMode })
        if (data.bSheet) go({ sheet: toggle("sheet", data.bSheet), overlay: null })
        if (data.bOverlay === "log") {
          const moment = state.moment === "greet" ? "deliver" : state.moment
          go({ overlay: toggle("overlay", "log"), sheet: null, mode: "work", moment })
        } else if (data.bOverlay) {
          go({ overlay: toggle("overlay", data.bOverlay) })
        }
        if (data.toggle === "tone") go({ tone: state.tone === "night" ? "day" : "night" })
        if (data.toggle === "pack") {
          const ids = Object.keys(PACKS)
          go({ pack: ids[(ids.indexOf(state.pack) + 1) % ids.length], peek: null })
        }
      })

      const app = document.getElementById("app")
      app.addEventListener("click", (event) => {
        const hit = (selector) => event.target.closest(selector)
        if (hit("[data-pick]")) return runPalette(Number(hit("[data-pick]").dataset.pick))
        if (hit("[data-dispatch]") || hit(".g-row")) return dispatchTask()
        if (hit("[data-new]")) return go({ ...leave, mode: "work", moment: "greet" })
        if (hit("[data-close]")) return go({ sheet: null })
        if (hit("[data-sheet]")) return go({ sheet: toggle("sheet", hit("[data-sheet]").dataset.sheet), overlay: null })
        if (hit("[data-overlay]")) return go({ overlay: toggle("overlay", hit("[data-overlay]").dataset.overlay) })
        if (hit("button[data-mode]")) return go({ ...leave, mode: hit("button[data-mode]").dataset.mode })
        if (hit("button[data-pack]")) return go({ pack: hit("button[data-pack]").dataset.pack })
        if (hit("button[data-tone]")) return go({ tone: hit("button[data-tone]").dataset.tone })
        if (hit(".pop button")) return go({ overlay: null })
        if (hit("[data-task]")) {
          state.task = hit("[data-task]").dataset.task
          return refreshTasks()
        }
        if (hit("[data-filter]")) {
          state.filter = hit("[data-filter]").dataset.filter
          return refreshTasks()
        }
        if (hit("[data-day]")) {
          state.day = Number(hit("[data-day]").dataset.day)
          return refreshSheet()
        }
        if (hit("[data-peek]")) {
          state.peek = hit("[data-peek]").dataset.peek
          return refreshSheet()
        }
        if (hit("[data-dismiss]")) return hit(".away").remove()
        if (hit(".seg button")) {
          for (const each of hit(".seg").children) each.setAttribute("aria-pressed", String(each === hit(".seg button")))
          return
        }
        const option = hit(".opt")
        if (option) {
          for (const each of document.querySelectorAll(".opt")) {
            each.setAttribute("aria-checked", String(each === option))
          }
        }
        const anchor = hit("[data-to]")
        if (anchor) {
          document.getElementById(anchor.dataset.to)?.scrollIntoView({ behavior: "smooth" })
          for (const each of anchor.parentElement.querySelectorAll("a")) {
            each.classList.toggle("cur", each === anchor)
          }
        }
      })
      app.addEventListener("input", (event) => {
        const field = event.target
        if (field.id === "tk-q") {
          state.query = field.value
          document.getElementById("tk-rows").innerHTML = taskRows()
        }
        if (field.id === "pal-q") {
          Object.assign(state, { palette: field.value, picked: 0 })
          document.getElementById("pal-list").innerHTML = paletteList()
        }
        if (field.matches(".composer textarea")) {
          const slash = field.form.querySelector(".slash")
          const commands = [
            ["/next-task", "次のタスクを進める"],
            ["/plan-tasks", "指示をタスクにする"],
            ["/compact", "会話をまとめて文脈を空ける"],
            ["/clear", "新しく始める"],
          ].filter(([name]) => field.value.startsWith("/") && name.startsWith(field.value.trim()))
          slash.hidden = commands.length === 0
          slash.innerHTML = commands.map(([name, note]) => `<div><code>${name}</code><small>${note}</small></div>`).join("")
        }
      })
      // 仕事では、送ると働くへ・答えると働くへ戻る。雑談では、打った文が並んで決まった返事が返る。
      app.addEventListener("submit", (event) => {
        event.preventDefault()
        if (chatting()) {
          const field = event.target.querySelector("textarea")
          const thread = document.getElementById("thread")
          if (!field || field.value.trim() === "") return
          const mine = document.createElement("div")
          mine.className = "ch-me"
          mine.append(Object.assign(document.createElement("p"), { textContent: field.value }))
          const hers = document.createElement("div")
          hers.className = "ch-her"
          hers.innerHTML = `<small>${pack().name}</small><p>${pack().reply}</p>`
          thread.append(mine, hers)
          field.value = ""
          thread.scrollTop = thread.scrollHeight
          return
        }
        if (state.moment !== "work") go({ moment: "work" })
      })
      document.addEventListener("keydown", (event) => {
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") {
          event.preventDefault()
          return go({ overlay: toggle("overlay", "palette") })
        }
        if (event.key === "Escape") {
          if (state.overlay) return go({ overlay: null })
          if (state.sheet) return go({ sheet: null })
        }
        const field = event.target.closest?.("input, textarea, [contenteditable]")
        if (field?.id === "pal-q") {
          const size = paletteItems().length
          if (event.key === "ArrowDown" || event.key === "ArrowUp") {
            event.preventDefault()
            const step = event.key === "ArrowDown" ? 1 : -1
            state.picked = Math.max(0, Math.min(size - 1, state.picked + step))
            document.getElementById("pal-list").innerHTML = paletteList()
            document.querySelector('.pal-i[aria-selected="true"]')?.scrollIntoView({ block: "nearest" })
          }
          if (event.key === "Enter") runPalette(state.picked)
          return
        }
        const inTasks = state.sheet === "tasks" && (!field || field.id === "tk-q")
        if (inTasks && (event.key === "ArrowDown" || event.key === "ArrowUp")) {
          event.preventDefault()
          return stepTask(event.key === "ArrowDown" ? 1 : -1)
        }
        if (inTasks && event.key === "Enter") {
          const task = TASKS.find((each) => each.id === state.task)
          if (task && !task.blocked) dispatchTask()
          return
        }
        if (field) {
          if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) field.form?.requestSubmit()
          return
        }
        if (state.sheet || state.overlay) return
        if (!chatting() && state.moment === "ask" && /^[1-3]$/.test(event.key)) {
          return document.querySelectorAll(".opt")[Number(event.key) - 1]?.click()
        }
        if (!chatting() && state.moment === "ask" && event.key === "Enter") return go({ moment: "work" })
        if (event.key === "ArrowUp") stepMoment(-1)
        if (event.key === "ArrowDown") stepMoment(1)
        if (event.key === "t") go({ tone: state.tone === "night" ? "day" : "night" })
        if (event.key === "h") go({ bar: !state.bar })
      })
      narrow.addEventListener("change", render)

      // 手元に唐傘の素材が無ければ、同梱の立ち絵に落とす。
      const probe = new Image()
      probe.addEventListener("error", () => {
        if (state.pack === "karakasa") {
          delete PACKS.karakasa
          go({ pack: "tsukumo" })
        }
      })
      probe.src = `${PACKS.karakasa.dir}/default.png`
      for (const [file] of EXPRESSION_NAMES) new Image().src = `${pack().dir}/${file}.png`
      render()
    </script>
  </body>
</html>
