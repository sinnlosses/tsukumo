<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>手順の図の実装役の箱 — 場面（?form=now|a|b|c&amp;at=impl3|accept）</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1d1b22;
    --surface: #26232c;
    --ink: #ece7ef;
    --ink-soft: color-mix(in srgb, var(--ink) 72%, transparent);
    --ink-quiet: color-mix(in srgb, var(--ink) 50%, transparent);
    --line: color-mix(in srgb, var(--ink) 12%, transparent);
    --accent: #f4b6c6;
    --accent-weak: color-mix(in srgb, var(--accent) 18%, transparent);
    --ok: #8fd6a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #121016; font: 14px/1.6 system-ui, "Hiragino Sans", sans-serif; color: var(--ink); }
  .panel { width: 900px; margin: 16px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px 22px; }
  .top { display: flex; justify-content: space-between; color: var(--ink-quiet); font-size: 12px; }
  .badge { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 1px 10px; color: var(--ink-soft); font-size: 12px; }
  .title { display: flex; gap: 10px; align-items: center; margin: 8px 0 14px; font-weight: 600; }
  .run { background: var(--accent-weak); color: var(--accent); border-radius: 999px; padding: 0 10px; font-size: 12px; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); column-gap: 28px; row-gap: 10px; position: relative; }
  .tab { display: flex; justify-content: space-between; color: var(--ink-quiet); border-bottom: 2px solid var(--line); padding-bottom: 6px; font-size: 13px; }
  .tab.now { color: var(--ink); border-color: var(--accent); font-weight: 600; }
  .tab.done { color: var(--ink-soft); }
  .tab small { font-weight: 400; color: var(--ink-quiet); font-size: 12px; }
  .cell { margin-top: 26px; min-height: 64px; display: flex; align-items: center; }
  .ph { width: 100%; height: 44px; border: 1px dashed var(--line); border-radius: 10px; display: flex; align-items: center; padding: 0 12px; color: var(--ink-quiet); font-size: 13px; }
  .ph.now { border-style: solid; border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--ink-soft); }
  .ph.done { color: var(--ink-quiet); }
  .ph .ck { color: var(--ok); margin-right: 6px; }
  .box { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 12px; }
  .box.running { border: 2px solid var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
  .box.done { opacity: .9; }
  .box .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .box .name { font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
  .dot.ok { background: var(--ok); }
  .time { color: var(--ink-quiet); font-size: 12px; }
  .tag { display: inline-block; margin-top: 4px; background: color-mix(in srgb, var(--ink) 12%, transparent); border-radius: 999px; padding: 0 8px; font-size: 12px; color: var(--ink-soft); }
  .note { color: var(--ink-quiet); font-size: 12px; margin-top: 4px; }
  .note b { color: var(--accent); font-weight: 600; }
  /* 案A: 範囲にまたがる箱と、中の段の目盛り */
  .span { grid-column: 1 / span 3; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 28px; margin-top: 8px; }
  .seg span { height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--ok) 55%, transparent); position: relative; }
  .seg span.now { background: var(--accent); }
  .seg span.todo { background: var(--line); }
  .seg-l { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 28px; font-size: 12px; color: var(--ink-quiet); margin-top: 3px; }
  .seg-l .now { color: var(--accent); }
  .muted { border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  svg.arrows { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
</style>
</head>
<body>
<div class="panel" id="panel"></div>
<script>
const q = new URLSearchParams(location.search)
const form = q.get("form") ?? "now"
const at = q.get("at") ?? "impl3"
const phases = ["impl-1", "impl-2", "impl-3", "accept"]
const times = at === "impl3" ? ["1分21秒", "37秒", "2分54秒〜", ""] : ["1分21秒", "37秒", "2分54秒", "48秒〜"]
const nowIdx = at === "impl3" ? 2 : 3
const tabs = phases.map((p, i) => `<div class="tab ${i === nowIdx ? "now" : i < nowIdx ? "done" : ""}">${p}<small>${times[i]}</small></div>`).join("")
const implRunning = at === "impl3"
const implBox = (extra = "", note = "") => `
  <div class="box ${implRunning ? "running" : "done"} ${extra}">
    <div class="row"><span class="name"><span class="dot ${implRunning ? "" : "ok"}"></span>実装</span><span class="time">${implRunning ? "4分53秒" : "4分53秒"}</span></div>
    <span class="tag">implementer</span>${note}
  </div>`
const acceptBox = `
  <div class="box running"><div class="row"><span class="name"><span class="dot"></span>受け入れ</span><span class="time">48秒</span></div><span class="tag">acceptor</span></div>`
const ph = (i, label) => `<div class="ph ${i === nowIdx ? "now" : ""}">${phases[i]} · ${label ?? (i === nowIdx ? "いま" : i < nowIdx ? "済み" : "これから")}</div>`
let cells = ""
if (form === "now") {
  cells = `<div class="cell">${implBox()}</div><div class="cell">${ph(1, "これから")}</div><div class="cell">${ph(2)}</div><div class="cell">${at === "accept" ? acceptBox : ph(3)}</div>`
} else if (form === "a") {
  const segs = [0, 1, 2].map((i) => `<span class="${implRunning ? (i < 2 ? "" : "now") : ""}"></span>`).join("")
  const segl = [0, 1, 2].map((i) => `<span class="${implRunning && i === 2 ? "now" : ""}">${implRunning && i === 2 ? "impl-3 · いま" : phases[i] + " ✓"}</span>`).join("")
  cells = `<div class="cell span">
    <div class="box ${implRunning ? "running" : "done"}" style="width:100%">
      <div class="row"><span class="name"><span class="dot ${implRunning ? "" : "ok"}"></span>実装 <span class="tag" style="margin:0">implementer</span></span><span class="time">4分53秒</span></div>
      <div class="seg">${segs}</div><div class="seg-l">${segl}</div>
    </div></div>
    <div class="cell">${at === "accept" ? acceptBox : ph(3)}</div>`
} else if (form === "b") {
  const where = implRunning ? 2 : 2
  cells = [0, 1, 2].map((i) => i === where ? `<div class="cell">${implBox("", `<div class="note">impl-1 から受け持ち</div>`)}</div>` : `<div class="cell"><div class="ph done"><span class="ck">✓</span>${phases[i]} · 済み</div></div>`).join("") +
    `<div class="cell">${at === "accept" ? acceptBox : ph(3)}</div>`
} else if (form === "c") {
  cells = `<div class="cell">${implRunning ? `<div class="box muted"><div class="row"><span class="name"><span class="dot"></span>実装</span><span class="time">4分53秒</span></div><span class="tag">implementer</span><div class="note">いまは <b>impl-3</b> を進めている</div></div>` : implBox("", `<div class="note">impl-1〜3 を受け持った</div>`)}</div>
    <div class="cell"><div class="ph done"><span class="ck">✓</span>impl-2 · 実装が済ませた</div></div>
    <div class="cell">${implRunning ? `<div class="ph now" style="border-width:2px;border-color:var(--accent)">impl-3 · いま（実装）</div>` : `<div class="ph done"><span class="ck">✓</span>impl-3 · 実装が済ませた</div>`}</div>
    <div class="cell">${at === "accept" ? acceptBox : ph(3)}</div>`
}
document.getElementById("panel").innerHTML = `
  <div class="top"><span>依頼の手順</span><span class="badge">6 フェーズ</span></div>
  <div class="title">着手の印が立ったタスク1件を、実装 → 受け入れ → 振り返りの段で進める <span class="run">動いている 1</span></div>
  <div class="grid" id="grid">${tabs}${cells}</div>`
</script>
</body>
</html>
