<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>完了と失敗のエフェクト — 別案（2026-11-21）</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #15131b;
    --surface: #1f1c27;
    --ink: #ece7ef;
    --ink-soft: color-mix(in srgb, var(--ink) 70%, transparent);
    --ink-quiet: color-mix(in srgb, var(--ink) 50%, transparent);
    --line: color-mix(in srgb, var(--ink) 12%, transparent);
    --accent: #6fe3cd;
    --accent-soft: color-mix(in srgb, var(--accent) 16%, transparent);
    --gold: #ffd98a;
    --k: 1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.6 system-ui, sans-serif; }
  header.page { max-width: 1280px; margin: 0 auto; padding: 22px 24px 6px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: end; }
  header.page h1 { font-size: 20px; margin: 0; }
  header.page p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; max-width: 760px; }
  .toolbar { margin-left: auto; display: flex; gap: 8px; }
  .toolbar button {
    all: unset; cursor: pointer; padding: 4px 14px; border-radius: 999px; border: 1px solid var(--line);
    font-size: 13px; color: var(--ink-soft);
  }
  .toolbar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: transparent; }
  .toolbar button:focus-visible { outline: 2px solid var(--accent); }

  main { max-width: 1280px; margin: 0 auto; padding: 14px 24px 48px; }
  h2 { font-size: 13px; color: var(--ink-quiet); font-weight: 600; margin: 22px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: clip; display: flex; flex-direction: column; }
  .card.base { border-style: dashed; }
  .stage {
    all: unset; cursor: pointer; display: block; position: relative; height: 360px; overflow: clip;
    background: radial-gradient(110% 70% at 30% 0%, #2a2537 0%, transparent 60%), linear-gradient(#1b1923, #14121a);
  }
  .stage:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .portrait { position: absolute; left: 50%; bottom: -6px; height: 350px; aspect-ratio: 1145 / 1374; translate: -50% 0; }
  .portrait > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .portrait.bounce { animation: bounce calc(0.55s * var(--k)) ease-out 1; }
  @keyframes bounce { 30% { translate: -50% -8px; } 60% { translate: -50% 2px; } }
  .fx { position: absolute; inset: 0; pointer-events: none; }
  .back { position: absolute; inset: 0; pointer-events: none; z-index: -1; }
  .portrait { isolation: isolate; }
  .a { position: absolute; left: calc(var(--ax) * 100%); top: calc(var(--ay) * 100%); width: 0; height: 0; }
  .p { position: absolute; left: var(--x, 0px); top: var(--y, 0px); opacity: 0; will-change: transform, opacity; }
  .meta { padding: 10px 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .meta .row { display: flex; align-items: baseline; gap: 8px; }
  .meta h3 { margin: 0; font-size: 15px; }
  .meta .tag { margin-left: auto; font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .base .meta .tag { background: transparent; color: var(--ink-quiet); border: 1px dashed var(--line); }
  .meta p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .meta dl { margin: 2px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; }
  .meta dt { color: var(--ink-quiet); }
  .meta dd { margin: 0; color: var(--ink-soft); }

  /* 立ち絵の形をなぞる重ね（画像そのものを mask にする）。パックの素材は書き換えない */
  .silhouette { position: absolute; inset: 0; pointer-events: none;
    -webkit-mask: var(--img) center / contain no-repeat; mask: var(--img) center / contain no-repeat; }

  .glow { filter: drop-shadow(0 0 6px var(--c, #fff)) drop-shadow(0 0 14px color-mix(in srgb, var(--c, #fff) 50%, transparent)); }
  .sparkle { --c: #ffe6a3; width: var(--s); height: var(--s); margin: calc(var(--s) / -2); animation: sparkle calc(1.1s * var(--k)) cubic-bezier(.3,1.4,.5,1) var(--d, 0s) 1 forwards; }
  @keyframes sparkle { 0% { opacity: 0; scale: 0; rotate: -60deg; } 35% { opacity: 1; scale: 1.15; rotate: 0deg; } 60% { opacity: 1; scale: .9; } 100% { opacity: 0; scale: .2; rotate: 30deg; } }

  /* ===== 基準: tsukumo-3 の見本（effects-2026-11-21）の祝光と翳り ===== */
  .flashBg { position: absolute; inset: -30% -60%; opacity: 0;
    background: radial-gradient(60% 50% at 50% 20%, rgb(255 236 190 / .28), rgb(255 200 150 / .1) 55%, transparent 80%);
    animation: flashBg calc(1.4s * var(--k)) ease-out 1 forwards; }
  @keyframes flashBg { 0% { opacity: 0; } 15% { opacity: 1; } 100% { opacity: 0; } }
  .halo { width: 40px; height: 40px; margin: -20px; border-radius: 50%; border: 2px solid rgb(255 240 200 / .9);
    box-shadow: 0 0 18px rgb(255 220 150 / .7), inset 0 0 12px rgb(255 220 150 / .5);
    animation: halo calc(1.2s * var(--k)) cubic-bezier(.1,.7,.3,1) var(--d, 0s) 1 forwards; }
  @keyframes halo { 0% { opacity: 0; scale: .2; } 20% { opacity: 1; } 100% { opacity: 0; scale: 5; border-width: .4px; } }
  .beam { width: 3px; height: 60px; margin: -30px -1.5px; border-radius: 3px;
    background: linear-gradient(transparent, #fff6d8 50%, transparent); filter: drop-shadow(0 0 6px #ffd98a);
    animation: beam calc(0.9s * var(--k)) ease-out calc(0.1s * var(--k)) 1 forwards; }
  @keyframes beam { 0% { opacity: 0; transform: translateY(0) scale(1, .2); } 40% { opacity: 1; transform: translateY(-40px) scale(1, 1); } 100% { opacity: 0; transform: translateY(-80px) scale(1, .3); } }
  .bloom { width: 120px; height: 120px; margin: -60px; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(255 230 200 / .55), rgb(255 160 190 / .18) 55%, transparent);
    animation: bloom calc(1s * var(--k)) ease-out 1 forwards; }
  @keyframes bloom { 0% { opacity: 0; scale: .3; } 30% { opacity: 1; } 100% { opacity: 0; scale: 1.5; } }
  .petal { width: 15px; height: 10px; margin: -5px -7.5px; border-radius: 80% 0 80% 0;
    background: linear-gradient(135deg, #fff 10%, var(--pc) 70%); box-shadow: 0 0 8px var(--pc);
    animation: petal calc(1.9s * var(--k)) cubic-bezier(.15,.7,.4,1) var(--d) 1 forwards; }
  @keyframes petal {
    0% { opacity: 0; transform: translate(0,0) rotate(0) scale(.4); }
    12% { opacity: 1; }
    40% { transform: translate(calc(var(--dx) * .8), var(--dy)) rotate(calc(var(--rot) * .5)) scale(1); }
    100% { opacity: 0; transform: translate(var(--dx), calc(var(--dy) + 120px)) rotate(var(--rot)) scale(.8); }
  }
  .shade { position: absolute; inset: -20% -40%; opacity: 0;
    backdrop-filter: saturate(.25) brightness(.85);
    background: radial-gradient(120% 90% at 50% 40%, transparent 35%, rgb(10 8 20 / .75));
    animation: shade calc(1.6s * var(--k)) ease-in-out 1 forwards; }
  @keyframes shade { 0% { opacity: 0; } 18%, 60% { opacity: 1; } 100% { opacity: 0; } }
  .shard { width: 2px; height: 30px; margin: -15px -1px; background: linear-gradient(transparent, rgb(170 160 220 / .9));
    rotate: var(--r); animation: shard calc(1.1s * var(--k)) ease-in var(--d) 1 forwards; }
  @keyframes shard { 0% { opacity: 0; transform: translateY(-20px); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateY(40px); } }

  /* ===== 完了 A: 光沢（シャイン） =====
     立ち絵の形に沿って斜めの光沢が一度だけ走り、輪郭が金に縁取られて、星が2つ瞬く */
  .shine { background: linear-gradient(115deg, transparent 35%, rgb(255 250 230 / .0) 40%, rgb(255 250 230 / .85) 50%, rgb(255 230 170 / .0) 60%, transparent 65%) no-repeat;
    background-size: 260% 100%; background-position: 130% 0; mix-blend-mode: screen; opacity: 1;
    animation: shine calc(0.9s * var(--k)) cubic-bezier(.5,0,.3,1) calc(0.15s * var(--k)) 1 forwards; }
  @keyframes shine { from { background-position: 130% 0; } to { background-position: -30% 0; } }
  .rim { filter: drop-shadow(0 0 0 transparent); opacity: 0; animation: rim calc(1.5s * var(--k)) ease-out 1 forwards; }
  @keyframes rim { 0% { opacity: 0; filter: drop-shadow(0 0 0 rgb(255 217 138 / 0)); } 25% { opacity: 1; filter: drop-shadow(0 0 10px rgb(255 217 138 / .9)); } 100% { opacity: 0; filter: drop-shadow(0 0 18px rgb(255 217 138 / 0)); } }

  /* ===== 完了 B: 金の一筆 =====
     背後に金の細い円弧が一筆で描かれ、筆先で星が瞬き、金の粉が静かに降る */
  .stroke { width: 300px; height: 300px; margin: -150px; animation: strokeFade calc(2.1s * var(--k)) ease-out 1 forwards; }
  .stroke path { fill: none; stroke: url(#gGold); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 760; stroke-dashoffset: 760;
    filter: drop-shadow(0 0 6px rgb(255 217 138 / .8));
    animation: draw calc(0.85s * var(--k)) cubic-bezier(.65,0,.25,1) 1 forwards; }
  .stroke path.thin { stroke-width: 1.2; opacity: .6; animation-delay: calc(0.12s * var(--k)); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes strokeFade { 0% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
  .fall { width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff4cf; box-shadow: 0 0 6px #ffd98a;
    animation: fall calc(1.6s * var(--k)) cubic-bezier(.3,.1,.6,1) var(--d) 1 forwards; }
  @keyframes fall { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), 120px); } }

  /* ===== 完了 C: リボンの紙吹雪 =====
     頭の上で細いリボンが弾け、3D に翻りながら舞い落ちる（色は3色だけ） */
  .ribbon { width: 6px; height: 16px; margin: -8px -3px; border-radius: 1.5px; background: var(--pc);
    box-shadow: 0 0 6px color-mix(in srgb, var(--pc) 60%, transparent);
    animation: ribbon calc(2s * var(--k)) linear var(--d) 1 forwards, ribbonFade calc(2s * var(--k)) linear var(--d) 1 forwards; }
  /* 弾けるところだけ速く、あとは一定の速さで落ちる。透明度は別の動きにして、落ちる途中で薄れないようにする */
  @keyframes ribbon {
    0% { transform: translate(0, 0) rotateX(0) rotateZ(0) scale(.5); animation-timing-function: cubic-bezier(.1,.8,.3,1); }
    25% { transform: translate(calc(var(--dx) * .85), var(--dy)) rotateX(300deg) rotateZ(calc(var(--rot) * .4)) scale(1); animation-timing-function: cubic-bezier(.4,0,.8,.8); }
    100% { transform: translate(var(--dx), calc(var(--dy) + 170px)) rotateX(1260deg) rotateZ(var(--rot)) scale(.9); }
  }
  @keyframes ribbonFade { 0% { opacity: 0; } 6%, 75% { opacity: 1; } 100% { opacity: 0; } }
  .pop { width: 70px; height: 70px; margin: -35px; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(255 255 255 / .9), rgb(255 230 180 / .35) 45%, transparent);
    animation: pop calc(0.5s * var(--k)) ease-out 1 forwards; }
  @keyframes pop { 0% { opacity: 0; scale: .2; } 30% { opacity: 1; } 100% { opacity: 0; scale: 1.6; } }

  /* ===== 失敗 A: グリッチ =====
     立ち絵が一瞬だけ赤と青にずれ、横の走査線が2本走って元に戻る */
  .ghost { position: absolute; inset: 0; opacity: 0; mix-blend-mode: screen; }
  .ghost.r { background: rgb(255 60 90); animation: ghostR calc(0.6s * var(--k)) steps(6, end) 1 forwards; }
  .ghost.b { background: rgb(60 170 255); animation: ghostB calc(0.6s * var(--k)) steps(6, end) 1 forwards; }
  @keyframes ghostR { 0% { opacity: .95; translate: -8px 0; } 30% { opacity: .9; translate: 5px 1px; } 60% { opacity: .7; translate: -3px 0; } 100% { opacity: 0; translate: 0 0; } }
  @keyframes ghostB { 0% { opacity: .95; translate: 8px 0; } 30% { opacity: .9; translate: -5px -1px; } 60% { opacity: .7; translate: 3px 0; } 100% { opacity: 0; translate: 0 0; } }
  .slice { position: absolute; left: -10%; right: -10%; height: 10px; top: var(--t); opacity: 0;
    background: linear-gradient(90deg, transparent, rgb(200 220 255 / .55) 20%, rgb(255 255 255 / .8) 50%, rgb(200 220 255 / .55) 80%, transparent);
    mix-blend-mode: overlay; animation: slice calc(0.45s * var(--k)) steps(4, end) var(--d) 1 forwards; }
  @keyframes slice { 0% { opacity: 1; translate: -12px 0; } 50% { opacity: 1; translate: 10px 0; } 100% { opacity: 0; translate: 0 0; } }
  .desat { filter: saturate(.35) brightness(.9); animation: desat calc(1.2s * var(--k)) ease-out 1 forwards; }
  @keyframes desat { 0%, 40% { filter: saturate(.35) brightness(.9); } 100% { filter: none; } }
  .err { font: 600 11px/1 ui-monospace, Menlo, monospace; letter-spacing: .08em; color: rgb(255 140 160); white-space: nowrap;
    padding: 3px 7px; border-radius: 4px; background: rgb(40 10 20 / .65); border: 1px solid rgb(255 110 140 / .45);
    animation: err calc(1.4s * var(--k)) steps(1, end) 1 forwards; }
  @keyframes err { 0% { opacity: 1; translate: -3px 0; } 8% { opacity: 0; } 14% { opacity: 1; translate: 2px 0; } 22% { translate: 0 0; } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* ===== 失敗 B: ひび =====
     頭の横の空中にガラスのひびが一筆で入り、欠片が2つ落ちて、ひびごと消える */
  .crack { width: 120px; height: 120px; margin: -60px; animation: crackFade calc(1.7s * var(--k)) ease-in 1 forwards; }
  .crack path { fill: none; stroke: rgb(220 230 255 / .95); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 200; stroke-dashoffset: 200; filter: drop-shadow(0 0 4px rgb(160 190 255 / .9));
    animation: draw calc(0.28s * var(--k)) cubic-bezier(.7,0,.9,.4) var(--d, 0s) 1 forwards; }
  @keyframes crackFade { 0% { opacity: 1; } 65% { opacity: 1; } 100% { opacity: 0; } }
  .chip-fall { width: 12px; height: 9px; margin: -4px -6px; clip-path: polygon(0 20%, 70% 0, 100% 80%, 30% 100%);
    background: linear-gradient(135deg, rgb(240 245 255 / .95), rgb(150 175 230 / .6));
    animation: chipFall calc(1.1s * var(--k)) cubic-bezier(.5,0,.9,.6) var(--d) 1 forwards; }
  @keyframes chipFall { 0% { opacity: 1; transform: translate(0, 0) rotate(0); } 100% { opacity: 0; transform: translate(var(--dx), 110px) rotate(var(--rot)); } }
  .flinch { animation: flinch calc(0.35s * var(--k)) cubic-bezier(.3,0,.3,1) 1; }
  @keyframes flinch { 0% { translate: -50% 0; } 25% { translate: calc(-50% - 5px) 0; } 50% { translate: calc(-50% + 4px) 0; } 75% { translate: calc(-50% - 2px) 0; } }

  /* ===== 失敗 C: 消灯 =====
     狐火のような灯りが2つ、ふっと揺れて消え、細い煙が昇る。足もとの光が一段落ちる */
  .wisp { width: 22px; height: 30px; margin: -15px -11px; border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    background: radial-gradient(circle at 50% 65%, #fff 0 18%, rgb(140 235 215 / .9) 40%, rgb(111 227 205 / 0) 72%);
    filter: blur(.4px) drop-shadow(0 0 10px rgb(111 227 205 / .8));
    animation: wisp calc(1.1s * var(--k)) ease-in var(--d) 1 forwards; }
  @keyframes wisp { 0% { opacity: 0; scale: .6; } 20% { opacity: 1; scale: 1; } 45% { opacity: 1; scale: 1.05 .9; } 60% { opacity: .9; scale: .9 1.1; } 100% { opacity: 0; scale: .2 .5; translate: 0 6px; } }
  .smoke { width: 18px; height: 18px; margin: -9px; border-radius: 50%;
    background: radial-gradient(closest-side, rgb(200 200 220 / .45), transparent); filter: blur(2px);
    animation: smoke calc(1.6s * var(--k)) ease-out var(--d) 1 forwards; }
  @keyframes smoke { 0% { opacity: 0; transform: translate(0, 0) scale(.6); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), -70px) scale(2.2); } }
  .dim { position: absolute; inset: 0; opacity: 0;
    background: linear-gradient(to top, rgb(8 6 18 / .7), rgb(8 6 18 / .25) 45%, transparent 70%);
    animation: dim calc(1.8s * var(--k)) ease-in-out calc(0.35s * var(--k)) 1 forwards; }
  @keyframes dim { 0% { opacity: 0; } 30%, 70% { opacity: 1; } 100% { opacity: 0; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gStar" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".5" stop-color="#fff1c4" />
      <stop offset="1" stop-color="#ffd27a" />
    </radialGradient>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6dc" />
      <stop offset=".5" stop-color="#ffd98a" />
      <stop offset="1" stop-color="#e7a85a" stop-opacity=".5" />
    </linearGradient>
  </defs>
</svg>

<header class="page">
  <div>
    <h1>完了と失敗のエフェクト — 別案</h1>
    <p>tsukumo-3 の見本（effects-2026-11-21）の「祝光」「翳り」を基準に、同じ光・粒・ぼかしの語彙でもう少し洗練させた別案を3つずつ並べた。立ち絵の形をなぞる案は、画像そのものを mask にした重ねで描き、パックの素材は書き換えない。カードを押すともう一度再生する。</p>
  </div>
  <div class="toolbar">
    <button type="button" id="replay">全部を再生</button>
    <button type="button" id="slow" aria-pressed="false">ゆっくり（×3）</button>
    <button type="button" id="loop" aria-pressed="true">繰り返す</button>
  </div>
</header>

<main>
  <h2>タスクの完了</h2>
  <div class="grid" id="finish"></div>
  <h2>失敗</h2>
  <div class="grid" id="fail"></div>
</main>

<script>
const IMG = (name) => `../../../../characters/tsukumo/${name}.png`
const STAR = '<path d="M50 0 C54 38 62 46 100 50 C62 54 54 62 50 100 C46 62 38 54 0 50 C38 46 46 38 50 0Z" fill="url(#gStar)" />'

const FINISH = [
  { id: "finish-base", base: true, label: "祝光", tag: "基準（tsukumo-3）", img: "proud", ax: 0.42, ay: 0.2, fx: "baseFinish", bounce: true,
    what: "背景が明るみ、光の輪が2重に広がり、12本の光の筋・星5つ・花吹雪が一斉に弾ける。",
    feel: "華やか。要素が4種類重なり、にぎやか寄り", cost: "粒が約40個" },
  { id: "finish-shine", label: "光沢", tag: "案A", img: "proud", ax: 0.42, ay: 0.2, fx: "shine", bounce: true,
    what: "立ち絵の形に沿って斜めの光沢が一度だけ走り、輪郭が金に縁取られて、星が2つ瞬く。",
    feel: "カードのホログラムのような上品さ。立ち絵が主役のまま", cost: "重ね2枚＋星2つ。立ち絵の画像を mask に使う" },
  { id: "finish-stroke", label: "金の一筆", tag: "案B", img: "proud", ax: 0.42, ay: 0.2, fx: "stroke", bounce: false,
    what: "背後に金の細い円弧が一筆で描かれ、筆先で星が1つ瞬き、金の粉が静かに降る。",
    feel: "和の意匠。落ち着いた達成感で、毎回見ても飽きにくい", cost: "SVG の線2本＋粉8つ" },
  { id: "finish-ribbon", label: "リボンの紙吹雪", tag: "案C", img: "proud", ax: 0.42, ay: 0.2, fx: "ribbon", bounce: true,
    what: "頭の上で光がぽんと弾け、細いリボンが3D に翻りながら舞い落ちる。色はアクセント・金・桃の3色だけ。",
    feel: "いちばん「おめでとう」が伝わる。色を絞って子どもっぽさを抑える", cost: "リボン18枚" },
]
const FAIL = [
  { id: "fail-base", base: true, label: "翳り", tag: "基準（tsukumo-3）", img: "flustered", ax: 0.45, ay: 0.27, fx: "baseFail",
    what: "立ち絵の色が一瞬抜け、縁が暗くなり、細い欠片が落ちる。",
    feel: "重く沈む。backdrop-filter で周りの画面ごと暗くなる", cost: "全面の backdrop-filter（重め）" },
  { id: "fail-glitch", label: "グリッチ", tag: "案A", img: "flustered", ax: 0.45, ay: 0.27, fx: "glitch",
    what: "立ち絵が一瞬だけ赤と青にずれ、横の走査線が2本走り、小さな ERR の札が瞬いて元に戻る。",
    feel: "ターミナルの道具らしい。暗くしすぎず、0.6 秒で終わる", cost: "立ち絵の画像を mask にした重ね2枚＋線2本" },
  { id: "fail-crack", label: "ひび", tag: "案B", img: "flustered", ax: 0.45, ay: 0.27, fx: "crack",
    what: "頭の横の空中にガラスのひびが一筆で入り、立ち絵が小さく身じろぎし、欠片が2つ落ちて消える。",
    feel: "「割れた」が一目で分かる。顔と画は覆わない", cost: "SVG の線3本＋欠片2つ" },
  { id: "fail-out", label: "消灯", tag: "案C", img: "flustered", ax: 0.45, ay: 0.27, fx: "out",
    what: "頭の両脇に灯りが2つ灯り、ふっと揺れて消え、細い煙が昇る。足もとの光が一段落ちる。",
    feel: "しょんぼりの余韻。完了の光と対になる", cost: "灯り2つ＋煙2つ＋下からの影" },
]

function piece(parent, cls, vars = {}, html = "") {
  const e = document.createElement("span")
  e.className = "p " + cls
  for (const [k, v] of Object.entries(vars)) e.style.setProperty(k, v)
  e.innerHTML = html
  parent.append(e)
  return e
}
function layer(parent, cls, vars = {}) {
  const e = document.createElement("span")
  e.className = cls
  for (const [k, v] of Object.entries(vars)) e.style.setProperty(k, v)
  parent.append(e)
  return e
}
const svg = (viewBox, inner) => `<svg viewBox="${viewBox}" width="100%" height="100%" style="overflow:visible">${inner}</svg>`
const star = (a, x, y, s, d) => piece(a, "sparkle glow", { "--x": `${x}px`, "--y": `${y}px`, "--s": `${s}px`, "--d": `calc(${d}s * var(--k))` }, svg("0 0 100 100", STAR))

function burstPetals(a, count, scale, wide) {
  piece(a, "bloom", { "--x": "0px", "--y": "-40px" }).style.scale = wide ? "1.8" : "1"
  const colors = ["#ff8fb1", "#ffc56b", "#6fe3cd", "#ff9fd0", "#ffe27a"]
  for (let i = 0; i < count; i++) {
    const t = -Math.PI / 2 + ((i / (count - 1)) - 0.5) * Math.PI * (wide ? 1.9 : 1.2)
    const dist = (55 + (i % 4) * 14) * scale
    piece(a, "petal", { "--x": "0px", "--y": "-40px", "--pc": colors[i % colors.length],
      "--dx": `${Math.cos(t) * dist * 1.3}px`, "--dy": `${Math.sin(t) * dist}px`,
      "--rot": `${(i % 2 ? 1 : -1) * (240 + i * 20)}deg`, "--d": `calc(${(i % 5) * 0.04}s * var(--k))` })
  }
}

const FX = {
  baseFinish({ a, fx }) {
    layer(fx, "flashBg")
    piece(a, "halo", { "--x": "0px", "--y": "-10px" })
    piece(a, "halo", { "--x": "0px", "--y": "-10px", "--d": "calc(0.2s * var(--k))" })
    for (let i = 0; i < 12; i++) {
      const wrap = document.createElement("span")
      wrap.style.cssText = `position:absolute;left:0;top:-10px;rotate:${i * 30 + 15}deg`
      piece(wrap, "beam").style.height = i % 2 ? "44px" : "72px"
      a.append(wrap)
    }
    for (const [x, y, s, d] of [[-86, -56, 38, .2], [92, -70, 30, .32], [76, 40, 22, .44], [-72, 46, 20, .55], [8, -110, 26, .38]]) star(a, x, y, s, d)
    burstPetals(a, 20, 1.5, true)
  },
  shine({ a, fx, back, img }) {
    // 背後に同じ画を置いて金の光で縁取る（前の立ち絵に隠れ、輪郭の外だけが光る）
    const rim = layer(back, "rim")
    rim.style.cssText += `;position:absolute;inset:0;background:url(${img}) center/contain no-repeat`
    layer(fx, "silhouette shine", { "--img": `url(${img})` })
    star(a, -78, -46, 34, .55)
    star(a, 88, -64, 24, .7)
  },
  stroke({ a, back }) {
    // 円弧は立ち絵の背後に描く
    const behind = document.createElement("span")
    behind.className = "a"
    behind.style.cssText = a.style.cssText
    back.append(behind)
    piece(behind, "stroke", { "--x": "10px", "--y": "40px" },
      svg("0 0 300 300", `<path d="M58 238 C 10 150, 70 40, 165 34 C 250 30, 300 120, 262 196" />
        <path class="thin" d="M78 246 C 36 166, 86 62, 166 54 C 236 50, 282 128, 250 192" />`)).style.opacity = "1"
    star(a, 122, 66, 30, .7)
    for (let i = 0; i < 8; i++)
      piece(a, "fall", { "--x": `${-70 + i * 22}px`, "--y": `${-70 + (i % 3) * 14}px`, "--dx": `${(i % 2 ? 1 : -1) * 10}px`, "--d": `calc(${0.55 + (i % 4) * 0.12}s * var(--k))` })
  },
  ribbon({ a }) {
    // 枠の上端で切れないよう、弾ける高さを抑えて横へ広げ、立ち絵の前を舞い落ちさせる
    piece(a, "pop", { "--x": "0px", "--y": "-20px" })
    const colors = ["#6fe3cd", "#ffd98a", "#ff9fbf"]
    for (let i = 0; i < 18; i++) {
      const t = -Math.PI / 2 + ((i / 17) - 0.5) * Math.PI * 1.6
      const dist = 38 + (i % 4) * 12
      piece(a, "ribbon", { "--x": "0px", "--y": "-20px", "--pc": colors[i % 3],
        "--dx": `${Math.cos(t) * dist * 2.4}px`, "--dy": `${Math.sin(t) * dist}px`,
        "--rot": `${(i % 2 ? 1 : -1) * (180 + i * 25)}deg`, "--d": `calc(${(i % 6) * 0.03}s * var(--k))` })
    }
  },
  baseFail({ a, fx }) {
    layer(fx, "shade")
    for (const [x, r, d] of [[-50, 10, .1], [-20, -6, .25], [30, 8, .15], [60, -10, .32]])
      piece(a, "shard", { "--x": `${x}px`, "--y": "-50px", "--r": `${r}deg`, "--d": `calc(${d}s * var(--k))` })
  },
  glitch({ a, fx, back, img, image }) {
    image.classList.add("desat")
    // 赤と青の写しを立ち絵の背後でずらす。前の立ち絵に隠れ、輪郭の外の縁だけが色ずれに見える
    layer(back, "silhouette ghost r", { "--img": `url(${img})` })
    layer(back, "silhouette ghost b", { "--img": `url(${img})` })
    layer(fx, "slice", { "--t": "24%", "--d": "0s" })
    layer(fx, "slice", { "--t": "41%", "--d": "calc(0.12s * var(--k))" }).style.height = "6px"
    piece(a, "err", { "--x": "-128px", "--y": "-96px" }, "ERR")
  },
  crack({ a, portrait }) {
    portrait.classList.add("flinch")
    piece(a, "crack", { "--x": "-92px", "--y": "-4px" }, svg("0 0 120 120",
      `<path d="M60 8 L54 38 L66 52 L50 78 L58 112" />
       <path style="--d: calc(0.1s * var(--k))" d="M54 38 L28 46 L14 40" />
       <path style="--d: calc(0.16s * var(--k))" d="M66 52 L92 60 L104 78" />`)).style.opacity = "1"
    piece(a, "chip-fall", { "--x": "-102px", "--y": "24px", "--dx": "-14px", "--rot": "-200deg", "--d": "calc(0.3s * var(--k))" })
    piece(a, "chip-fall", { "--x": "-78px", "--y": "48px", "--dx": "10px", "--rot": "160deg", "--d": "calc(0.42s * var(--k))" })
  },
  out({ a, fx }) {
    layer(fx, "dim")
    for (const [x, d] of [[-96, 0], [92, .12]]) {
      piece(a, "wisp", { "--x": `${x}px`, "--y": "-24px", "--d": `calc(${d}s * var(--k))` })
      piece(a, "smoke", { "--x": `${x}px`, "--y": "-34px", "--dx": `${x > 0 ? 10 : -10}px`, "--d": `calc(${0.75 + d}s * var(--k))` })
    }
  },
}

const cards = []
const playById = {}
function makeCard(item, into) {
  const card = document.createElement("article")
  card.className = item.base ? "card base" : "card"
  const img = IMG(item.img)
  card.innerHTML = `
    <button type="button" class="stage" aria-label="${item.label}のエフェクトを再生">
      <span class="portrait"><span class="back"></span><img alt="立ち絵（${item.label}）" src="${img}"><span class="fx"></span></span>
    </button>
    <div class="meta">
      <div class="row"><h3>${item.label}</h3><span class="tag">${item.tag}</span></div>
      <p>${item.what}</p>
      <dl><dt>印象</dt><dd>${item.feel}</dd><dt>重さ</dt><dd>${item.cost}</dd></dl>
    </div>`
  into.append(card)
  const portrait = card.querySelector(".portrait")
  const image = portrait.querySelector("img")
  const fx = card.querySelector(".fx")
  const back = card.querySelector(".back")
  const play = () => {
    fx.replaceChildren(); back.replaceChildren()
    portrait.classList.remove("bounce", "flinch"); image.classList.remove("desat")
    void portrait.offsetWidth
    if (item.bounce) portrait.classList.add("bounce")
    const a = document.createElement("span")
    a.className = "a"
    a.style.setProperty("--ax", item.ax)
    a.style.setProperty("--ay", item.ay)
    fx.append(a)
    FX[item.fx]({ a, fx, back, img, image, portrait })
  }
  card.querySelector(".stage").addEventListener("click", play)
  cards.push(play)
  playById[item.id] = { play, card }
}
FINISH.forEach((it) => makeCard(it, document.getElementById("finish")))
FAIL.forEach((it) => makeCard(it, document.getElementById("fail")))

const playAll = () => cards.forEach((p) => p())
document.getElementById("replay").addEventListener("click", playAll)
const slow = document.getElementById("slow")
slow.addEventListener("click", () => {
  const on = slow.getAttribute("aria-pressed") !== "true"
  slow.setAttribute("aria-pressed", String(on))
  document.documentElement.style.setProperty("--k", on ? "3" : "1")
  playAll()
})
const loopBtn = document.getElementById("loop")
let timer = null
const startLoop = () => { timer = setInterval(() => playAll(), 3200 * Number(getComputedStyle(document.documentElement).getPropertyValue("--k") || 1)) }
loopBtn.addEventListener("click", () => {
  const on = loopBtn.getAttribute("aria-pressed") !== "true"
  loopBtn.setAttribute("aria-pressed", String(on))
  clearInterval(timer)
  if (on) startLoop()
})
const params = new URLSearchParams(location.search)
if (params.has("still")) loopBtn.setAttribute("aria-pressed", "false")
else startLoop()
if (!matchMedia("(prefers-reduced-motion: reduce)").matches) playAll()
// 撮影用: freezeCard(id, 秒) でそのカードの全アニメーションを止める
window.freezeCard = (id, t) => {
  const { play, card } = playById[id]
  play()
  for (const anim of card.getAnimations({ subtree: true })) { anim.pause(); anim.currentTime = t * 1000 }
}
</script>
